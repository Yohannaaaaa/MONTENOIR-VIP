  .face-4 { transform: rotateY(-90deg) translateZ(29px); }
  .face-5 { transform: rotateX(90deg) translateZ(29px); }
  .face-6 { transform: rotateX(-90deg) translateZ(29px); }

const CENTER_CELL = [7,7];
const START_OFFSET = {red:0, yellow:26, pink:13, blue:39};
const SAFE_RING_IDX = new Set([0,13,26,39,8,21,34,47]);

function cellForToken(color, distance, tokenIndex) {
  if (distance === 0) return YARD_SLOTS[color][tokenIndex];
  if (distance <= 51) return PATH_CELLS[(START_OFFSET[color] + distance - 1) % 52];
  if (distance <= 57) return HOME_STRETCH[color][distance - 52];
  return CENTER_CELL;

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

}

// Board surface: same cell layout the old DOM grid used, painted onto a canvas
// texture instead of built from 225 grid cell elements — cheap to draw, sharp at any zoom.
function makeLudoBoardTexture() {
  const N = 15, PX = 1024, cellPx = PX / N;
  const c = document.createElement('canvas'); c.width = PX; c.height = PX;
  const ctx = c.getContext('2d');
  const roles = Array.from({ length: N }, () => Array(N).fill('deco'));
  const yardBlocks = { red: [0, 5, 0, 5], pink: [0, 5, 9, 14], yellow: [9, 14, 9, 14], blue: [9, 14, 0, 5] };
  Object.entries(yardBlocks).forEach(([color, [r1, r2, c1, c2]]) => {
    for (let r = r1; r <= r2; r++) for (let cc = c1; cc <= c2; cc++) roles[r][cc] = 'yard-' + color;
  });
  PATH_CELLS.forEach((rc, i) => { roles[rc[0]][rc[1]] = 'path' + (SAFE_RING_IDX.has(i) ? '-safe' : ''); });
  Object.entries(HOME_STRETCH).forEach(([color, cells]) => { cells.forEach(rc => { roles[rc[0]][rc[1]] = 'home-' + color; }); });

  const FILL = {
    deco: '#efe6cf', path: '#ffffff', 'path-safe': '#fff3c4',
    'yard-red': '#f6d3d3', 'yard-yellow': '#f8ecc0', 'yard-pink': '#f8d6e9', 'yard-blue': '#d3e0f6',
    'home-red': '#e88888', 'home-yellow': '#e0c14a', 'home-pink': '#e888c0', 'home-blue': '#7fa3e8',
  };
  for (let r = 0; r < N; r++) for (let cc = 0; cc < N; cc++) {
    if (r === 7 && cc === 7) continue; // center pinwheel drawn separately below
    ctx.fillStyle = FILL[roles[r][cc]] || '#efe6cf';
    ctx.fillRect(cc * cellPx, r * cellPx, cellPx, cellPx);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
    ctx.strokeRect(cc * cellPx, r * cellPx, cellPx, cellPx);
  }
  // corner diagonal accents, matching the original 2D board's corner gradients
  function corner(r, cc, colA, colB, diag) {
    const x = cc * cellPx, y = r * cellPx;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, cellPx, cellPx); ctx.clip();
    ctx.fillStyle = colA; ctx.fillRect(x, y, cellPx, cellPx);
    ctx.fillStyle = colB;
    ctx.beginPath();
    if (diag === 'tl-br') { ctx.moveTo(x, y); ctx.lineTo(x + cellPx, y); ctx.lineTo(x, y + cellPx); }
    else { ctx.moveTo(x + cellPx, y); ctx.lineTo(x + cellPx, y + cellPx); ctx.lineTo(x, y + cellPx); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  corner(6, 6, '#e0559b', '#dd3333', 'tl-br');
  corner(6, 8, '#e0559b', '#e0b400', 'tr-bl');
  corner(8, 6, '#dd3333', '#2a6fd6', 'tr-bl');
  corner(8, 8, '#e0b400', '#2a6fd6', 'tl-br');
  // center pinwheel: 4 triangles pointing toward each color's home-stretch entrance
  const ccx = 7 * cellPx, ccy = 7 * cellPx, mid = { x: ccx + cellPx / 2, y: ccy + cellPx / 2 };
  const corners = { tl: [ccx, ccy], tr: [ccx + cellPx, ccy], br: [ccx + cellPx, ccy + cellPx], bl: [ccx, ccy + cellPx] };
  function tri(colorHex, a, b) {
    ctx.fillStyle = colorHex;
    ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.lineTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.closePath(); ctx.fill();
  }
  tri('#dd3333', corners.tl, corners.bl); // left   -> red's home stretch enters from the left
  tri('#e0559b', corners.tl, corners.tr); // top    -> pink's home stretch enters from the top
  tri('#e0b400', corners.tr, corners.br); // right  -> yellow's home stretch enters from the right
  tri('#2a6fd6', corners.br, corners.bl); // bottom -> blue's home stretch enters from the bottom
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(ccx, ccy, cellPx, cellPx);
  // yard slot circles
  Object.values(YARD_SLOTS).forEach(slots => {
    slots.forEach(([r, cc]) => {
      const x = cc * cellPx + cellPx / 2, y = r * cellPx + cellPx / 2, rad = cellPx * 0.32;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
    });
  });

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

const boardFrame = new THREE.Mesh(
  new THREE.BoxGeometry(BOARD_WORLD + 0.14, 0.05, BOARD_WORLD + 0.14),
  new THREE.MeshStandardMaterial({ color: 0x3a2f1a, roughness: 0.55, metalness: 0.1 })
);
boardFrame.position.y = -0.028;
boardFrame.receiveShadow = true;
lScene.add(boardFrame);

const boardPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(BOARD_WORLD, BOARD_WORLD),
  new THREE.MeshStandardMaterial({ map: makeLudoBoardTexture(), roughness: 0.55, metalness: 0.03 })
);
boardPlane.rotation.x = -Math.PI / 2;
boardPlane.receiveShadow = true;
lScene.add(boardPlane);

// ---- pawns: one procedural cone-and-head piece per color/slot, built once and
// repositioned every render (like real pawns being picked up and moved, not
// re-created) ----
function createPawnMesh(colorHex) {
  const group = new THREE.Object3D();
  const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.2 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 0.018, 16), material);
  base.position.y = 0.009;
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.05, 16), material);
  body.position.y = 0.018 + 0.025;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), material);
  head.position.y = 0.018 + 0.05 + 0.014;
  [base, body, head].forEach(m => { m.castShadow = true; m.receiveShadow = true; group.add(m); });
  return group;
}

const highlightRingGeo = new THREE.RingGeometry(0.034, 0.046, 24);
const pawns = {}; // "color_index" -> wrapper Object3D
COLOR_ORDER.forEach(color => {
  for (let idx = 0; idx < 4; idx++) {
    const wrapper = new THREE.Object3D();
    wrapper.add(createPawnMesh(COLOR_THREE[color]));
    const ring = new THREE.Mesh(highlightRingGeo, new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.003;
    ring.visible = false;
    wrapper.add(ring);
    const [yr, yc] = YARD_SLOTS[color][idx];
    const { x, z } = cellXZ(yr, yc);
    wrapper.position.set(x, 0, z);
    wrapper.visible = false;
    wrapper.userData = { color, index: idx, ring, selectable: false, ownerName: null };
    lScene.add(wrapper);
    pawns[color + '_' + idx] = wrapper;
  }
});

// ---- lightweight tween helper (3D object properties have no CSS transitions) ----
const activeTweens = [];
function tweenObject(obj, targets, duration, delay = 0) {
  for (let i = activeTweens.length - 1; i >= 0; i--) { if (activeTweens[i].obj === obj) activeTweens.splice(i, 1); }
  const start = {};
  for (const k in targets) start[k] = getPath(obj, k);
  activeTweens.push({ obj, start, targets, t0: performance.now() + delay, duration });
}
function getPath(obj, path) { const parts = path.split('.'); let v = obj; for (const p of parts) v = v[p]; return v; }
function setPath(obj, path, val) { const parts = path.split('.'); let v = obj; for (let i = 0; i < parts.length - 1; i++) v = v[parts[i]]; v[parts[parts.length - 1]] = val; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function stepTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    if (now < tw.t0) continue;
    const p = Math.min(1, (now - tw.t0) / tw.duration);
    const e = easeOutCubic(p);
    for (const k in tw.targets) setPath(tw.obj, k, tw.start[k] + (tw.targets[k] - tw.start[k]) * e);
    if (p >= 1) activeTweens.splice(i, 1);
  }
}

const lRaycaster = new THREE.Raycaster();
const lPointerNDC = new THREE.Vector2();
function pickPawnAt(clientX, clientY) {
  const rect = ludoCanvas.getBoundingClientRect();
  lPointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  lPointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  lRaycaster.setFromCamera(lPointerNDC, lCamera);
  const targets = Object.values(pawns).filter(w => w.visible && w.userData.selectable);
  const hits = lRaycaster.intersectObjects(targets, true);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj && !obj.userData.selectable) obj = obj.parent;
  return obj;
}
ludoCanvas.addEventListener('click', (e) => {
  const wrapper = pickPawnAt(e.clientX, e.clientY);
  if (!wrapper) return;
  if (window.SFX) SFX.move();
  socket.emit('ludo_move_token', { code: room, username: user, owner: wrapper.userData.ownerName, index: wrapper.userData.index });
});
ludoCanvas.addEventListener('pointermove', (e) => {
  ludoCanvas.classList.toggle('pickable', !!pickPawnAt(e.clientX, e.clientY));
});

function update3DBoard(state, myTurn, pending) {
  Object.values(pawns).forEach(w => { w.visible = false; w.userData.selectable = false; w.userData.ring.visible = false; });
  const groups = {};
  state.players.forEach(p => {
    p.positions.forEach((d, idx) => {
      const [r, c] = cellForToken(p.color, d, idx);
      const key = r + '_' + c;
      groups[key] = groups[key] || [];
      groups[key].push({ owner: p.name, color: p.color, index: idx });
    });
  });
  Object.entries(groups).forEach(([key, list]) => {
    const [r, c] = key.split('_').map(Number);
    const { x, z } = cellXZ(r, c);
    list.forEach((tok, i) => {
      const wrapper = pawns[tok.color + '_' + tok.index];
      if (!wrapper) return;
      const offset = list.length > 1 ? (i - (list.length - 1) / 2) * 0.028 : 0;
      wrapper.visible = true;
      wrapper.userData.ownerName = tok.owner;
      const selectable = myTurn && pending.some(m => m.owner === tok.owner && m.index === tok.index);
      wrapper.userData.selectable = selectable;
      wrapper.userData.ring.visible = selectable;
      const targetX = x + offset, targetZ = z;
      if (Math.abs(wrapper.position.x - targetX) > 0.0005 || Math.abs(wrapper.position.z - targetZ) > 0.0005) {
        tweenObject(wrapper, { 'position.x': targetX, 'position.z': targetZ }, 420);
      }
    });
  });
}

function animateLudo(now) {
  requestAnimationFrame(animateLudo);
  now = now || performance.now();
  stepTweens(now);
  Object.values(pawns).forEach(w => {
    if (w.userData.selectable) {
      const pulse = 1 + Math.sin(now / 220) * 0.12;
      w.scale.setScalar(pulse);
      w.userData.ring.material.opacity = 0.55 + Math.sin(now / 220) * 0.35;
    } else if (w.scale.x !== 1) {
      w.scale.setScalar(1);
    }
  });
  lRenderer.render(lScene, lCamera);
}
resizeLudoRenderer();
requestAnimationFrame(animateLudo);
// ==================== end 3D ludo board ====================

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('ludo_create_room', {username: user, token: avatar});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('ludo_join_room', {username: user, token: avatar, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('ludo_start_game', {code: room});
});
document.getElementById('addBotBtn').addEventListener('click', () => {
  socket.emit('ludo_add_bot', {code: room});
});
document.getElementById('teamModeChk').addEventListener('change', (e) => {
  socket.emit('ludo_set_team_mode', {code: room, teamMode: e.target.checked});
});

document.getElementById('leaveLobbyBtn').addEventListener('click', leaveTable);
document.getElementById('leaveTableBtn').addEventListener('click', leaveTable);
function leaveTable() {
  socket.emit('ludo_leave_room', {code: room, username: user});
  room = ''; lastState = null;
  show('loginScreen');
}

document.getElementById('rollBtn').addEventListener('click', () => {
  if (isRolling) return;
  isRolling = true;
  if (window.SFX) SFX.diceRoll();
  document.getElementById('ludoDie').classList.add('rolling');
  document.getElementById('rollBtn').disabled = true;
  setTimeout(() => {
    socket.emit('ludo_roll_dice', {code: room, username: user});
  }, 550);
});

function setDice(el, val) {
  const rot = {1:'rotateX(0) rotateY(0)', 2:'rotateX(0) rotateY(180deg)', 3:'rotateX(0) rotateY(-90deg)', 4:'rotateX(0) rotateY(90deg)', 5:'rotateX(-90deg) rotateY(0)', 6:'rotateX(90deg) rotateY(0)'};
  el.style.transform = rot[val] || 'rotateX(0) rotateY(0)';
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code}${state.teamMode ? ' — 🤝' : ''}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('waiting_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p =>
      `<div class="player-item"><span><span class="swatch" style="background:${COLOR_HEX[p.color]}"></span>${p.token || ''} ${p.name}</span></div>`
    ).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 4) ? 'block' : 'none';
    document.getElementById('teamModeChk').checked = state.teamMode;
    document.getElementById('teamModeChk').disabled = !isOwner || state.players.length !== 4;
    return;
  }
  show('gameScreen');

  document.getElementById('playersRow').innerHTML = state.players.map(p => {
    const cls = 'player-chip' + (state.turn === p.name ? ' turn' : '');
    return `<div class="${cls}"><span class="swatch" style="background:${COLOR_HEX[p.color]}"></span>${p.name === user ? t('you_label') : p.name} (${p.finished}/4)</div>`;
  }).join('');

  const myTurn = state.turn === user && state.stage === 'playing';
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'finished' && prevStage !== 'finished') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;
  const pending = state.pendingMoves || [];

  update3DBoard(state, myTurn, pending);

  if (state.lastRoll) setDice(document.getElementById('ludoDie'), state.lastRoll);
  document.getElementById('ludoDie').classList.remove('rolling');
  isRolling = false;

  const rollBtn = document.getElementById('rollBtn');
  rollBtn.disabled = !myTurn || pending.length > 0;
  rollBtn.style.display = pending.length ? 'none' : 'inline-block';

  document.getElementById('turnIndicator').textContent = state.stage === 'finished' ? '' :
    (myTurn ? (pending.length ? t('must_choose_move') : t('turn_mine')) : (state.turn ? t('turn_other', {name: state.turn}) : ''));
  document.getElementById('actionLog').textContent = state.log || '';

  const over = state.stage === 'finished';
  document.getElementById('roundOverBar').style.display = over ? 'block' : 'none';
  if (over && state.winner) {
    document.getElementById('winnerMsg').textContent = t('win_msg', {name: state.winner});
  }
}

socket.on('ludo_state', render);
socket.on('ludo_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  isRolling = false;
  document.getElementById('ludoDie').classList.remove('rolling');
  if (d.code === 'not_enough_chips') { if (confirm(t('alert_prefix') + msg)) window.location.href = '/kasa'; return; }
  alert(t('alert_prefix') + msg);
});
</script>
