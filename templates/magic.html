  .avatar-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }

  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 40px; color: #d4af37; font-weight: bold; margin: 22px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 14px 0; max-height: 200px; overflow-y: auto; min-height: 60px; }

  .mode-card .desc { color: #b8a97a; font-size: 12px; margin-top: 4px; }
  .hub-topbar { display: flex; justify-content: center; margin-bottom: 16px; }

  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

  .duel-chip .name { color: #f5e6d3; font-weight: bold; }

  .power-btn { position: relative; background: linear-gradient(145deg,#3a2f1a,#221a0d); border: 2px solid #d4af37; border-radius: 14px; padding: 12px 18px; color: #f5e6d3; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; min-width: 84px; }

</div>

<div id="modeScreen" class="screen">

</div>

<div id="duelLobbyScreen" class="screen">

</div>

    <button class="btn grey" id="leaveLobbyBtn" data-i18n="btn_leave">🚪 Quitter</button>
    <div class="error" id="lobbyErrorMsg"></div>
  </div>
</div>

<div id="gameScreen" class="screen">

    <span id="gameInfo"></span>
    <button id="leaveGameBtn" data-i18n="btn_leave">🚪 Quitter</button>

  <div class="rack-wrap">
    <div class="bottles-3d-scene">

    </div>
  </div>
  <div class="power-bar" id="powerBar">
    <button class="power-btn" id="undoBtn">↩️ <span data-i18n="btn_undo">Annuler</span><span class="badge" id="undoBadge">3</span></button>
    <button class="power-btn" id="shuffleBtn">🔀 <span data-i18n="btn_shuffle">Mélanger</span><span class="badge" id="shuffleBadge">3</span></button>
    <button class="power-btn" id="addBottleBtn">➕ <span data-i18n="btn_add_bottle">Bouteille</span><span class="badge" id="addBadge">3</span></button>
  </div>
  <div class="error" id="gameErrorMsg"></div>
</div>

<div class="win-overlay" id="winOverlay">

    <div class="sub" id="winSub"></div>
    <button class="btn green" id="winPrimaryBtn"></button>
    <button class="btn grey" id="winSecondaryBtn"></button>
  </div>
</div>

function lng() { return getSiteLang(); }
function t(key, vars) {
  const dict = I18N[lng()] || I18N.fr;
  let s = dict[key] !== undefined ? dict[key] : (I18N.fr[key] || key);
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}
const MAGIC_LANGS = Object.keys(I18N);
buildLangSelector(document.getElementById('langSwitch'), applyStaticI18n, MAGIC_LANGS);
applyStaticI18n();

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ==================== 3D water-sort bottles (Three.js) ====================
const BOTTLE_GAP = 0.4;
const LIQUID_TOTAL_H = 0.62;
const BOTTLE_RADIUS = 0.1;
const NECK_H = 0.09, NECK_R = 0.045;
const CORK_H = 0.07;

const magicCanvas = document.getElementById('magicCanvas');
const mRenderer = new THREE.WebGLRenderer({ canvas: magicCanvas, antialias: true });
mRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
mRenderer.outputColorSpace = THREE.SRGBColorSpace;
mRenderer.toneMapping = THREE.ACESFilmicToneMapping;
mRenderer.toneMappingExposure = 1.18;
mRenderer.shadowMap.enabled = true;
mRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

const mScene = new THREE.Scene();
mScene.background = new THREE.Color(0x0c0806);

const mCamera = new THREE.PerspectiveCamera(32, 1, 0.05, 20);
mCamera.position.set(0, 0.3, 2);
mCamera.lookAt(0, 0.25, 0);

let lastRowWidth = 1, lastContentHeight = LIQUID_TOTAL_H + NECK_H + CORK_H;
function fitCameraToRow(rowWidth, contentHeight) {
  lastRowWidth = rowWidth; lastContentHeight = contentHeight;
  const halfFov = THREE.MathUtils.degToRad(mCamera.fov / 2);
  const aspect = mCamera.aspect || 1;
  const distForWidth = (rowWidth / 2 + 0.22) / (Math.tan(halfFov) * aspect);
  const distForHeight = (contentHeight / 2 + 0.14) / Math.tan(halfFov);
  const dist = Math.max(distForWidth, distForHeight, 1.0);
  mCamera.position.set(0, contentHeight * 0.42, dist);
  mCamera.lookAt(0, contentHeight * 0.3, 0);
}

function resizeMagicRenderer() {
  const rect = magicCanvas.parentElement.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  mRenderer.setSize(rect.width, rect.height, false);
  mCamera.aspect = rect.width / rect.height;
  mCamera.updateProjectionMatrix();
  fitCameraToRow(lastRowWidth, lastContentHeight);
}
new ResizeObserver(resizeMagicRenderer).observe(magicCanvas.parentElement);

// Whiter/brighter than before -- the previous amber-heavy lighting (0x9a8f80/0xfff4d6)
// tinted and muted the liquid colors instead of letting them read as bold/saturated.
mScene.add(new THREE.AmbientLight(0xb0aaa0, 0.85));
const mKey = new THREE.DirectionalLight(0xfff8ec, 2.4);
mKey.position.set(0.5, 3, 1.4);
mKey.castShadow = true;
mKey.shadow.mapSize.set(1024, 1024);
mScene.add(mKey);
const mFill = new THREE.PointLight(0xffefc8, 11, 8);
mFill.position.set(-1.2, 1.4, -0.6);
mScene.add(mFill);

const mShelf = new THREE.Mesh(
  new THREE.BoxGeometry(6, 0.05, 1),
  new THREE.MeshStandardMaterial({ color: 0x3a2f1a, roughness: 0.55, metalness: 0.1 })
);
mShelf.position.y = -0.026;
mShelf.receiveShadow = true;
mScene.add(mShelf);

function makeQuestionSprite() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.font = 'bold 46px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 32, 36);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(0.07, 0.07, 1);
  return spr;
}

let bottleGroups = [];
let curBottleCount = -1, curCapacity = -1;

function disposeBottleGroups() {
  bottleGroups.forEach(b => { mScene.remove(b.root); });
  bottleGroups = [];
}

function buildBottles3D(numBottles, cap) {
  disposeBottleGroups();
  const layerH = LIQUID_TOTAL_H / cap;
  const totalRowWidth = Math.max(0, (numBottles - 1)) * BOTTLE_GAP;
  for (let idx = 0; idx < numBottles; idx++) {
    const root = new THREE.Object3D();
    root.position.x = -totalRowWidth / 2 + idx * BOTTLE_GAP;
    mScene.add(root);

    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0, side: THREE.DoubleSide });
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(BOTTLE_RADIUS, BOTTLE_RADIUS * 0.92, LIQUID_TOTAL_H, 20, 1, true), glassMat);
    glass.position.y = LIQUID_TOTAL_H / 2;
    root.add(glass);

    const bottomCap = new THREE.Mesh(new THREE.CircleGeometry(BOTTLE_RADIUS * 0.92, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
    bottomCap.rotation.x = -Math.PI / 2;
    bottomCap.position.y = 0.002;
    root.add(bottomCap);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(NECK_R, BOTTLE_RADIUS * 0.9, NECK_H, 16), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.22, roughness: 0.08 }));
    neck.position.y = LIQUID_TOTAL_H + NECK_H / 2;
    root.add(neck);

    const cork = new THREE.Mesh(new THREE.CylinderGeometry(NECK_R * 0.95, NECK_R * 1.05, CORK_H, 16), new THREE.MeshStandardMaterial({ color: 0xc9a24a, roughness: 0.6 }));
    cork.position.y = LIQUID_TOTAL_H + NECK_H + CORK_H / 2;
    cork.visible = false;
    root.add(cork);

    const ring = new THREE.Mesh(new THREE.RingGeometry(BOTTLE_RADIUS * 1.15, BOTTLE_RADIUS * 1.5, 24), new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.004;
    ring.visible = false;
    root.add(ring);

    const layers = [];
    for (let s = 0; s < cap; s++) {
      // Physical material with clearcoat + a bit of emissive (kept in sync with the base
      // color in applyLayerValue) so the liquid reads as bold/glossy/saturated under any
      // lighting instead of a duller, purely lit-from-outside standard material.
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(BOTTLE_RADIUS * 0.88, BOTTLE_RADIUS * 0.88, layerH, 20),
        new THREE.MeshPhysicalMaterial({
          color: 0x888888, roughness: 0.12, metalness: 0, clearcoat: 0.7, clearcoatRoughness: 0.12,
          transparent: true, opacity: 0.97, emissive: 0x000000, emissiveIntensity: 0.32,
        })
      );
      mesh.position.y = s * layerH + layerH / 2;
      mesh.scale.y = 0.001;
      mesh.userData.val = undefined;
      root.add(mesh);
      const qSprite = makeQuestionSprite();
      qSprite.position.set(0, mesh.position.y, BOTTLE_RADIUS * 0.98);
      qSprite.visible = false;
      root.add(qSprite);
      mesh.userData.qSprite = qSprite;
      layers.push(mesh);
    }

    // Sized off the gap between bottles (not the visible glass) so there's no dead
    // zone between two bottles where a tap picks nothing -- on a phone, a bottle-width
    // hit target (BOTTLE_RADIUS*1.3) left most of the row untappable, especially at
    // higher levels where more bottles are packed into the same canvas width.
    const HIT_RADIUS = BOTTLE_GAP * 0.48;
    const hit = new THREE.Mesh(new THREE.CylinderGeometry(HIT_RADIUS, HIT_RADIUS, LIQUID_TOTAL_H + NECK_H + CORK_H, 12), new THREE.MeshBasicMaterial({ visible: false }));
    hit.position.y = (LIQUID_TOTAL_H + NECK_H + CORK_H) / 2;
    hit.userData.bottleIdx = idx;
    root.add(hit);

    bottleGroups.push({ root, glass, neck, cork, ring, layers, hit, idx });
  }
  curBottleCount = numBottles; curCapacity = cap;
  fitCameraToRow(totalRowWidth, LIQUID_TOTAL_H + NECK_H + CORK_H);
}

function slotValKey(c) { return c === undefined ? 'empty' : (c === null ? 'mystery' : String(c)); }

function applyLayerValue(bottleObj, s, val, animate) {
  const mesh = bottleObj.layers[s];
  const visible = val !== undefined;
  const targetScale = visible ? 1 : 0.001;
  if (val === null) {
    mesh.material.color.set(0x555560);
    mesh.material.emissive.set(0x000000);
  } else if (val !== undefined) {
    const c = MAGIC_COLORS[val % MAGIC_COLORS.length];
    mesh.material.color.set(c);
    mesh.material.emissive.set(c);
  }
  mesh.userData.qSprite.visible = val === null;
  if (animate) {
    tweenObject(mesh.scale, { y: targetScale }, 260);
  } else {
    mesh.scale.y = targetScale;
  }
  mesh.userData.val = val;
}

// ---- lightweight tween helper (3D object properties have no CSS transitions) ----
const activeTweens = [];
function tweenObject(obj, targets, duration, delay = 0) {
  for (let i = activeTweens.length - 1; i >= 0; i--) { if (activeTweens[i].obj === obj) activeTweens.splice(i, 1); }
  const start = {};
  for (const k in targets) start[k] = getPath(obj, k);
  activeTweens.push({ obj, start, targets, t0: performance.now() + delay, duration });
}
function getPath(obj, path) { const parts = path.split('.'); let v = obj; for (const p of parts) v = v[p]; return v; }
function setPath(obj, path, val) { const parts = path.split('.'); let v = obj; for (let i = 0; i < parts.length - 1; i++) v = v[parts[i]]; v[parts[parts.length - 1]] = val; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function stepTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    if (now < tw.t0) continue;
    const p = Math.min(1, (now - tw.t0) / tw.duration);
    const e = easeOutCubic(p);
    for (const k in tw.targets) setPath(tw.obj, k, tw.start[k] + (tw.targets[k] - tw.start[k]) * e);
    if (p >= 1) activeTweens.splice(i, 1);
  }
}

function tiltBottle(idx) {
  const b = bottleGroups[idx];
  if (!b) return;
  // A gentle "about to pour" tilt, matching the original 2D version's -16deg --
  // NOT a full radians value, which swings the bottle almost flat/sideways.
  tweenObject(b.root.rotation, { z: -0.28 }, 400);
  setTimeout(() => { tweenObject(b.root.rotation, { z: 0 }, 400); }, 1200);
}

const mRaycaster = new THREE.Raycaster();
const mPointerNDC = new THREE.Vector2();
function pickBottleAt(clientX, clientY) {
  const rect = magicCanvas.getBoundingClientRect();
  mPointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mPointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  mRaycaster.setFromCamera(mPointerNDC, mCamera);
  const hits = mRaycaster.intersectObjects(bottleGroups.map(b => b.hit));
  if (!hits.length) return null;
  return hits[0].object.userData.bottleIdx;
}
magicCanvas.addEventListener('click', (e) => {
  const idx = pickBottleAt(e.clientX, e.clientY);
  if (idx === null || idx === undefined) return;
  onBottleClick(idx);
});
magicCanvas.addEventListener('pointermove', (e) => {
  magicCanvas.classList.toggle('pickable', pickBottleAt(e.clientX, e.clientY) !== null);
});

function animateMagic(now) {
  requestAnimationFrame(animateMagic);
  stepTweens(now || performance.now());
  mRenderer.render(mScene, mCamera);
}
resizeMagicRenderer();
requestAnimationFrame(animateMagic);
// ==================== end 3D water-sort bottles ====================

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

function levelKey() { return 'magicLevel_' + user; }
function getSavedLevel() { return parseInt(localStorage.getItem(levelKey()) || '1', 10); }
function setSavedLevel(n) { localStorage.setItem(levelKey(), String(n)); }

function refreshHub() {
  document.getElementById('continueLevelBtn').textContent = '▶️ ' + t('level_label', {n: getSavedLevel()});
  fetch('/api/auth/profile?username=' + encodeURIComponent(user)).then(r => r.json()).then(d => {
    if (d.ok && d.profile) document.getElementById('hubChips').textContent = d.profile.chips;
  }).catch(() => {});
}

document.getElementById('continueBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) { document.getElementById('errorMsg').textContent = t('err_generic'); return; }
  show('modeScreen');
  refreshHub();
});
document.getElementById('modeBackBtn').addEventListener('click', () => show('loginScreen'));

document.getElementById('continueLevelBtn').addEventListener('click', () => {
  mode = 'solo';
  level = getSavedLevel();
  forceInstantRender = true;
  socket.emit('magic_solo_start', {username: user, level: level});
});
document.getElementById('duelCard').addEventListener('click', () => {
  mode = 'duel';
  show('duelLobbyScreen');
});

document.getElementById('createBtn').addEventListener('click', () => {
  socket.emit('magic_duel_create_room', {username: user, token: avatar});
});
document.getElementById('joinBtn').addEventListener('click', () => {
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!code) return;
  room = code;
  socket.emit('magic_duel_join_room', {username: user, token: avatar, code: code});
});
document.getElementById('startBtn').addEventListener('click', () => {
  forceInstantRender = true;
  socket.emit('magic_duel_start', {code: room});
});
document.getElementById('addBotBtn').addEventListener('click', () => {
  socket.emit('magic_duel_add_bot', {code: room});
});
document.getElementById('leaveLobbyBtn').addEventListener('click', () => {
  socket.emit('magic_duel_leave_room', {username: user, code: room});
  show('duelLobbyScreen');
});
document.getElementById('leaveGameBtn').addEventListener('click', () => {
  if (mode === 'duel') socket.emit('magic_duel_leave_room', {username: user, code: room});
  show('modeScreen');
  refreshHub();
});

let forceInstantRender = true;

function renderBottles(bottles, cap) {
  capacity = cap;
  const needsRebuild = curBottleCount !== bottles.length || curCapacity !== cap;
  if (needsRebuild) buildBottles3D(bottles.length, cap);
  const instant = forceInstantRender || needsRebuild;
  forceInstantRender = false;

  bottles.forEach((layers, idx) => {
    const b = bottleGroups[idx];
    if (!b) return;
    const isSelected = selectedIdx === idx;
    b.ring.visible = isSelected;
    tweenObject(b.root.position, { y: isSelected ? 0.055 : 0 }, 180);
    const isCapped = layers.length === cap && layers.every(c => c !== null && c === layers[0]);
    const targets = [];
    for (let s = 0; s < cap; s++) targets.push(s < layers.length ? layers[s] : undefined);

    if (instant) {
      for (let s = 0; s < cap; s++) applyLayerValue(b, s, targets[s], false);
      b.cork.visible = isCapped;
      return;
    }

    const changed = [];
    for (let s = 0; s < cap; s++) {
      if (slotValKey(b.layers[s].userData.val) !== slotValKey(targets[s])) changed.push(s);
    }
    if (changed.length === 0) {
      b.cork.visible = isCapped;
      return;
    }
    const wasFilled = b.layers.filter(m => m.userData.val !== undefined).length;
    const willBeFilled = targets.filter(t => t !== undefined).length;
    const filling = willBeFilled >= wasFilled;
    const ordered = changed.slice().sort((a, c) => filling ? a - c : c - a);
    ordered.forEach((s, i) => {
      setTimeout(() => {
        applyLayerValue(b, s, targets[s], true);
        if (i === ordered.length - 1) b.cork.visible = isCapped;
      }, i * 260);
    });
  });
}

function onBottleClick(idx) {
  const bottles = mode === 'solo' ? (lastSoloState ? lastSoloState.bottles : null) : myBottles;
  if (!bottles) return;
  if (selectedIdx === null) {
    if (bottles[idx].length === 0) return;
    selectedIdx = idx;
    renderCurrentState();
    return;
  }
  if (selectedIdx === idx) {
    selectedIdx = null;
    renderCurrentState();
    return;
  }
  const src = selectedIdx;
  const dst = idx;
  selectedIdx = null;
  if (window.SFX) SFX.move();
  tiltBottle(src);
  if (mode === 'solo') {
    socket.emit('magic_solo_pour', {src, dst});
  } else {
    socket.emit('magic_duel_pour', {code: room, username: user, src, dst});
  }
}

function renderCurrentState() {
  if (mode === 'solo' && lastSoloState) renderBottles(lastSoloState.bottles, lastSoloState.capacity);
  else if (mode === 'duel' && myBottles) renderBottles(myBottles, capacity);
}

document.getElementById('undoBtn').addEventListener('click', () => socket.emit('magic_solo_undo', {}));
document.getElementById('shuffleBtn').addEventListener('click', () => { forceInstantRender = true; socket.emit('magic_solo_shuffle', {}); });
document.getElementById('addBottleBtn').addEventListener('click', () => socket.emit('magic_solo_add_bottle', {}));

function updateSoloUI(s) {
  document.getElementById('gameInfo').textContent = user;
  document.getElementById('levelBanner').textContent = t('level_label', {n: s.level});
  document.getElementById('duelStatus').style.display = 'none';
  document.getElementById('powerBar').style.display = 'flex';
  document.getElementById('undoBadge').textContent = s.undoLeft;
  document.getElementById('shuffleBadge').textContent = s.shuffleLeft;
  document.getElementById('addBadge').textContent = s.addLeft;
  document.getElementById('undoBtn').disabled = s.undoLeft <= 0;
  document.getElementById('shuffleBtn').disabled = s.shuffleLeft <= 0;
  document.getElementById('addBottleBtn').disabled = s.addLeft <= 0;
  renderBottles(s.bottles, s.capacity);
  if (s.solved) {
    if (window.SFX) SFX.win();
    document.getElementById('winTitle').textContent = t('win_solo_title', {n: s.level});
    document.getElementById('winSub').textContent = t('win_solo_sub');
    const nextBtn = document.getElementById('winPrimaryBtn');
    nextBtn.textContent = t('btn_next_level');
    nextBtn.onclick = () => {
      level = s.level + 1;
      setSavedLevel(level);
      document.getElementById('winOverlay').classList.remove('active');
      forceInstantRender = true;
      socket.emit('magic_solo_start', {username: user, level: level});
    };
    const replayBtn = document.getElementById('winSecondaryBtn');
    replayBtn.textContent = t('btn_replay');
    replayBtn.onclick = () => {
      document.getElementById('winOverlay').classList.remove('active');
      forceInstantRender = true;
      socket.emit('magic_solo_start', {username: user, level: s.level});
    };
    document.getElementById('winOverlay').classList.add('active');
  }
}

socket.on('magic_solo_state', (s) => {
  lastSoloState = s;
  show('gameScreen');
  updateSoloUI(s);
});

socket.on('magic_duel_state', (r) => {
  lastDuelState = r;
  room = r.code;
  isOwner = r.owner === user;
  if (!r.started) {
    show('duelWaitScreen');
    document.getElementById('roomCodeDisplay').textContent = r.code;
    document.getElementById('lobbyPlayersList').innerHTML = r.players.map(p => `<div class="player-item"><span>${p.token || '🧪'} ${p.name}</span></div>`).join('');
    document.getElementById('startBtn').style.display = (isOwner && r.players.length === 2) ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && r.players.length < 2) ? 'block' : 'none';
    return;
  }
  show('gameScreen');
  document.getElementById('gameInfo').textContent = r.code;
  document.getElementById('levelBanner').textContent = '';
  document.getElementById('duelStatus').style.display = 'flex';
  document.getElementById('powerBar').style.display = 'none';
  document.getElementById('duelStatus').innerHTML = r.players.map(p => {
    const cls = p.finished ? ' finished' : '';
    const label = p.name === user ? t('you_label') : p.name;
    const info = p.finished ? t('finished_label') : t('moves_label', {n: p.moves});
    return `<div class="duel-chip${cls}"><div class="name">${p.token || '🧪'} ${label}</div><div class="info">${info}</div></div>`;
  }).join('');
  if (r.winner && !document.getElementById('winOverlay').classList.contains('active')) {
    if (window.SFX) SFX.win();
    const iWon = r.winner === user;
    document.getElementById('winTitle').textContent = t('win_duel_title', {name: r.winner === user ? t('you_label') : r.winner});
    document.getElementById('winSub').textContent = iWon ? t('win_duel_sub_win') : t('win_duel_sub_lose');
    const primaryBtn = document.getElementById('winPrimaryBtn');
    primaryBtn.textContent = t('btn_back_to_modes');
    primaryBtn.onclick = () => {
      document.getElementById('winOverlay').classList.remove('active');
      socket.emit('magic_duel_leave_room', {username: user, code: room});
      show('modeScreen');
      refreshHub();
    };
    document.getElementById('winSecondaryBtn').style.display = 'none';
    document.getElementById('winOverlay').classList.add('active');
  }
});

socket.on('magic_duel_board', (d) => {
  myBottles = d.bottles;
  capacity = d.capacity;
  renderBottles(d.bottles, d.capacity);
});

socket.on('magic_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('modeErrorMsg').textContent = msg;
  document.getElementById('lobbyErrorMsg').textContent = msg;
  document.getElementById('lobbyJoinErrorMsg').textContent = msg;
  document.getElementById('gameErrorMsg').textContent = msg;
  // A rejected pour already cleared selectedIdx client-side, but no new state comes
  // from the server on failure -- re-render so the selection ring/lift don't stay
  // stuck showing a bottle as "selected" that isn't anymore.
  renderCurrentState();
});

socket.on('connect', () => {
  const r = new URLSearchParams(window.location.search).get('room');
  if (r) room = r.toUpperCase();
});
</script>
