const LANGS = ['fr','en','es','de','it','nl','ru','ar','pt','pl','tr','ja','zh','ko'];
let lang = LANGS.includes(getSiteLang()) ? getSiteLang() : 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

// ==================== 3D okey tiles: piles + table melds (Three.js) ====================
const TILE_W = 0.09, TILE_H = 0.12, TILE_THICK = 0.016;
const TILE_COLOR_HEX = { red: '#c0272d', yellow: '#c99a10', black: '#111', blue: '#1f5fbf' };

function roundRectPath101(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

const tileTextureCache = {};
function tileTextureKey(tile) { return tile.color === 'joker' ? 'joker' : (tile.color + '_' + tile.number); }
function getTileFaceTexture(tile) {
  const key = tileTextureKey(tile);
  if (tileTextureCache[key]) return tileTextureCache[key];
  const W = 140, H = 180;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#fdf6e3'); grad.addColorStop(1, '#f0e6c8');
  ctx.fillStyle = grad; roundRectPath101(ctx, 2, 2, W - 4, H - 4, 14); ctx.fill();
  ctx.strokeStyle = '#b8a97a'; ctx.lineWidth = 2; roundRectPath101(ctx, 2, 2, W - 4, H - 4, 14); ctx.stroke();
  if (tile.color === 'joker') {
    ctx.fillStyle = '#a0860d';
    ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('OKEY', W / 2, H / 2);
  } else {
    ctx.fillStyle = TILE_COLOR_HEX[tile.color] || '#111';
    ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(tile.number), W / 2, H / 2 + 6);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tileTextureCache[key] = tex;
  return tex;
}

let tileBackTexture = null;
function getTileBackTexture() {
  if (tileBackTexture) return tileBackTexture;
  const W = 140, H = 180;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#5a1414'; roundRectPath101(ctx, 2, 2, W - 4, H - 4, 14); ctx.fill();
  ctx.save(); roundRectPath101(ctx, 2, 2, W - 4, H - 4, 14); ctx.clip();
  for (let y = -H; y < H * 2; y += 12) { ctx.strokeStyle = '#7a1c1c'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y - W); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4; roundRectPath101(ctx, 6, 6, W - 12, H - 12, 12); ctx.stroke();
  tileBackTexture = new THREE.CanvasTexture(c);
  tileBackTexture.colorSpace = THREE.SRGBColorSpace;
  return tileBackTexture;
}

function makeTextSprite(text, opts) {
  opts = opts || {};
  const W = 200, H = 48;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = opts.color || '#ffe08a';
  ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
  ctx.fillText(text, W / 2, H / 2);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set((opts.scale || 0.14) * (W / H), opts.scale || 0.14, 1);
  return spr;
}

function createTileMesh(scene) {
  const edgeMat = new THREE.MeshStandardMaterial({ color: 0xe8ddc0, roughness: 0.5 });
  const materials = [edgeMat, edgeMat, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }), new THREE.MeshStandardMaterial({ color: 0xd8cba0, roughness: 0.6 }), edgeMat, edgeMat];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(TILE_W, TILE_THICK, TILE_H), materials);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.visible = false;
  scene.add(mesh);
  return mesh;
}
function setTileFace(mesh, tile, faceDown) {
  const topMat = mesh.material[2];
  topMat.map = faceDown ? getTileBackTexture() : getTileFaceTexture(tile);
  topMat.needsUpdate = true;
}

function makeFeltMat() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 20, 128, 128, 170);
  g.addColorStop(0, '#1c7a45'); g.addColorStop(0.6, '#0f5c33'); g.addColorStop(1, '#08381f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 });
}

// ---- shared render loop / tween helper for both mini-scenes ----
const activeTweens101 = [];
function tweenObj101(obj, targets, duration, delay = 0) {
  for (let i = activeTweens101.length - 1; i >= 0; i--) { if (activeTweens101[i].obj === obj) activeTweens101.splice(i, 1); }
  const start = {};
  for (const k in targets) start[k] = obj[k];
  activeTweens101.push({ obj, start, targets, t0: performance.now() + delay, duration });
}
function easeOutCubic101(x) { return 1 - Math.pow(1 - x, 3); }
function stepTweens101(now) {
  for (let i = activeTweens101.length - 1; i >= 0; i--) {
    const tw = activeTweens101[i];
    if (now < tw.t0) continue;
    const p = Math.min(1, (now - tw.t0) / tw.duration);
    const e = easeOutCubic101(p);
    for (const k in tw.targets) tw.obj[k] = tw.start[k] + (tw.targets[k] - tw.start[k]) * e;
    if (p >= 1) activeTweens101.splice(i, 1);
  }
}

// ---- piles scene: indicator + deck stack + discard top ----
const pilesCanvas = document.getElementById('pilesCanvas');
const plRenderer = new THREE.WebGLRenderer({ canvas: pilesCanvas, antialias: true });
plRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
plRenderer.outputColorSpace = THREE.SRGBColorSpace;
plRenderer.shadowMap.enabled = true;
const plScene = new THREE.Scene();
plScene.background = new THREE.Color(0x0c0806);
const plCamera = new THREE.PerspectiveCamera(34, 1, 0.05, 20);
plCamera.position.set(0, 0.62, 0.34);
plCamera.lookAt(0, 0, 0);
function resizePilesRenderer() {
  const rect = pilesCanvas.parentElement.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  plRenderer.setSize(rect.width, rect.height, false);
  plCamera.aspect = rect.width / rect.height;
  plCamera.updateProjectionMatrix();
}
new ResizeObserver(resizePilesRenderer).observe(pilesCanvas.parentElement);
plScene.add(new THREE.AmbientLight(0x9a8f80, 0.85));
const plKey = new THREE.DirectionalLight(0xfff4d6, 2.0);
plKey.position.set(0.3, 2, 1);
plKey.castShadow = true;
plScene.add(plKey);

const PILES_DECK_STACK = 7;
const indicatorMesh = createTileMesh(plScene);
indicatorMesh.position.set(-0.62, TILE_THICK / 2, 0);
const deckStackMeshes = Array.from({ length: PILES_DECK_STACK }, (_, i) => {
  const m = createTileMesh(plScene);
  m.position.set(0, TILE_THICK / 2 + i * (TILE_THICK + 0.001), 0);
  return m;
});
const discardMesh = createTileMesh(plScene);
discardMesh.position.set(0.62, TILE_THICK / 2, 0);

const plRaycaster = new THREE.Raycaster();
const plPointerNDC = new THREE.Vector2();
function pilesPick(clientX, clientY) {
  const rect = pilesCanvas.getBoundingClientRect();
  plPointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  plPointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  plRaycaster.setFromCamera(plPointerNDC, plCamera);
  const hits = plRaycaster.intersectObjects([...deckStackMeshes, discardMesh]);
  if (!hits.length) return null;
  return hits[0].object === discardMesh ? 'discard' : 'deck';
}
pilesCanvas.addEventListener('click', (e) => {
  const which = pilesPick(e.clientX, e.clientY);
  if (which === 'deck' && !document.getElementById('deckPileBtn').disabled) document.getElementById('deckPileBtn').click();
  else if (which === 'discard' && !document.getElementById('discardPileBtn').disabled) document.getElementById('discardPileBtn').click();
});
pilesCanvas.addEventListener('pointermove', (e) => {
  pilesCanvas.classList.toggle('pickable', pilesPick(e.clientX, e.clientY) !== null);
});

function updatePiles3D(state) {
  if (state.indicator) { setTileFace(indicatorMesh, state.indicator, false); indicatorMesh.visible = true; }
  else indicatorMesh.visible = false;
  const stackShown = Math.min(PILES_DECK_STACK, Math.max(0, Math.ceil((state.deckCount || 0) / 8)));
  deckStackMeshes.forEach((m, i) => { m.visible = i < stackShown; if (m.visible) setTileFace(m, null, true); });
  if (state.discardTop) { setTileFace(discardMesh, state.discardTop, false); discardMesh.visible = true; }
  else discardMesh.visible = false;
}

// ---- table scene: melds already placed on the table, grouped in a grid ----
const tableCanvas = document.getElementById('tableCanvas');
const tbRenderer = new THREE.WebGLRenderer({ canvas: tableCanvas, antialias: true });
tbRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
tbRenderer.outputColorSpace = THREE.SRGBColorSpace;
tbRenderer.shadowMap.enabled = true;
const tbScene = new THREE.Scene();
tbScene.background = new THREE.Color(0x0c0806);
const tbCamera = new THREE.PerspectiveCamera(38, 1, 0.05, 20);
const tbFelt = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), makeFeltMat());
tbFelt.rotation.x = -Math.PI / 2;
tbFelt.receiveShadow = true;
tbScene.add(tbFelt);
tbScene.add(new THREE.AmbientLight(0x9a8f80, 0.85));
const tbKey = new THREE.DirectionalLight(0xfff4d6, 2.1);
tbKey.position.set(0.3, 2.5, 1);
tbKey.castShadow = true;
tbScene.add(tbKey);

function resizeTableRenderer() {
  const rect = tableCanvas.parentElement.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  tbRenderer.setSize(rect.width, rect.height, false);
  tbCamera.aspect = rect.width / rect.height;
  tbCamera.updateProjectionMatrix();
}
new ResizeObserver(resizeTableRenderer).observe(tableCanvas.parentElement);

const MELD_COLS = 4;
const MELD_CELL_W = TILE_W * 6, MELD_CELL_D = TILE_H * 1.9;
let meldTilePool = [], meldLabelPool = [], meldHitPool = [];
function growMeldPool(nTiles, nMelds) {
  while (meldTilePool.length < nTiles) meldTilePool.push(createTileMesh(tbScene));
  while (meldLabelPool.length < nMelds) { const s = makeTextSprite('', { scale: 0.05 }); s.visible = false; tbScene.add(s); meldLabelPool.push(s); }
  while (meldHitPool.length < nMelds) {
    const hit = new THREE.Mesh(new THREE.PlaneGeometry(MELD_CELL_W * 0.95, MELD_CELL_D * 0.95), new THREE.MeshBasicMaterial({ visible: false }));
    hit.rotation.x = -Math.PI / 2;
    hit.userData.meldIdx = -1;
    tbScene.add(hit);
    meldHitPool.push(hit);
  }
}

function updateTableMelds3D(melds, addableIdxOrNull) {
  melds = melds || [];
  const totalTiles = melds.reduce((s, m) => s + m.tiles.length, 0);
  growMeldPool(totalTiles, melds.length);
  meldTilePool.forEach(m => { m.visible = false; });
  meldLabelPool.forEach(s => { s.visible = false; });
  meldHitPool.forEach(h => { h.userData.meldIdx = -1; });

  const rows = Math.ceil(melds.length / MELD_COLS) || 1;
  let tileCursor = 0;
  melds.forEach((meld, idx) => {
    const col = idx % MELD_COLS, row = Math.floor(idx / MELD_COLS);
    const colsInRow = Math.min(MELD_COLS, melds.length - row * MELD_COLS);
    const cx = (col - (colsInRow - 1) / 2) * MELD_CELL_W;
    const cz = (row - (rows - 1) / 2) * MELD_CELL_D;
    const n = meld.tiles.length;
    const startX = cx - ((n - 1) * TILE_W * 1.08) / 2;
    meld.tiles.forEach((tile, ti) => {
      const m = meldTilePool[tileCursor++];
      setTileFace(m, tile, false);
      m.position.set(startX + ti * TILE_W * 1.08, TILE_THICK / 2, cz + TILE_H * 0.32);
      m.visible = true;
    });
    const label = meldLabelPool[idx];
    label.position.set(cx, 0.09, cz - TILE_H * 0.55);
    label.visible = true;
    const c = label.material.map.image.getContext('2d');
    c.clearRect(0, 0, 200, 48);
    c.fillStyle = addableIdxOrNull !== null ? '#3a9d6d' : '#ffe08a';
    c.font = 'bold 30px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.shadowColor = 'rgba(0,0,0,.9)'; c.shadowBlur = 6;
    c.fillText(meld.owner, 100, 24);
    label.material.map.needsUpdate = true;

    const hit = meldHitPool[idx];
    hit.position.set(cx, TILE_THICK / 2, cz + TILE_H * 0.32);
    hit.userData.meldIdx = idx;
  });

  fitTableCamera(Math.min(MELD_COLS, melds.length || 1), rows);
}

function fitTableCamera(cols, rows) {
  const contentW = Math.max(cols, 1) * MELD_CELL_W;
  const contentD = Math.max(rows, 1) * MELD_CELL_D;
  const halfFov = THREE.MathUtils.degToRad(tbCamera.fov / 2);
  const aspect = tbCamera.aspect || 1;
  const distForWidth = (contentW / 2 + 0.15) / (Math.tan(halfFov) * aspect);
  const distForDepth = (contentD / 2 + 0.15) / Math.tan(halfFov);
  const dist = Math.max(distForWidth, distForDepth, 0.5);
  tbCamera.position.set(0, dist * 0.95, dist * 0.35);
  tbCamera.lookAt(0, 0, 0);
}

const tbRaycaster = new THREE.Raycaster();
const tbPointerNDC = new THREE.Vector2();
function tablePickMeldIdx(clientX, clientY) {
  const rect = tableCanvas.getBoundingClientRect();
  tbPointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  tbPointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  tbRaycaster.setFromCamera(tbPointerNDC, tbCamera);
  const targets = meldHitPool.filter(h => h.userData.meldIdx >= 0);
  const hits = tbRaycaster.intersectObjects(targets);
  return hits.length ? hits[0].object.userData.meldIdx : null;
}
tableCanvas.addEventListener('click', (e) => {
  const idx = tablePickMeldIdx(e.clientX, e.clientY);
  if (idx !== null) meldClickHandler(idx);
});
tableCanvas.addEventListener('pointermove', (e) => {
  tableCanvas.classList.toggle('pickable', tablePickMeldIdx(e.clientX, e.clientY) !== null);
});

function animate101(now) {
  requestAnimationFrame(animate101);
  now = now || performance.now();
  stepTweens101(now);
  plRenderer.render(plScene, plCamera);
  tbRenderer.render(tbScene, tbCamera);
}
resizePilesRenderer();
resizeTableRenderer();
fitTableCamera(1, 1);
requestAnimationFrame(animate101);

const COLOR_MAP = {red:'#c0272d', yellow:'#c99a10', black:'#111', blue:'#1f5fbf'};
const COLOR_ORDER = {black:0, blue:1, red:2, yellow:3, joker:4};

function sortHand(tiles) {
  return [...tiles].sort((a, b) => {
    const ca = COLOR_ORDER[a.color], cb = COLOR_ORDER[b.color];
    if (ca !== cb) return ca - cb;
    return a.number - b.number;
  });
}

function tileHtml(tile, opts) {
  opts = opts || {};
  const cls = ['okey-tile'];
  if (opts.small) cls.push('small');
  if (opts.clickable) cls.push('hand-tile');
  if (opts.selected) cls.push('tile-selected');
  const isWild = lastState && tile.color !== 'joker' && tile.color === lastState.okeyColor && tile.number === lastState.okeyNumber;
  if (isWild || tile.color === 'joker') cls.push('wild');
  if (tile.color === 'joker') {
    cls.push('joker');
    return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}">OKEY</div>`;
  }
  return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}" style="color:${COLOR_MAP[tile.color]}">${tile.number}</div>`;
}

function attachTileDrag(el, tileId) {
  let startX = 0, startY = 0, moved = false, active = false, hoverTile = null, hoverBefore = true;
  el.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; moved = false; active = true; hoverTile = null;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!active) return;
    if (!moved && (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6)) moved = true;
    if (!moved) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetTile = target && target.closest('.rack .okey-tile[data-tile-id]');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (targetTile && targetTile !== el) {
      hoverTile = targetTile;
      const rect = targetTile.getBoundingClientRect();
      hoverBefore = e.clientX < rect.left + rect.width / 2;
      targetTile.classList.add('drop-target');
    } else { hoverTile = null; }
  });
  el.addEventListener('pointerup', () => {
    if (!active) return;
    active = false;
    el.classList.remove('dragging');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (moved && hoverTile) {
      const targetId = parseInt(hoverTile.dataset.tileId, 10);
      const fromIdx = myOrder.indexOf(tileId);
      if (fromIdx !== -1) {
        myOrder.splice(fromIdx, 1);
        let toIdx = myOrder.indexOf(targetId);
        if (toIdx !== -1) {
          myOrder.splice(hoverBefore ? toIdx : toIdx + 1, 0, tileId);
          if (lastState) render(lastState);
        } else { myOrder.splice(fromIdx, 0, tileId); }
      }
    } else if (!moved) {
      if (selectedTileIds.has(tileId)) selectedTileIds.delete(tileId); else selectedTileIds.add(tileId);
      if (lastState) render(lastState);
    }
  });
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — El #${state.handNo}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('waiting_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p => `<div class="player-item"><span>${p.token || '💯'} ${p.name}</span><span>🏆 ${p.roundsWon}</span></div>`).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 4) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  const me = state.players.find(p => p.name === user);
  const myTurn = state.turn === user && state.stage === 'playing';
  const opened = !!(me && me.opened);
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'round_over' && prevStage !== 'round_over') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;

  document.getElementById('playersRow').innerHTML = state.players.map(p => {
    const cls = ['player-chip'];
    if (state.turn === p.name) cls.push('turn');
    if (p.opened) cls.push('opened');
    return `<div class="${cls.join(' ')}">${p.token || '💯'} ${p.name === user ? t('you_label') : p.name} — ${p.handCount}${p.opened ? ' ✅' : ''}</div>`;
  }).join('');

  updatePiles3D(state);
  document.getElementById('deckCount').textContent = state.deckCount;

  const canAddToMeld = myTurn && state.mustDiscard && opened && selectedTileIds.size === 1;
  updateTableMelds3D(state.table, canAddToMeld ? true : null);

  document.getElementById('turnIndicator').textContent = myTurn
    ? (state.mustDiscard ? t('must_discard_hint') : t('must_draw_hint'))
    : (state.turn ? t('turn_other', {name: state.turn}) : '');
  document.getElementById('actionLog').textContent = state.log || '';

  const byId = Object.fromEntries(myHand.map(t => [t.id, t]));
  const orderedHand = myOrder.map(id => byId[id]).filter(Boolean);
  const mid = Math.ceil(orderedHand.length / 2);
  document.getElementById('handRowTop').innerHTML = orderedHand.slice(0, mid).map(tile => tileHtml(tile, {clickable: true, selected: selectedTileIds.has(tile.id)})).join('');
  document.getElementById('handRowBottom').innerHTML = orderedHand.slice(mid).map(tile => tileHtml(tile, {clickable: true, selected: selectedTileIds.has(tile.id)})).join('');
  document.querySelectorAll('.rack .okey-tile[data-tile-id]').forEach(el => {
    attachTileDrag(el, parseInt(el.dataset.tileId, 10));
  });

  document.getElementById('stagedGroups').innerHTML = stagedGroups.map((ids, gi) => {
    const tilesHtml = ids.map(id => tileHtml(byId[id] || {id, color:'joker', number:0}, {small: true})).join('');
    return `<div class="staged-group" data-group-idx="${gi}">${tilesHtml}<button data-remove="${gi}">✕</button></div>`;
  }).join('');
  document.querySelectorAll('#stagedGroups button[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      stagedGroups.splice(parseInt(btn.dataset.remove, 10), 1);
      render(lastState);
    });
  });

  document.getElementById('deckPileBtn').disabled = !(myTurn && !state.mustDiscard);
  document.getElementById('discardPileBtn').disabled = !(myTurn && !state.mustDiscard) || !state.discardTop;
  document.getElementById('stageGroupBtn').disabled = !(myTurn && state.mustDiscard) || opened || selectedTileIds.size < 3;
  document.getElementById('openBtn').disabled = !(myTurn && state.mustDiscard) || opened || stagedGroups.length === 0;
  document.getElementById('discardBtn').disabled = !(myTurn && state.mustDiscard) || selectedTileIds.size !== 1;

  const over = state.stage === 'round_over';
  document.getElementById('roundOverBar').style.display = over ? 'flex' : 'none';
  if (over) {
    document.getElementById('winnerMsg').textContent = state.winner ? t('win_msg', {name: state.winner}) : '';
  }
}

socket.on('r101_state', render);
socket.on('r101_your_hand', (d) => {
  myHand = d.hand || [];
  const newIds = new Set(myHand.map(t => t.id));
  myOrder = myOrder.filter(id => newIds.has(id));
  selectedTileIds = new Set([...selectedTileIds].filter(id => newIds.has(id)));
  const known = new Set(myOrder);
  sortHand(myHand).forEach(t => { if (!known.has(t.id)) myOrder.push(t.id); });
  if (lastState) render(lastState);
});
socket.on('r101_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  if (d.code === 'not_enough_chips') { if (confirm(t('alert_prefix') + msg)) window.location.href = '/kasa'; return; }
  alert(t('alert_prefix') + msg);
});
</script>

</body>
</html>
