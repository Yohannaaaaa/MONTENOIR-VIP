<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #1a1512 0%, #050505 60%, #000 100%); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .screen.active { display: flex; }
  h1 { font-size: 50px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 26px; letter-spacing: 6px; text-align: center; }
  .card-box { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 18px; margin-bottom: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 14px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 15px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .avatar-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin: 14px 0; }
  .avatar-btn { aspect-ratio: 1; font-size: 22px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all .25s; }
  .avatar-btn:hover { background: rgba(60,60,60,0.9); transform: scale(1.05); }
  .avatar-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #2d7a56, #1f5a42); color: #fff; }
  .btn.grey { background: #444; color: #f5e6d3; }
  .error { color: #ff6b6b; text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 44px; color: #d4af37; font-weight: bold; margin: 26px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 18px 0; max-height: 220px; overflow-y: auto; min-height: 60px; }
  .player-item { padding: 9px 4px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; display: flex; justify-content: space-between; }
  .player-item:last-child { border-bottom: none; }

  #gameScreen { padding: 14px; max-width: 980px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: #d4af37; }
  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .players-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .player-chip { display: flex; align-items: center; gap: 6px; background: rgba(10,10,10,.8); border: 2px solid #444; border-radius: 20px; padding: 6px 12px; font-size: 12px; }
  .player-chip.turn { border-color: #d4af37; box-shadow: 0 0 12px rgba(212,175,55,.7); }
  .player-chip.opened { border-color: #3a9d6d; }
  .piles-row { display: flex; gap: 26px; align-items: center; justify-content: center; margin-bottom: 10px; }
  .center-pile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pile-label { font-size: 11px; color: #ffe08a; letter-spacing: 1px; text-transform: uppercase; }
  .pile-count { font-size: 12px; color: #d4af37; }
  .stack-btn { border: none; background: none; cursor: pointer; padding: 0; }
  .stack-btn:disabled { cursor: not-allowed; opacity: .5; }
  .indicator-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .okey-tile { width: 40px; height: 56px; border-radius: 6px; background: linear-gradient(160deg,#fdf6e3,#f0e6c8); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); border: 1px solid #b8a97a; }
  .okey-tile.back { background: repeating-linear-gradient(45deg,#7a1c1c,#7a1c1c 6px,#5a1414 6px,#5a1414 12px); border: 2px solid #d4af37; }
  .okey-tile.small { width: 27px; height: 38px; font-size: 12px; border-radius: 4px; }
  .okey-tile.joker { font-size: 10px; color: #a0860d; letter-spacing: -0.5px; }
  .okey-tile.wild { box-shadow: 0 0 10px 2px rgba(212,175,55,0.9), 0 4px 10px rgba(0,0,0,0.6); }
  .okey-tile.hand-tile { cursor: pointer; transition: transform .15s; touch-action: none; user-select: none; }
  .okey-tile.hand-tile:hover { transform: translateY(-6px); }
  .okey-tile.tile-selected { box-shadow: 0 0 0 3px #3a9d6d, 0 4px 10px rgba(0,0,0,.6); transform: translateY(-6px); }
  .okey-tile.dragging { opacity: .65; transform: scale(1.1); z-index: 50; }
  .okey-tile.drop-target { box-shadow: 0 0 0 3px #3a9d6d; }

  .table-area { background: rgba(10,10,10,.75); border: 2px solid #3d2612; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; min-height: 70px; max-height: 220px; overflow-y: auto; }
  .table-meld { display: inline-flex; gap: 4px; align-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(212,175,55,.3); border-radius: 8px; padding: 5px 6px; margin: 4px 6px 4px 0; }
  .table-meld.addable { cursor: pointer; border-color: #3a9d6d; box-shadow: 0 0 10px rgba(58,157,109,.7); }
  .meld-owner { font-size: 9px; color: #8a7550; margin-right: 4px; }

  .rack { background: linear-gradient(180deg,#9a6a35,#6b4322 60%,#4a2d16); border: 3px solid #3d2612; border-radius: 12px; padding: 12px 16px 8px; margin-bottom: 10px; box-shadow: 0 10px 25px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.2), inset 0 -6px 10px rgba(0,0,0,.4); }
  .rack-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; min-height: 60px; padding: 4px 0; }
  .rack-row:first-child { border-bottom: 2px solid rgba(0,0,0,.35); padding-bottom: 8px; }

  .staged-groups { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; min-height: 10px; }
  .staged-group { display: flex; align-items: center; gap: 4px; background: rgba(58,157,109,.15); border: 1px solid #3a9d6d; border-radius: 8px; padding: 4px 6px; }
  .staged-group button { background: #a83232; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; line-height: 1; }

  .side-panel { background: rgba(26,26,26,0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 14px 18px; }
  .turn-indicator { text-align: center; color: #d4af37; font-weight: bold; margin-bottom: 8px; min-height: 20px; }
  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .action-bar .btn { width: auto; padding: 10px 18px; margin-top: 0; font-size: 13px; }
  .action-log { color: #d4af37; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; opacity: .9; }
  .winner-box { text-align: center; }

  @media (max-width: 600px) {
    html, body { overflow-x: hidden; }
    h1 { font-size: 30px; letter-spacing: 3px; margin-bottom: 16px; }
    .card-box { padding: 20px 16px; }
    .room-code { font-size: 30px; }
    .okey-tile { width: 30px; height: 42px; font-size: 14px; }
    .okey-tile.small { width: 21px; height: 30px; font-size: 9px; }
    .piles-row { gap: 14px; }
    .player-chip { font-size: 11px; padding: 5px 10px; }
    .rack { padding: 8px 8px 6px; }
    .rack-row { min-height: 46px; gap: 3px; }
    .action-bar .btn { padding: 8px 12px; font-size: 12px; }
    .side-panel { padding: 10px 12px; }
  }
</style>

  <h1>💯 101 💯</h1>

    <button class="btn" id="createBtn" data-i18n="btn_create">➕ Créer une table</button>
    <label class="label" data-i18n="label_or_join">OU REJOIGNEZ</label>
    <input type="text" id="roomCode" class="input" data-i18n-placeholder="placeholder_room_code" placeholder="Code de la table">
    <button class="btn" id="joinBtn" data-i18n="btn_join">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1 data-i18n="title_lobby">101</h1>
  <div class="card-box">
    <div style="text-align:center;color:#d4af37;margin-bottom:8px;font-weight:bold;" data-i18n="label_room_code">CODE DE LA TABLE</div>
    <div class="room-code" id="roomCodeDisplay">101-XXXX</div>
    <div style="text-align:center;font-size:13px;color:#f5e6d3;" id="lobbyInfo"></div>
    <label class="label" data-i18n="label_players">👥 Joueurs</label>
    <div class="players-list" id="lobbyPlayersList"></div>
    <button class="btn green" id="startBtn" data-i18n="btn_start">🚀 Démarrer la partie</button>
    <button class="btn grey" id="addBotBtn" data-i18n="btn_add_bot">🤖 Ajouter un bot IA</button>
    <button class="btn grey" id="leaveLobbyBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="top-bar">
    <span id="tableInfo"></span>
    <button id="leaveTableBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
  <div class="players-row" id="playersRow"></div>
  <div class="piles-row">
    <div class="indicator-box">
      <div class="pile-label" data-i18n="indicator_label">GÖSTERGE</div>
      <div id="indicatorTile"></div>
    </div>
    <div class="center-pile">
      <div class="pile-label" data-i18n="deck_label">PIOCHE</div>
      <button class="stack-btn" id="deckPileBtn"><div class="okey-tile back"></div></button>
      <div class="pile-count" id="deckCount"></div>
    </div>
    <div class="center-pile">
      <div class="pile-label" data-i18n="discard_label">DÉFAUSSE</div>
      <button class="stack-btn" id="discardPileBtn"><div id="discardTileWrap"><div class="okey-tile back"></div></div></button>
    </div>
  </div>
  <div class="table-area" id="tableArea"></div>
  <div class="side-panel">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="rack">
      <div class="rack-row" id="handRowTop"></div>
      <div class="rack-row" id="handRowBottom"></div>
    </div>
    <div class="staged-groups" id="stagedGroups"></div>
    <div class="action-bar" id="actionBar" style="margin-bottom:8px;">
      <button class="btn grey" id="sortHandBtn" data-i18n="btn_sort_hand" style="width:auto;">🔀 Trier</button>
      <button class="btn" id="stageGroupBtn" data-i18n="btn_make_group" style="width:auto;">📦 Grup Yap</button>
      <button class="btn green" id="openBtn" data-i18n="btn_open" style="width:auto;">🚀 AÇIL (101+)</button>
      <button class="btn" id="discardBtn" data-i18n="btn_discard_selected" style="width:auto;background:linear-gradient(135deg,#a83232,#6e1f1f);color:#fff;">🗑️ Taş At</button>
    </div>
    <div class="action-bar" id="roundOverBar" style="display:none;">
      <div class="winner-box">
        <div id="winnerMsg" style="color:#d4af37;font-weight:bold;margin-bottom:8px;"></div>
        <button class="btn green" id="nextHandBtn" data-i18n="btn_next_hand">▶️ Main suivante</button>
      </div>
    </div>
    <div class="action-log" id="actionLog"></div>
  </div>
</div>

const LANGS = ['fr','en','es','de','it','nl','ru','ar','pt','pl','tr','ja','zh','ko'];
let lang = LANGS.includes(getSiteLang()) ? getSiteLang() : 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}

buildLangSelector(document.getElementById('langSwitch'), (code) => { lang = code; applyStaticI18n(); if (lastState) render(lastState); }, LANGS);
applyStaticI18n();

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('r101_create_room', {username: user, token: avatar});
});
document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('r101_join_room', {username: user, token: avatar, code: room});
});
document.getElementById('startBtn').addEventListener('click', () => socket.emit('r101_start_game', {code: room}));
document.getElementById('addBotBtn').addEventListener('click', () => socket.emit('r101_add_bot', {code: room}));
document.getElementById('leaveLobbyBtn').addEventListener('click', leaveTable);
document.getElementById('leaveTableBtn').addEventListener('click', leaveTable);
function leaveTable() {
  socket.emit('r101_leave_room', {code: room, username: user});
  room = ''; lastState = null; myHand = []; myOrder = []; selectedTileIds = new Set(); stagedGroups = [];
  show('loginScreen');
}
document.getElementById('nextHandBtn').addEventListener('click', () => socket.emit('r101_next_hand', {code: room}));
document.getElementById('deckPileBtn').addEventListener('click', () => { if (window.SFX) SFX.cardFlip(); socket.emit('r101_draw', {code: room, username: user, source: 'deck'}); });
document.getElementById('discardPileBtn').addEventListener('click', () => { if (window.SFX) SFX.cardFlip(); socket.emit('r101_draw', {code: room, username: user, source: 'discard'}); });

const COLOR_MAP = {red:'#c0272d', yellow:'#c99a10', black:'#111', blue:'#1f5fbf'};
const COLOR_ORDER = {black:0, blue:1, red:2, yellow:3, joker:4};

function sortHand(tiles) {
  return [...tiles].sort((a, b) => {
    const ca = COLOR_ORDER[a.color], cb = COLOR_ORDER[b.color];
    if (ca !== cb) return ca - cb;
    return a.number - b.number;
  });
}

function tileHtml(tile, opts) {
  opts = opts || {};
  const cls = ['okey-tile'];
  if (opts.small) cls.push('small');
  if (opts.clickable) cls.push('hand-tile');
  if (opts.selected) cls.push('tile-selected');
  const isWild = lastState && tile.color !== 'joker' && tile.color === lastState.okeyColor && tile.number === lastState.okeyNumber;
  if (isWild || tile.color === 'joker') cls.push('wild');
  if (tile.color === 'joker') {
    cls.push('joker');
    return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}">OKEY</div>`;
  }
  return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}" style="color:${COLOR_MAP[tile.color]}">${tile.number}</div>`;
}

function attachTileDrag(el, tileId) {
  let startX = 0, startY = 0, moved = false, active = false, hoverTile = null, hoverBefore = true;
  el.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; moved = false; active = true; hoverTile = null;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!active) return;
    if (!moved && (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6)) moved = true;
    if (!moved) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetTile = target && target.closest('.rack .okey-tile[data-tile-id]');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (targetTile && targetTile !== el) {
      hoverTile = targetTile;
      const rect = targetTile.getBoundingClientRect();
      hoverBefore = e.clientX < rect.left + rect.width / 2;
      targetTile.classList.add('drop-target');
    } else { hoverTile = null; }
  });
  el.addEventListener('pointerup', () => {
    if (!active) return;
    active = false;
    el.classList.remove('dragging');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (moved && hoverTile) {
      const targetId = parseInt(hoverTile.dataset.tileId, 10);
      const fromIdx = myOrder.indexOf(tileId);
      if (fromIdx !== -1) {
        myOrder.splice(fromIdx, 1);
        let toIdx = myOrder.indexOf(targetId);
        if (toIdx !== -1) {
          myOrder.splice(hoverBefore ? toIdx : toIdx + 1, 0, tileId);
          if (lastState) render(lastState);
        } else { myOrder.splice(fromIdx, 0, tileId); }
      }
    } else if (!moved) {
      if (selectedTileIds.has(tileId)) selectedTileIds.delete(tileId); else selectedTileIds.add(tileId);
      if (lastState) render(lastState);
    }
  });
}

document.getElementById('sortHandBtn').addEventListener('click', () => {
  myOrder = sortHand(myHand).map(t => t.id);
  if (lastState) render(lastState);
});

document.getElementById('stageGroupBtn').addEventListener('click', () => {
  if (selectedTileIds.size < 3) return;
  stagedGroups.push([...selectedTileIds]);
  selectedTileIds = new Set();
  if (lastState) render(lastState);
});

document.getElementById('openBtn').addEventListener('click', () => {
  if (!stagedGroups.length) return;
  if (window.SFX) SFX.move();
  socket.emit('r101_open', {code: room, username: user, groups: stagedGroups});
});

document.getElementById('discardBtn').addEventListener('click', () => {
  if (selectedTileIds.size !== 1) return;
  if (window.SFX) SFX.move();
  const tileId = [...selectedTileIds][0];
  socket.emit('r101_discard', {code: room, username: user, tileId});
  selectedTileIds = new Set();
});

function meldClickHandler(meldIdx) {
  if (selectedTileIds.size !== 1) return;
  if (window.SFX) SFX.move();
  const tileId = [...selectedTileIds][0];
  socket.emit('r101_add_to_meld', {code: room, username: user, tileId, meldIndex: meldIdx});
  selectedTileIds = new Set();
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — El #${state.handNo}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('waiting_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p => `<div class="player-item"><span>${p.token || '💯'} ${p.name}</span><span>🏆 ${p.roundsWon}</span></div>`).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 4) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  const me = state.players.find(p => p.name === user);
  const myTurn = state.turn === user && state.stage === 'playing';
  const opened = !!(me && me.opened);
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'round_over' && prevStage !== 'round_over') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;

  document.getElementById('playersRow').innerHTML = state.players.map(p => {
    const cls = ['player-chip'];
    if (state.turn === p.name) cls.push('turn');
    if (p.opened) cls.push('opened');
    return `<div class="${cls.join(' ')}">${p.token || '💯'} ${p.name === user ? t('you_label') : p.name} — ${p.handCount}${p.opened ? ' ✅' : ''}</div>`;
  }).join('');

  document.getElementById('indicatorTile').innerHTML = state.indicator ? tileHtml(state.indicator, {small: true}) : '';
  document.getElementById('deckCount').textContent = state.deckCount;
  document.getElementById('discardTileWrap').innerHTML = state.discardTop ? tileHtml(state.discardTop, {small: false}) : '<div class="okey-tile back"></div>';

  const canAddToMeld = myTurn && state.mustDiscard && opened && selectedTileIds.size === 1;
  document.getElementById('tableArea').innerHTML = (state.table || []).map((meld, idx) => {
    const cls = 'table-meld' + (canAddToMeld ? ' addable' : '');
    const tilesHtml = meld.tiles.map(tile => tileHtml(tile, {small: true})).join('');
    return `<div class="${cls}" data-meld-idx="${idx}"><span class="meld-owner">${meld.owner}</span>${tilesHtml}</div>`;
  }).join('');
  if (canAddToMeld) {
    document.querySelectorAll('.table-meld.addable').forEach(el => {
      el.addEventListener('click', () => meldClickHandler(parseInt(el.dataset.meldIdx, 10)));
    });
  }

  document.getElementById('turnIndicator').textContent = myTurn
    ? (state.mustDiscard ? t('must_discard_hint') : t('must_draw_hint'))
    : (state.turn ? t('turn_other', {name: state.turn}) : '');
  document.getElementById('actionLog').textContent = state.log || '';

  const byId = Object.fromEntries(myHand.map(t => [t.id, t]));
  const orderedHand = myOrder.map(id => byId[id]).filter(Boolean);
  const mid = Math.ceil(orderedHand.length / 2);
  document.getElementById('handRowTop').innerHTML = orderedHand.slice(0, mid).map(tile => tileHtml(tile, {clickable: true, selected: selectedTileIds.has(tile.id)})).join('');
  document.getElementById('handRowBottom').innerHTML = orderedHand.slice(mid).map(tile => tileHtml(tile, {clickable: true, selected: selectedTileIds.has(tile.id)})).join('');
  document.querySelectorAll('.rack .okey-tile[data-tile-id]').forEach(el => {
    attachTileDrag(el, parseInt(el.dataset.tileId, 10));
  });

  document.getElementById('stagedGroups').innerHTML = stagedGroups.map((ids, gi) => {
    const tilesHtml = ids.map(id => tileHtml(byId[id] || {id, color:'joker', number:0}, {small: true})).join('');
    return `<div class="staged-group" data-group-idx="${gi}">${tilesHtml}<button data-remove="${gi}">✕</button></div>`;
  }).join('');
  document.querySelectorAll('#stagedGroups button[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      stagedGroups.splice(parseInt(btn.dataset.remove, 10), 1);
      render(lastState);
    });
  });

  document.getElementById('deckPileBtn').disabled = !(myTurn && !state.mustDiscard);
  document.getElementById('discardPileBtn').disabled = !(myTurn && !state.mustDiscard) || !state.discardTop;
  document.getElementById('stageGroupBtn').disabled = !(myTurn && state.mustDiscard) || opened || selectedTileIds.size < 3;
  document.getElementById('openBtn').disabled = !(myTurn && state.mustDiscard) || opened || stagedGroups.length === 0;
  document.getElementById('discardBtn').disabled = !(myTurn && state.mustDiscard) || selectedTileIds.size !== 1;

  const over = state.stage === 'round_over';
  document.getElementById('roundOverBar').style.display = over ? 'flex' : 'none';
  if (over) {
    document.getElementById('winnerMsg').textContent = state.winner ? t('win_msg', {name: state.winner}) : '';
  }
}

socket.on('r101_state', render);
socket.on('r101_your_hand', (d) => {
  myHand = d.hand || [];
  const newIds = new Set(myHand.map(t => t.id));
  myOrder = myOrder.filter(id => newIds.has(id));
  selectedTileIds = new Set([...selectedTileIds].filter(id => newIds.has(id)));
  const known = new Set(myOrder);
  sortHand(myHand).forEach(t => { if (!known.has(t.id)) myOrder.push(t.id); });
  if (lastState) render(lastState);
});
socket.on('r101_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  if (d.code === 'not_enough_chips') { if (confirm(t('alert_prefix') + msg)) window.location.href = '/kasa'; return; }
  alert(t('alert_prefix') + msg);
});
</script>

</body>
</html>
