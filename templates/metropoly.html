<div id="loginScreen" class="screen active">
  <div class="lang-switch" id="langSwitch"></div>
  <h1>♠️ METROPOLY ♦️</h1>
  <div class="card">
    <label class="label" data-i18n="label_username">🎮 Ton Pseudo</label>

    <label class="label" data-i18n="label_token">🎯 Choisissez votre jeton</label>
    <div class="token-grid">
      <button class="token-btn" data-token="car"><img src="/static/pawn_car.png" alt="Voiture"></button>
      <button class="token-btn" data-token="jackpot"><img src="/static/pawn_jackpot.png" alt="Machine à sous"></button>
      <button class="token-btn" data-token="boat"><img src="/static/pawn_boat.png" alt="Bateau"></button>
      <button class="token-btn" data-token="horse"><img src="/static/pawn_horse.png" alt="Cheval"></button>
      <button class="token-btn selected" data-token="hat"><img src="/static/pawn_hat.png" alt="Chapeau"></button>
      <button class="token-btn" data-token="cat"><img src="/static/pawn_cat.png" alt="Chat noir"></button>
    </div>
    <button class="btn" id="createBtn" data-i18n="btn_create">➕ Créer une salle</button>
    <label class="label" data-i18n="label_or_join">OU REJOIGNEZ</label>
    <input type="text" id="roomCode" class="input" data-i18n-placeholder="placeholder_room_code" placeholder="Code de la salle">
    <button class="btn" id="joinBtn" data-i18n="btn_join">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1>METROPOLY</h1>
  <div class="card">
    <div style="text-align: center; color: #d4af37; margin-bottom: 10px; font-weight: bold;" data-i18n="label_room_code">CODE DE LA SALLE</div>
    <div class="room-code" id="roomCodeDisplay">MET-XXXX</div>
    <label class="label" data-i18n="label_players">👥 Joueurs</label>
    <div class="players-list" id="lobbyPlayersList"></div>
    <button class="btn" id="startBtn" data-i18n="btn_start">🚀 Démarrer le jeu</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-container">
    <div class="board-column">
      <div class="board">
        <canvas id="metropolyCanvas"></canvas>
        <div class="dice-total-badge" id="diceTotalBadge" style="display:none;"></div>
      </div>

      <div class="panel-box buy-box-under-board" id="buyBox" style="display:none;">
        <div class="panel-title" data-i18n="title_free_property">🏠 Propriété Libre</div>
        <div class="buy-info" id="buyInfo"></div>
        <div class="buy-actions">
          <button class="roll-btn" id="buyBtn" style="background:linear-gradient(135deg,#d4af37,#a0860d) !important; color:#1a1a1a !important;" data-i18n="btn_buy">ACHETER</button>
          <button class="roll-btn skip-btn" id="skipBuyBtn" data-i18n="btn_skip">PASSER</button>
        </div>
      </div>

      <div class="build-toolbar" id="buildToolbar" style="display:none;">
        <div class="build-toolbar-title" id="buildToolbarTitle"></div>
        <div class="build-levels" id="buildLevels"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-box">
        <div class="panel-title" data-i18n="title_roll">🎲 Lancer Les Dés</div>
        <div class="action-log" id="turnIndicator" style="margin-bottom:10px;"></div>
        <button class="roll-btn" id="rollBtn" data-i18n="btn_roll">LANCER</button>
      </div>
      <div class="panel-box">
        <div class="panel-title" data-i18n="title_players">👥 Joueurs</div>
        <div class="players-info" id="gamePlayersList"></div>
      </div>
      <div class="panel-box">
        <div class="panel-title" data-i18n="title_last_move">📊 Dernier Coup</div>
        <div class="action-log" id="lastAction" data-i18n="waiting">⏳ En attente...</div>
      </div>
    </div>
  </div>
</div>

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });

const HOUSE_ICONS = { green:'/static/house_green.png', brown:'/static/house_brown.png', orange:'/static/house_orange.png', purple:'/static/house_purple.png', yellow:'/static/house_yellow.png', red:'/static/house_red.png' };
function houseIcon(grp) { return HOUSE_ICONS[grp] || HOUSE_ICONS.green; }
function houseFilterStyle(grp) { return grp === 'blue' ? 'filter:hue-rotate(150deg) saturate(1.4) drop-shadow(0 2px 3px rgba(0,0,0,0.6));' : ''; }
const TOKEN_ICONS = {
  car: '/static/pawn_car.png',

function tokenIcon(id) { return TOKEN_ICONS[id] || TOKEN_ICONS.hat; }
const N_CELLS = 28; // doit correspondre à len(METROPOLY_CELLS) côté serveur
function buildPerimeter(n, w, h, marginX, marginY) {
  const per = n / 4;
  const loX = marginX, hiX = w - marginX, loY = marginY, hiY = h - marginY, pts = [];
  for (let i = 0; i < per; i++) pts.push({x: hiX - (hiX - loX) * i / per, y: hiY});
  for (let i = 0; i < per; i++) pts.push({x: loX, y: hiY - (hiY - loY) * i / per});
  for (let i = 0; i < per; i++) pts.push({x: loX + (hiX - loX) * i / per, y: loY});
  for (let i = 0; i < per; i++) pts.push({x: hiX, y: loY + (hiY - loY) * i / per});
  return pts;
}
const POS = buildPerimeter(N_CELLS, 1200, 800, 130, 110);

// escape user-controlled text before it ever reaches innerHTML
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- dice ----
function makePipTexture(n) {
  const S = 128, c = document.createElement('canvas'); c.width = S; c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffe680'; ctx.fillRect(0, 0, S, S);
  ctx.strokeStyle = '#8a7550'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, S - 6, S - 6);
  const pts = {
    1: [[0.5,0.5]], 2: [[0.28,0.28],[0.72,0.72]], 3: [[0.26,0.26],[0.5,0.5],[0.74,0.74]],
    4: [[0.28,0.28],[0.72,0.28],[0.28,0.72],[0.72,0.72]],
    5: [[0.28,0.28],[0.72,0.28],[0.5,0.5],[0.28,0.72],[0.72,0.72]],
    6: [[0.28,0.24],[0.72,0.24],[0.28,0.5],[0.72,0.5],[0.28,0.76],[0.72,0.76]]
  }[n] || [];
  ctx.fillStyle = '#1a1410';
  pts.forEach(([px,py]) => { ctx.beginPath(); ctx.arc(px*S, py*S, S*0.09, 0, Math.PI*2); ctx.fill(); });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pipTex = [1,2,3,4,5,6].map(makePipTexture);
// BoxGeometry material order is [+X,-X,+Y,-Y,+Z,-Z]; assign pip counts so opposite faces sum to 7.
const DIE_FACE_VALUES = [3, 4, 1, 6, 2, 5];
const DIE_ROTATION = {
  1: [0, 0, 0], 2: [-Math.PI/2, 0, 0], 3: [0, 0, Math.PI/2],
  4: [0, 0, -Math.PI/2], 5: [Math.PI/2, 0, 0], 6: [Math.PI, 0, 0]
};
function makeDie() {
  const mats = DIE_FACE_VALUES.map(v => new THREE.MeshStandardMaterial({ map: pipTex[v-1], roughness: 0.35 }));
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.15), mats);
  mesh.castShadow = true;
  return mesh;
}
const die1 = makeDie(); die1.position.set(-0.14, 0.4, 0);
const die2 = makeDie(); die2.position.set(0.14, 0.4, 0);
mScene.add(die1, die2);
let diceSpinUntil = 0;
function rollDiceAnimation(v1, v2) {
  diceSpinUntil = performance.now() + 650;
  const r1 = DIE_ROTATION[v1], r2 = DIE_ROTATION[v2];
  setTimeout(() => {
    die1.rotation.set(r1[0], r1[1], r1[2]);
    die2.rotation.set(r2[0], r2[1], r2[2]);
  }, 650);
}

// ---- tokens (billboards) ----
const tokenSprites = {}; // username -> THREE.Sprite
const TOKEN_OFFSETS = [{dx:0,dz:0},{dx:-0.05,dz:-0.05},{dx:0.05,dz:-0.05},{dx:-0.05,dz:0.05},{dx:0.05,dz:0.05},{dx:0,dz:-0.07},{dx:0,dz:0.07}];
function getTokenSprite(u) {
  let s = tokenSprites[u];
  if (!s) {
    const tex = mTexLoader.load(tokenIcon(playerTokens[u]));
    tex.colorSpace = THREE.SRGBColorSpace;
    s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    s.scale.set(0.13, 0.13, 1);
    mScene.add(s);
    tokenSprites[u] = s;
  }
  return s;
}
function placeToken(u, p, jump, offsetIndex, offsetCount) {
  const s = getTokenSprite(u);
  const { x, z } = WPOS[p % N_CELLS];
  const off = (offsetCount && offsetCount > 1) ? TOKEN_OFFSETS[offsetIndex % TOKEN_OFFSETS.length] : { dx: 0, dz: 0 };
  s.position.set(x + off.dx, 0.075, z + off.dz);
  if (jump) {
    activeTweens.push({ mesh: s, from: s.position.clone(), to: s.position.clone(), start: performance.now(), duration: 260, bounce: true, onDone: () => {} });
  }
}
function relayoutTokens(players) {
  const groups = {};
  Object.keys(players).forEach(u => {
    const pos = players[u].position || 0;
    groups[pos] = groups[pos] || [];
    groups[pos].push(u);
  });
  Object.keys(groups).forEach(pos => {
    groups[pos].forEach((u, i) => placeToken(u, Number(pos), false, i, groups[pos].length));
  });
}
function moveToken(u, f, t, players) {
  const steps = (t - f + N_CELLS) % N_CELLS || 1;
  let s = 0;
  const anim = () => {
    const pos = (f + s) % N_CELLS;
    if (s === steps && players) {
      relayoutTokens(players);
    } else {
      placeToken(u, pos, true);
    }
    s++;
    if (s <= steps) setTimeout(anim, 220);
  };
  anim();
}

// ---- houses / hotels on the board ----
const buildingMeshes = {}; // cellIdx -> THREE.Group
function renderBuildings(state) {
  Object.values(buildingMeshes).forEach(g => mScene.remove(g));
  for (const k in buildingMeshes) delete buildingMeshes[k];
  const houses = state.houses || {}, hotels = state.hotels || {}, owners = state.owners || {};
  Object.keys(owners).forEach(cellStr => {
    const idx = Number(cellStr);
    const cell = CELLS[idx];
    if (!cell || cell[1] !== 'property') return;
    const grp = cell[4];
    const color = new THREE.Color(GROUP_COLORS[grp] || '#d4af37');
    const { x, z } = WPOS[idx];
    const g = new THREE.Group();
    if (hotels[cellStr]) {
      const hotel = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.4, roughness: 0.3 }));
      hotel.position.set(0, 0.025, 0);
      hotel.castShadow = true;
      g.add(hotel);
    } else {
      const count = houses[cellStr] || 0;
      for (let i = 0; i < count; i++) {
        const house = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.026, 0.026), new THREE.MeshStandardMaterial({ color, roughness: 0.5 }));
        house.position.set((i - (count - 1) / 2) * 0.032, 0.013, 0);
        house.castShadow = true;
        g.add(house);
      }
    }
    g.position.set(x, 0.003, z - 0.05);
    mScene.add(g);
    buildingMeshes[idx] = g;
  });
}

// ---- animation loop with a small tween queue (token hops) ----
const activeTweens = [];
function tickTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    const t = Math.min(1, (now - tw.start) / tw.duration);
    if (tw.bounce) tw.mesh.position.y = 0.075 + Math.sin(t * Math.PI) * 0.05;
    if (t >= 1) { tw.onDone(); activeTweens.splice(i, 1); }
  }
}
function animateMet(now) {
  requestAnimationFrame(animateMet);
  if (now < diceSpinUntil) {
    die1.rotation.x += 0.35; die1.rotation.y += 0.28;
    die2.rotation.x += 0.31; die2.rotation.y += 0.24;
  }
  tickTweens(now);
  mRenderer.render(mScene, mCamera);
}
resizeMetRenderer();
requestAnimationFrame(animateMet);

function updateTurnUI(state) {
  const order = (state.turnOrder && state.turnOrder.length) ? state.turnOrder : Object.keys(state.players);
  if (!order.length) return;
  const current = order[state.turnIndex % order.length];
  const mine = current === user;
  const buyPending = document.getElementById('buyBox').style.display !== 'none';
  document.getElementById('rollBtn').disabled = !mine || isRolling || buyPending || !!state.winner;
  document.getElementById('turnIndicator').textContent = state.winner ? '' : (mine ? (buyPending ? t('turn_buy_pending') : t('turn_mine')) : t('turn_other', {name: current}));
}

const BUILD_COSTS = [50, 50, 50, 50, 100];
function groupLabel(grp) { return ((I18N[lang] || I18N.fr).groups || {})[grp] || grp; }

function ownsFullGroup(state, grp, username) {
  const owners = state.owners || {};
  const cells = CELLS.map((c, i) => ({c, i})).filter(x => x.c[1] === 'property' && x.c[4] === grp).map(x => x.i);
  return cells.length > 0 && cells.every(i => owners[i] === username);
}

function renderBuildToolbar(state) {
  const toolbar = document.getElementById('buildToolbar');
  const me = state.players[user];
  if (!me) { toolbar.style.display = 'none'; return; }
  const idx = me.position;
  const cell = CELLS[idx];
  const typ = cell[1], grp = cell[4], name = cell[0];
  const owners = state.owners || {};
  if (typ !== 'property' || owners[idx] !== user) { toolbar.style.display = 'none'; return; }
  const houses = (state.houses && state.houses[idx]) || 0;
  const hotel = state.hotels && state.hotels[idx];
  const color = GROUP_COLORS[grp] || '#d4af37';
  const hasMonopoly = ownsFullGroup(state, grp, user);
  document.getElementById('buildToolbarTitle').textContent = hasMonopoly
    ? t('build_title', {name})
    : t('build_locked', {color: groupLabel(grp), name});
  const levelsHtml = [0, 1, 2, 3, 4].map(i => {
    const isHotel = i === 4;
    const done = isHotel ? !!hotel : houses > i;
    const active = hasMonopoly && !hotel && (isHotel ? houses >= 4 : houses === i);
    const icon = isHotel ? '/static/hotel_gold.png' : houseIcon(grp);
    const filterStyle = isHotel ? '' : houseFilterStyle(grp);
    const label = (I18N[lang] || I18N.fr).build_levels[i];
    const attr = active ? (isHotel ? `data-hotel="${idx}"` : `data-house="${idx}"`) : 'disabled';
    return `<button class="build-level-btn${done ? ' done' : ''}" ${attr} style="border-color:${color};"><img src="${icon}" alt="" style="${filterStyle}"><span class="build-level-label">${label}</span><span class="build-level-price">${BUILD_COSTS[i]}€</span></button>`;
  }).join('');
  const levelsBox = document.getElementById('buildLevels');
  levelsBox.innerHTML = levelsHtml;
  levelsBox.querySelectorAll('[data-house]').forEach(btn => btn.addEventListener('click', () => socket.emit('monopoly_add_house', {code: room, username: user, cell: btn.dataset.house})));
  levelsBox.querySelectorAll('[data-hotel]').forEach(btn => btn.addEventListener('click', () => socket.emit('monopoly_add_hotel', {code: room, username: user, cell: btn.dataset.hotel})));
  toolbar.style.display = 'block';
}

document.getElementById('buyBtn').addEventListener('click', () => {
  socket.emit('monopoly_buy_property', {code: room, username: user});
  document.getElementById('buyBox').style.display = 'none';
});

document.getElementById('skipBuyBtn').addEventListener('click', () => {
  socket.emit('monopoly_skip_buy', {code: room, username: user});
  document.getElementById('buyBox').style.display = 'none';
});

let lastWinner = null;
function checkWinner(state) {
  if (state.winner && state.winner !== lastWinner) {
    lastWinner = state.winner;
    setTimeout(() => alert(state.winner === user ? '🏆 Kazandın!' : '🏆 ' + state.winner + ' kazandı!'), 300);
  } else if (!state.winner) {
    lastWinner = null;
  }
}

socket.on('monopoly_room_state', (state) => {
  room = state.code;
  Object.keys(state.players).forEach(u => playerTokens[u] = state.players[u].token);
  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyPlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-item"><img src="${tokenIcon(state.players[u].token)}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:8px;">${esc(u)}</div>`).join('');
  } else {
    show('gameScreen');
    relayoutTokens(state.players);
    renderBuildings(state);
    document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-row"><span><img src="${tokenIcon(state.players[u].token)}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">${esc(u)}${state.players[u].bankrupt ? ' 💀' : ''}</span><span>💰 ${state.players[u].money}€</span></div>`).join('');
    document.getElementById('buyBox').style.display = 'none';
    document.getElementById('diceTotalBadge').style.display = 'none';
    renderBuildToolbar(state);
    updateTurnUI(state);
    checkWinner(state);
  }
});

socket.on('monopoly_animate_move', (data) => {
  const {username, from, to, dice1, dice2, state, cellName, cellPrice, cellType, pendingBuy} = data;
  rollDiceAnimation(dice1, dice2);
  const badge = document.getElementById('diceTotalBadge');
  setTimeout(() => { badge.textContent = dice1 + dice2; badge.style.display = 'flex'; }, 650);
  setTimeout(() => moveToken(username, from, to, state.players), 650);
  document.getElementById('lastAction').textContent = t('last_action', {user: username, d1: dice1, d2: dice2, sum: dice1 + dice2, to});
  isRolling = false;
  document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-row"><span><img src="${tokenIcon(state.players[u].token)}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">${esc(u)}${state.players[u].bankrupt ? ' 💀' : ''}</span><span>💰 ${state.players[u].money}€</span></div>`).join('');
  if (username === user && pendingBuy) {
    document.getElementById('buyInfo').textContent = t('buy_info', {name: cellName, price: cellPrice, type: t('cell_type_' + cellType)});
    document.getElementById('buyBox').style.display = 'block';
  } else {
    document.getElementById('buyBox').style.display = 'none';
  }
  renderBuildings(state);
  renderBuildToolbar(state);
  updateTurnUI(state);
  checkWinner(state);
});

socket.on('monopoly_error', (d) => {
  const msg = d.code ? t('err_' + d.code) : (d.msg || t('err_generic'));
  alert(t('alert_prefix') + msg);
  isRolling = false;
  document.getElementById('rollBtn').disabled = false;
});
</script>

</body>
</html>
