<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metropoly VIP</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(rgba(5,5,5,0.88), rgba(5,5,5,0.94)), url('/static/metroploy_plateau_lux.png.png') center/cover fixed no-repeat, #0a0a0a; color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, rgba(10,10,10,0.85) 0%, rgba(26,21,18,0.9) 100%); }
  .screen.active { display: flex; }
  h1 { font-size: 64px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 40px; letter-spacing: 6px; }
  .card { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 50px; max-width: 500px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 20px; margin-bottom: 12px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 16px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 16px; margin-bottom: 5px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .token-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 20px 0; }
  .token-btn { aspect-ratio: 1; padding: 10px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .token-btn img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7)); pointer-events: none; }
  .token-btn:hover { background: rgba(60,60,60,0.9); transform: scale(1.05); }
  .token-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.3s; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .error { color: #ff6b6b; text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; }
  .lang-btn { padding: 8px 14px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 48px; color: #d4af37; font-weight: bold; margin: 30px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 15px; margin: 20px 0; max-height: 200px; overflow-y: auto; min-height: 100px; }
  .player-item { padding: 10px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; }
  .player-item:last-child { border-bottom: none; }
  #gameScreen { background: #0a0a0a; padding: 30px; overflow-y: auto; }
  .game-container { display: flex; gap: 30px; justify-content: center; align-items: flex-start; width: 100%; max-width: 1600px; margin: 0 auto; }
  .board { position: relative; width: 1200px; height: 800px; border: 8px solid #d4af37; border-radius: 25px; background: linear-gradient(135deg, #0a0a0a, #1a1512); box-shadow: 0 0 70px rgba(212,175,55,0.8), inset 0 0 40px rgba(212,175,55,0.15); overflow: hidden; }
  .board-inner { width: 100%; height: 100%; position: relative; background: linear-gradient(rgba(5,5,5,0.3), rgba(5,5,5,0.4)), url('/static/metroploy_plateau_lux.png.png') center/cover no-repeat; transform-style: preserve-3d; }
  .board-title { display: none; }
  .dices { position: absolute; top: 470px; left: 50%; transform: translateX(-50%); display: flex; gap: 100px; perspective: 3000px; z-index: 3; }
  .dices::before { content: ''; position: absolute; left: 50%; bottom: -20px; width: 340px; height: 36px; background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%); transform: translateX(-50%); z-index: -1; }
  .dice-container { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; }
  .dice-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease-out; }
  .dice-3d.rolling { animation: spin 1.5s cubic-bezier(0.25,0.46,0.45,0.94); }
  @keyframes spin {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg); }
    50% { transform: rotateX(1440deg) rotateY(1440deg) rotateZ(720deg); }
    75% { transform: rotateX(2160deg) rotateY(2160deg) rotateZ(1080deg); }
    100% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  }
  .die-face { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #ffd700 0%, #ffed4e 15%, #ffe680 30%, #daa520 50%, #b8860b 70%, #8b6914 100%); border: 6px solid #8a7550; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset -8px -8px 25px rgba(0,0,0,0.5), inset 12px 12px 35px rgba(255,255,255,0.8), 0 20px 50px rgba(0,0,0,0.8), 0 0 60px rgba(212,175,55,1); }
  .die-face::before { content: ''; position: absolute; width: 100%; height: 100%; background: radial-gradient(ellipse 60% 40% at 30% 30%, rgba(255,255,255,0.8), transparent 70%); border-radius: 20px; }
  .pip-dot { position: absolute; width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #2a2a2a, #000); border-radius: 50%; box-shadow: inset 0 3px 6px rgba(0,0,0,1), 0 2px 4px rgba(0,0,0,0.8); z-index: 2; }
  .face-1 { transform: translateZ(70px); }
  .face-2 { transform: rotateY(180deg) translateZ(70px); }
  .face-3 { transform: rotateY(90deg) translateZ(70px); }
  .face-4 { transform: rotateY(-90deg) translateZ(70px); }
  .face-5 { transform: rotateX(90deg) translateZ(70px); }
  .face-6 { transform: rotateX(-90deg) translateZ(70px); }
  .tokens-layer { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; transform-style: preserve-3d; }
  .token { position: absolute; width: 60px; height: 60px; transition: left 0.35s cubic-bezier(0.25,0.46,0.45,0.94), top 0.35s cubic-bezier(0.25,0.46,0.45,0.94); transform: translate(-50%,-85%); z-index: 10; }
  .token img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212,175,55,0.9)) drop-shadow(0 12px 6px rgba(0,0,0,0.7)); }
  .token::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 30px; height: 9px; background: radial-gradient(ellipse, rgba(0,0,0,0.6), transparent 70%); transform: translateX(-50%); z-index: -1; }
  .token.landing { animation: tokenLand 0.35s ease-out; }
  @keyframes tokenLand {
    0% { transform: translate(-50%,-110%) scale(1.12); }
    60% { transform: translate(-50%,-70%) scale(0.92); }
    100% { transform: translate(-50%,-85%) scale(1); }
  }
  .panel { width: 320px; background: rgba(26,26,26,0.98); border: 2px solid #d4af37; border-radius: 20px; padding: 20px; box-shadow: 0 0 40px rgba(212,175,55,0.3); max-height: 900px; overflow-y: auto; }
  .panel-box { background: rgba(10,10,10,0.9); border: 1px solid #d4af37; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .panel-title { color: #d4af37; font-weight: bold; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #d4af37; }
  .roll-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2d7a56, #1f5a42) !important; color: #fff !important; border: 2px solid #3a9d6d; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.3s; letter-spacing: 2px; }
  .roll-btn:hover { box-shadow: 0 0 25px #3a9d6d; transform: scale(1.02); }
  .roll-btn:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.5; }
  .players-info { font-size: 13px; color: #f5e6d3; max-height: 200px; overflow-y: auto; }
  .player-row { padding: 8px 0; border-bottom: 1px solid rgba(212,175,55,0.2); display: flex; justify-content: space-between; }
  .player-row:last-child { border-bottom: none; }
  .action-log { color: #d4af37; font-size: 12px; line-height: 1.8; min-height: 70px; word-wrap: break-word; }
  .bottom-section { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding: 20px; width: 1200px; max-width: 100%; margin: 0 auto; }
  .buy-info { font-size: 14px; color: #f5e6d3; margin-bottom: 10px; line-height: 1.5; }
  .buy-actions { display: flex; gap: 10px; }
  .buy-actions button { flex: 1; }
  .skip-btn { background: #444 !important; color: #f5e6d3 !important; border-color: #666 !important; }
  .dice-total-badge { position: absolute; top: -58px; left: 50%; transform: translateX(-50%); width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle, #1a1512, #000); border: 3px solid #d4af37; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #d4af37; box-shadow: 0 0 25px rgba(212,175,55,0.7), inset 0 0 15px rgba(212,175,55,0.3); z-index: 4; }
  .build-toolbar { width: 1200px; max-width: 100%; margin: 0 auto; padding: 10px 20px 25px; }
  .build-toolbar-title { color: #d4af37; font-weight: bold; text-align: center; margin-bottom: 14px; letter-spacing: 1px; text-transform: uppercase; font-size: 14px; }
  .build-levels { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .build-level-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(10,10,10,0.85); border: 2px solid #d4af37; border-radius: 14px; padding: 14px 18px; min-width: 100px; cursor: pointer; transition: all 0.25s; font-family: inherit; }
  .build-level-btn img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7)); }
  .build-level-label { font-size: 11px; color: #f5e6d3; font-weight: bold; letter-spacing: 0.5px; }
  .build-level-price { font-size: 11px; color: #d4af37; }
  .build-level-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .build-level-btn.done { opacity: 0.65; box-shadow: 0 0 0 2px #33cc33 inset; cursor: default; }
  .build-level-btn:not(:disabled):hover { transform: translateY(-4px); box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
  @media (max-width: 1600px) { .game-container { flex-direction: column; align-items: center; } .panel { width: 400px; } }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">

</div>

let lang = localStorage.getItem('metropoly_lang') || 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('selected', btn.dataset.lang === lang));
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    localStorage.setItem('metropoly_lang', lang);
    applyStaticI18n();
  });
});
applyStaticI18n();

const CELLS = {{ cells|tojson }}; // [nom, type, prix, loyer, groupe] par case, indexé comme côté serveur
const GROUP_COLORS = { green:'#33cc33', brown:'#cc7733', orange:'#ff9933', purple:'#9933ff', yellow:'#e0c040', blue:'#3366ff', red:'#ff3333' };
const HOUSE_ICONS = { green:'/static/house_green.png', brown:'/static/house_brown.png', orange:'/static/house_orange.png', purple:'/static/house_purple.png', yellow:'/static/house_yellow.png', red:'/static/house_red.png' };
function houseIcon(grp) { return HOUSE_ICONS[grp] || HOUSE_ICONS.green; }
function houseFilterStyle(grp) { return grp === 'blue' ? 'filter:hue-rotate(150deg) saturate(1.4) drop-shadow(0 2px 3px rgba(0,0,0,0.6));' : ''; }
const TOKEN_ICONS = {
  car: '/static/pawn_car.png',
  jackpot: '/static/pawn_jackpot.png',
  boat: '/static/pawn_boat.png',
  horse: '/static/pawn_horse.png',
  hat: '/static/pawn_hat.png',
  cat: '/static/pawn_cat.png'
};
function tokenIcon(id) { return TOKEN_ICONS[id] || TOKEN_ICONS.hat; }
const N_CELLS = 28; // doit correspondre à len(METROPOLY_CELLS) côté serveur
function buildPerimeter(n, w, h, marginX, marginY) {
  const per = n / 4;
  const loX = marginX, hiX = w - marginX, loY = marginY, hiY = h - marginY, pts = [];
  for (let i = 0; i < per; i++) pts.push({x: hiX - (hiX - loX) * i / per, y: hiY});
  for (let i = 0; i < per; i++) pts.push({x: loX, y: hiY - (hiY - loY) * i / per});
  for (let i = 0; i < per; i++) pts.push({x: loX + (hiX - loX) * i / per, y: loY});
  for (let i = 0; i < per; i++) pts.push({x: hiX, y: loY + (hiY - loY) * i / per});
  return pts;
}
const POS = buildPerimeter(N_CELLS, 1200, 800, 130, 110);

function setDice(el, val) {
  const rot = {1: 'rotateX(0) rotateY(0)', 2: 'rotateX(0) rotateY(180deg)', 3: 'rotateX(0) rotateY(-90deg)', 4: 'rotateX(0) rotateY(90deg)', 5: 'rotateX(-90deg) rotateY(0)', 6: 'rotateX(90deg) rotateY(0)'};
  el.style.transform = rot[val] || 'rotateX(0) rotateY(0)';
}

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

const TOKEN_OFFSETS = [{dx:0,dy:0},{dx:-16,dy:-16},{dx:16,dy:-16},{dx:-16,dy:16},{dx:16,dy:16},{dx:0,dy:-22},{dx:0,dy:22}];

function placeToken(u, p, jump, offsetIndex, offsetCount) {
  let el = document.querySelector(`[data-u="${u}"]`);
  if (!el) {
    el = document.createElement('div');
    el.className = 'token';
    el.dataset.u = u;
    el.innerHTML = `<img src="${tokenIcon(playerTokens[u])}" alt="${u}">`;
    document.getElementById('tokensLayer').appendChild(el);
  }
  const {x, y} = POS[p % N_CELLS];
  const off = (offsetCount && offsetCount > 1) ? TOKEN_OFFSETS[offsetIndex % TOKEN_OFFSETS.length] : {dx: 0, dy: 0};
  el.style.left = (x + off.dx) + 'px';
  el.style.top = (y + off.dy) + 'px';
  if (jump) {
    el.classList.remove('landing');
    void el.offsetWidth;
    el.classList.add('landing');
  }
}

function relayoutTokens(players) {
  const groups = {};
  Object.keys(players).forEach(u => {
    const pos = players[u].position || 0;
    groups[pos] = groups[pos] || [];
    groups[pos].push(u);
  });
  Object.keys(groups).forEach(pos => {
    groups[pos].forEach((u, i) => placeToken(u, Number(pos), false, i, groups[pos].length));
  });
}

function moveToken(u, f, t, players) {
  const steps = (t - f + N_CELLS) % N_CELLS || 1;
  let s = 0;
  const anim = () => {
    const pos = (f + s) % N_CELLS;
    if (s === steps && players) {
      relayoutTokens(players);
      const el = document.querySelector(`[data-u="${u}"]`);
      if (el) { el.classList.remove('landing'); void el.offsetWidth; el.classList.add('landing'); }
    } else {
      placeToken(u, pos, true);
    }
    s++;
    if (s <= steps) setTimeout(anim, 350);
  };
  anim();
}

document.querySelectorAll('.token-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.token-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    token = btn.dataset.token;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_username_required');
  playerTokens[user] = token;
  socket.emit('monopoly_create_room', {username: user, token});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_fields_required');
  playerTokens[user] = token;
  socket.emit('monopoly_join_room', {username: user, token, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('monopoly_start_game', {code: room});
});

document.getElementById('rollBtn').addEventListener('click', () => {
  if (isRolling || document.getElementById('rollBtn').disabled) return;
  isRolling = true;
  document.getElementById('dice1').classList.add('rolling');
  document.getElementById('dice2').classList.add('rolling');
  document.getElementById('diceTotalBadge').style.display = 'none';
  document.getElementById('rollBtn').disabled = true;
  setTimeout(() => {
    socket.emit('monopoly_roll_dice', {code: room, username: user});
  }, 1500);
});

function updateTurnUI(state) {
  const names = Object.keys(state.players);
  if (!names.length) return;
  const current = names[state.turnIndex % names.length];
  const mine = current === user;
  const buyPending = document.getElementById('buyBox').style.display !== 'none';
  document.getElementById('rollBtn').disabled = !mine || isRolling || buyPending;
  document.getElementById('turnIndicator').textContent = mine ? (buyPending ? t('turn_buy_pending') : t('turn_mine')) : t('turn_other', {name: current});
}

const BUILD_COSTS = [50, 50, 50, 50, 100];
function groupLabel(grp) { return ((I18N[lang] || I18N.fr).groups || {})[grp] || grp; }

function ownsFullGroup(state, grp, username) {
  const owners = state.owners || {};
  const cells = CELLS.map((c, i) => ({c, i})).filter(x => x.c[1] === 'property' && x.c[4] === grp).map(x => x.i);
  return cells.length > 0 && cells.every(i => owners[i] === username);
}

function renderBuildToolbar(state) {
  const toolbar = document.getElementById('buildToolbar');
  const me = state.players[user];
  if (!me) { toolbar.style.display = 'none'; return; }
  const idx = me.position;
  const cell = CELLS[idx];
  const typ = cell[1], grp = cell[4], name = cell[0];
  const owners = state.owners || {};
  if (typ !== 'property' || owners[idx] !== user) { toolbar.style.display = 'none'; return; }
  const houses = (state.houses && state.houses[idx]) || 0;
  const hotel = state.hotels && state.hotels[idx];
  const color = GROUP_COLORS[grp] || '#d4af37';
  const hasMonopoly = ownsFullGroup(state, grp, user);
  document.getElementById('buildToolbarTitle').textContent = hasMonopoly
    ? t('build_title', {name})
    : t('build_locked', {color: groupLabel(grp), name});
  const levelsHtml = [0, 1, 2, 3, 4].map(i => {
    const isHotel = i === 4;
    const done = isHotel ? !!hotel : houses > i;
    const active = hasMonopoly && !hotel && (isHotel ? houses >= 4 : houses === i);
    const icon = isHotel ? '/static/hotel_gold.png' : houseIcon(grp);
    const filterStyle = isHotel ? '' : houseFilterStyle(grp);
    const label = (I18N[lang] || I18N.fr).build_levels[i];
    const attr = active ? (isHotel ? `data-hotel="${idx}"` : `data-house="${idx}"`) : 'disabled';
    return `<button class="build-level-btn${done ? ' done' : ''}" ${attr} style="border-color:${color};"><img src="${icon}" alt="" style="${filterStyle}"><span class="build-level-label">${label}</span><span class="build-level-price">${BUILD_COSTS[i]}€</span></button>`;
  }).join('');
  const levelsBox = document.getElementById('buildLevels');
  levelsBox.innerHTML = levelsHtml;
  levelsBox.querySelectorAll('[data-house]').forEach(btn => btn.addEventListener('click', () => socket.emit('monopoly_add_house', {code: room, username: user, cell: btn.dataset.house})));
  levelsBox.querySelectorAll('[data-hotel]').forEach(btn => btn.addEventListener('click', () => socket.emit('monopoly_add_hotel', {code: room, username: user, cell: btn.dataset.hotel})));
  toolbar.style.display = 'block';
}

document.getElementById('buyBtn').addEventListener('click', () => {
  socket.emit('monopoly_buy_property', {code: room, username: user});
  document.getElementById('buyBox').style.display = 'none';
});

document.getElementById('skipBuyBtn').addEventListener('click', () => {
  socket.emit('monopoly_skip_buy', {code: room, username: user});
  document.getElementById('buyBox').style.display = 'none';
});

socket.on('monopoly_room_state', (state) => {
  room = state.code;
  Object.keys(state.players).forEach(u => playerTokens[u] = state.players[u].token);
  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyPlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-item"><img src="${tokenIcon(state.players[u].token)}" style="width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:8px;">${u}</div>`).join('');
  } else {
    show('gameScreen');
    setDice(document.getElementById('dice1'), 1);
    setDice(document.getElementById('dice2'), 1);
    relayoutTokens(state.players);
    document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-row"><span><img src="${tokenIcon(state.players[u].token)}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">${u}</span><span>💰 ${state.players[u].money}€</span></div>`).join('');
    document.getElementById('buyBox').style.display = 'none';
    document.getElementById('diceTotalBadge').style.display = 'none';
    renderBuildToolbar(state);
    updateTurnUI(state);
  }
});

socket.on('monopoly_animate_move', (data) => {
  const {username, from, to, dice1, dice2, state, cellName, cellPrice, cellType, pendingBuy} = data;
  setDice(document.getElementById('dice1'), dice1);
  setDice(document.getElementById('dice2'), dice2);
  document.getElementById('dice1').classList.remove('rolling');
  document.getElementById('dice2').classList.remove('rolling');
  const badge = document.getElementById('diceTotalBadge');
  badge.textContent = dice1 + dice2;
  badge.style.display = 'flex';
  setTimeout(() => moveToken(username, from, to, state.players), 700);
  document.getElementById('lastAction').textContent = t('last_action', {user: username, d1: dice1, d2: dice2, sum: dice1 + dice2, to});
  isRolling = false;
  document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-row"><span><img src="${tokenIcon(state.players[u].token)}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:6px;">${u}</span><span>💰 ${state.players[u].money}€</span></div>`).join('');
  if (username === user && pendingBuy) {
    document.getElementById('buyInfo').textContent = t('buy_info', {name: cellName, price: cellPrice, type: t('cell_type_' + cellType)});
    document.getElementById('buyBox').style.display = 'block';
  } else {
    document.getElementById('buyBox').style.display = 'none';
  }
  renderBuildToolbar(state);
  updateTurnUI(state);
});

socket.on('monopoly_error', (d) => {
  const msg = d.code ? t('err_' + d.code) : (d.msg || t('err_generic'));
  alert(t('alert_prefix') + msg);
  isRolling = false;
  document.getElementById('rollBtn').disabled = false;
});
</script>
