<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monopoly Luxe VIP</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(135deg, #2a2520, #1a1512); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
  .screen.active { display: flex; }
  
  h1 { color: #d4af37; font-size: 36px; letter-spacing: 3px; }
  .card { background: #1a1a1a; border: 3px solid #d4af37; border-radius: 10px; padding: 30px; max-width: 400px; width: 100%; }
  label { display: block; color: #d4af37; font-weight: bold; margin-top: 15px; }
  input { width: 100%; padding: 12px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 5px; font-size: 14px; }
  button { width: 100%; padding: 14px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
  button:hover { opacity: 0.9; }
  
  .tokens { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .token-btn { padding: 10px 14px; background: #333; border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold; }
  .token-btn.selected { background: #d4af37; color: #1a1a1a; }
  
  .room-code { text-align: center; font-size: 32px; color: #d4af37; font-weight: bold; margin: 20px 0; }
  
  .game-wrap { display: flex; gap: 20px; max-width: 1400px; margin: 20px auto; }
  
  .plateau-wrapper {
    position: relative;
    width: 800px;
    height: 800px;
    background: url('/static/metroploy_plateau_lux.png.png') center/contain no-repeat #0a0a0a;
    border: 4px solid #d4af37;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
  }
  
  .tokens-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; }
  
  .player-token {
    position: absolute;
    font-size: 36px;
    transform: translate(-50%, -50%);
    z-index: 20;
    filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.8));
    transition: left 0.3s ease-out, top 0.3s ease-out;
  }
  
  .dices-container {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
    z-index: 15;
  }
  
  .dice-canvas {
    width: 100px;
    height: 100px;
    filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8));
    animation: none;
  }
  
  .dice-canvas.rolling {
    animation: rollDice 1s ease-in-out;
  }
  
  @keyframes rollDice {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25% { transform: rotateX(540deg) rotateY(720deg) rotateZ(180deg); }
    50% { transform: rotateX(1080deg) rotateY(1440deg) rotateZ(360deg); }
    75% { transform: rotateX(1620deg) rotateY(2160deg) rotateZ(540deg); }
    100% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  }
  
  .right-panel { width: 280px; display: flex; flex-direction: column; gap: 15px; }
  .panel-box { background: #1a1a1a; border: 2px solid #d4af37; border-radius: 8px; padding: 15px; }
  .panel-title { color: #d4af37; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid #d4af37; padding-bottom: 5px; }
  .player-info { font-size: 12px; margin: 5px 0; padding: 5px; background: #0a0a0a; border-radius: 3px; border-left: 2px solid #d4af37; }
  .last-action { color: #d4af37; font-size: 12px; line-height: 1.6; }
  
  #rollBtn { background: linear-gradient(135deg, #3a7d63, #2a5d50); color: white; }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <h1>♠️ MONOPOLY ♦️</h1>
  <div class="card">
    <label>Ton pseudo</label>
    <input type="text" id="username" placeholder="Joueur">
    
    <label>Choisis ton jeton</label>
    <div class="tokens">
      <button class="token-btn" data-token="🎩">🎩</button>
      <button class="token-btn" data-token="🚗">🚗</button>
      <button class="token-btn" data-token="🐕">🐕</button>
      <button class="token-btn" data-token="🚀">🚀</button>
      <button class="token-btn" data-token="⚓">⚓</button>
      <button class="token-btn" data-token="💎">💎</button>
    </div>
    
    <button id="createBtn">CRÉER UNE SALLE</button>
    <label>Ou rejoindre</label>
    <input type="text" id="roomCode" placeholder="Code">
    <button id="joinBtn">REJOINDRE</button>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1>MONOPOLY</h1>
  <div class="card">
    <div class="room-code" id="roomDisplay">MON-XXXX</div>
    <label>Joueurs</label>
    <div id="playersList"></div>
    <button id="startBtn">🚀 DÉMARRER</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <h1>MONOPOLY</h1>
  <div class="game-wrap">
    <div class="plateau-wrapper">
      <div class="tokens-layer" id="tokensLayer"></div>
      <div class="dices-container">
        <canvas id="dice1" class="dice-canvas" width="100" height="100"></canvas>
        <canvas id="dice2" class="dice-canvas" width="100" height="100"></canvas>
      </div>
    </div>
    
    <div class="right-panel">
      <div class="panel-box">
        <div class="panel-title">🎲 DÉS</div>
        <button id="rollBtn">LANCER</button>
      </div>
      <div class="panel-box">
        <div class="panel-title">👥 JOUEURS</div>
        <div id="gamePlayersList"></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">📊 COUP</div>
        <div class="last-action" id="lastAction">Prêt...</div>
      </div>
    </div>
  </div>
</div>

<script>
const socket = io();
let user = '', token = '🎩', room = '', isRolling = false;
let playerTokens = {};

const GRID_POS = [
  {x: 400, y: 760}, {x: 330, y: 760}, {x: 260, y: 760}, {x: 190, y: 760}, {x: 120, y: 760},
  {x: 50, y: 760}, {x: 40, y: 690}, {x: 40, y: 620}, {x: 40, y: 550}, {x: 40, y: 480},
  {x: 40, y: 410}, {x: 40, y: 340}, {x: 40, y: 270}, {x: 40, y: 200}, {x: 40, y: 130},
  {x: 40, y: 60}, {x: 110, y: 40}, {x: 180, y: 40}, {x: 250, y: 40}, {x: 320, y: 40},
  {x: 390, y: 40}, {x: 460, y: 40}, {x: 530, y: 40}, {x: 600, y: 40}, {x: 670, y: 40},
  {x: 740, y: 40}, {x: 760, y: 110}, {x: 760, y: 180},
];

function drawDice(canvas, value) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  
  // Fond doré dégradé
  const grad = ctx.createLinearGradient(0, 0, w, w);
  grad.addColorStop(0, '#e6c96f');
  grad.addColorStop(0.5, '#c9a86a');
  grad.addColorStop(1, '#8a7550');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, w);
  
  // Bordure
  ctx.strokeStyle = '#5c4a2f';
  ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, w-3, w-3);
  
  // Points noirs
  ctx.fillStyle = '#141414';
  const dotRadius = w / 12;
  
  const dots = {
    1: [[w/2, w/2]],
    2: [[w/4, w/4], [3*w/4, 3*w/4]],
    3: [[w/4, w/4], [w/2, w/2], [3*w/4, 3*w/4]],
    4: [[w/4, w/4], [3*w/4, w/4], [w/4, 3*w/4], [3*w/4, 3*w/4]],
    5: [[w/4, w/4], [3*w/4, w/4], [w/2, w/2], [w/4, 3*w/4], [3*w/4, 3*w/4]],
    6: [[w/4, w/4], [3*w/4, w/4], [w/4, w/2], [3*w/4, w/2], [w/4, 3*w/4], [3*w/4, 3*w/4]]
  };
  
  dots[value].forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
    ctx.fill();
  });
}

document.querySelectorAll('.token-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.token-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    token = b.dataset.token;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return alert('Pseudo requis');
  playerTokens[user] = token;
  socket.emit('monopoly_create_room', {username: user, token});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return alert('Données requises');
  playerTokens[user] = token;
  socket.emit('monopoly_join_room', {username: user, token, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('monopoly_start_game', {code: room});
});

document.getElementById('rollBtn').addEventListener('click', () => {
  if (isRolling) return;
  isRolling = true;
  
  document.getElementById('dice1').classList.add('rolling');
  document.getElementById('dice2').classList.add('rolling');
  
  setTimeout(() => {
    socket.emit('monopoly_roll_dice', {code: room, username: user});
  }, 1000);
});

function showScreen(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

function moveToken(username, fromPos, toPos) {
  let el = document.querySelector(`[data-user="${username}"]`);
  
  if (!el) {
    el = document.createElement('div');
    el.className = 'player-token';
    el.dataset.user = username;
    el.textContent = playerTokens[username] || '🎩';
    document.getElementById('tokensLayer').appendChild(el);
  }
  
  const totalSteps = (toPos - fromPos + 28) % 28;
  let step = 0;
  
  function animate() {
    const pos = (fromPos + step) % 28;
    const {x, y} = GRID_POS[pos];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    
    step++;
    if (step <= totalSteps) {
      setTimeout(animate, 300);
    }
  }
  
  animate();
}

socket.on('monopoly_room_state', (state) => {
  room = state.code;
  Object.keys(state.players).forEach(u => {
    playerTokens[u] = state.players[u].token;
  });
  
  if (!state.started) {
    showScreen('lobbyScreen');
    document.getElementById('roomDisplay').textContent = state.code;
    document.getElementById('playersList').innerHTML = Object.keys(state.players)
      .map(u => `<div class="player-info">${state.players[u].token} ${u}</div>`)
      .join('');
  } else {
    showScreen('gameScreen');
    drawDice(document.getElementById('dice1'), 1);
    drawDice(document.getElementById('dice2'), 1);
    document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players)
      .map(u => `<div class="player-info">${state.players[u].token} ${u} - ${state.players[u].money}€</div>`)
      .join('');
  }
});

socket.on('monopoly_animate_move', (data) => {
  const {username, from, to, dice1, dice2} = data;
  
  drawDice(document.getElementById('dice1'), dice1);
  drawDice(document.getElementById('dice2'), dice2);
  document.getElementById('dice1').classList.remove('rolling');
  document.getElementById('dice2').classList.remove('rolling');
  
  setTimeout(() => {
    moveToken(username, from, to);
  }, 500);
  
  document.getElementById('lastAction').textContent = `${username} a lancé ${dice1}+${dice2}=${dice1+dice2}`;
  isRolling = false;
});

socket.on('monopoly_error', (d) => {
  alert(d.msg || 'Erreur');
  isRolling = false;
});
</script>

</body>
</html>
