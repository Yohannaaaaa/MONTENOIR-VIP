<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monopoly Luxe</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  :root {
    --gold: #d4af37;
    --dark: #1a1a1a;
    --cream: #f5e6d3;
  }
  
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: linear-gradient(135deg, #2a2520 0%, #1a1512 100%);
    color: var(--cream);
    font-family: 'Arial', sans-serif;
    min-height: 100vh;
  }
  
  .screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .screen.active { display: flex; }
  
  .card {
    background: var(--dark);
    border: 2px solid var(--gold);
    border-radius: 10px;
    padding: 30px;
    max-width: 400px;
    width: 100%;
  }
  
  h1 { color: var(--gold); text-align: center; font-size: 32px; }
  
  label {
    display: block;
    color: var(--gold);
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 5px;
  }
  
  input {
    width: 100%;
    padding: 10px;
    background: #0a0a0a;
    border: 1px solid var(--gold);
    color: var(--cream);
    border-radius: 5px;
    font-size: 14px;
  }
  
  .tokens {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  
  .token-btn {
    padding: 8px 12px;
    background: #333;
    border: 2px solid var(--gold);
    color: var(--cream);
    cursor: pointer;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
  }
  
  .token-btn.selected {
    background: var(--gold);
    color: var(--dark);
  }
  
  button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #d4af37, #a0860d);
    color: var(--dark);
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    font-size: 14px;
  }
  
  button:hover { opacity: 0.9; }
  button:disabled { background: #666; color: #999; cursor: not-allowed; }
  
  .error { color: #ff6b6b; font-size: 12px; margin-top: 10px; }
  
  .room-code {
    text-align: center;
    font-size: 28px;
    color: var(--gold);
    font-weight: bold;
    margin: 20px 0;
  }
  
  .game-container {
    display: flex;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  
  .plateau-wrapper {
    position: relative;
    width: 800px;
    height: 800px;
    background: linear-gradient(135deg, #0a0a0a, #1a1512);
    border: 4px solid var(--gold);
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
  }
  
  .plateau {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  
  .case {
    position: absolute;
    border: 2px solid var(--gold);
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--cream);
    font-weight: bold;
    text-align: center;
    overflow: hidden;
  }
  
  .case.corner { width: 80px; height: 80px; }
  .case.side-h { width: 70px; height: 80px; }
  .case.side-v { width: 80px; height: 70px; }
  
  .case-color {
    position: absolute;
    background: #FFD700;
  }
  
  .case:nth-child(1) { top: 720px; left: 720px; width: 80px; height: 80px; }
  .case:nth-child(2) { bottom: 0; right: 630px; height: 80px; width: 70px; }
  .case:nth-child(3) { bottom: 0; right: 560px; height: 80px; width: 70px; }
  .case:nth-child(4) { bottom: 0; right: 490px; height: 80px; width: 70px; }
  .case:nth-child(5) { bottom: 0; right: 420px; height: 80px; width: 70px; }
  .case:nth-child(6) { bottom: 0; right: 350px; height: 80px; width: 70px; }
  .case:nth-child(7) { bottom: 0; right: 280px; height: 80px; width: 70px; }
  .case:nth-child(8) { bottom: 0; right: 210px; height: 80px; width: 70px; }
  .case:nth-child(9) { bottom: 0; right: 140px; height: 80px; width: 70px; }
  .case:nth-child(10) { bottom: 0; right: 70px; height: 80px; width: 70px; }
  .case:nth-child(11) { bottom: 0; right: 0; height: 80px; width: 80px; }
  
  .case:nth-child(12) { right: 0; top: 630px; width: 80px; height: 70px; }
  .case:nth-child(13) { right: 0; top: 560px; width: 80px; height: 70px; }
  .case:nth-child(14) { right: 0; top: 490px; width: 80px; height: 70px; }
  .case:nth-child(15) { right: 0; top: 420px; width: 80px; height: 70px; }
  .case:nth-child(16) { right: 0; top: 350px; width: 80px; height: 70px; }
  .case:nth-child(17) { right: 0; top: 280px; width: 80px; height: 70px; }
  .case:nth-child(18) { right: 0; top: 210px; width: 80px; height: 70px; }
  .case:nth-child(19) { right: 0; top: 140px; width: 80px; height: 70px; }
  .case:nth-child(20) { right: 0; top: 70px; width: 80px; height: 70px; }
  .case:nth-child(21) { right: 0; top: 0; height: 80px; width: 80px; }
  
  .case:nth-child(22) { top: 0; left: 630px; width: 70px; height: 80px; }
  .case:nth-child(23) { top: 0; left: 560px; width: 70px; height: 80px; }
  .case:nth-child(24) { top: 0; left: 490px; width: 70px; height: 80px; }
  .case:nth-child(25) { top: 0; left: 420px; width: 70px; height: 80px; }
  .case:nth-child(26) { top: 0; left: 350px; width: 70px; height: 80px; }
  .case:nth-child(27) { top: 0; left: 280px; width: 70px; height: 80px; }
  .case:nth-child(28) { top: 0; left: 210px; width: 70px; height: 80px; }
  
  .case:nth-child(29) { left: 0; top: 630px; width: 80px; height: 70px; }
  .case:nth-child(30) { left: 0; top: 560px; width: 80px; height: 70px; }
  .case:nth-child(31) { left: 0; top: 490px; width: 80px; height: 70px; }
  .case:nth-child(32) { left: 0; top: 420px; width: 80px; height: 70px; }
  .case:nth-child(33) { left: 0; top: 350px; width: 80px; height: 70px; }
  .case:nth-child(34) { left: 0; top: 280px; width: 80px; height: 70px; }
  .case:nth-child(35) { left: 0; top: 210px; width: 80px; height: 70px; }
  .case:nth-child(36) { left: 0; top: 140px; width: 80px; height: 70px; }
  .case:nth-child(37) { left: 0; top: 70px; width: 80px; height: 70px; }
  .case:nth-child(38) { left: 0; top: 0; width: 80px; height: 80px; }
  
  .center {
    position: absolute;
    top: 80px;
    left: 80px;
    width: 640px;
    height: 640px;
    background: #0a0a0a;
    border: 2px solid var(--gold);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .dices {
    display: flex;
    gap: 40px;
    margin-bottom: 20px;
  }
  
  .dice {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #e6c96f, #c9a86a);
    border: 3px solid var(--gold);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: bold;
    color: #141414;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
  }
  
  .dice.rolling {
    animation: rollDice 1s ease-in-out;
  }
  
  @keyframes rollDice {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    50% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
    100% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  }
  
  .tokens-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }
  
  .player-token {
    position: absolute;
    font-size: 32px;
    transform: translate(-50%, -50%);
    z-index: 20;
    transition: left 0.3s ease, top 0.3s ease;
    filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.8));
  }
  
  .right-panel {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  .panel-box {
    background: var(--dark);
    border: 2px solid var(--gold);
    border-radius: 8px;
    padding: 15px;
    color: var(--cream);
  }
  
  .panel-title {
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 5px;
  }
  
  .player-info {
    font-size: 12px;
    margin: 5px 0;
    padding: 5px;
    background: #1a1a1a;
    border-radius: 3px;
  }
  
  .last-action {
    color: var(--gold);
    font-size: 12px;
    line-height: 1.5;
  }
  
  #rollBtn {
    background: linear-gradient(135deg, #3a7d63, #2a5d50);
    color: white;
  }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="card">
    <h1>♠️ MONOPOLY ♦️</h1>
    <label>Ton pseudo</label>
    <input type="text" id="username" placeholder="Joueur">
    <label>Choisis ton jeton</label>
    <div class="tokens">
      <button class="token-btn" data-token="✈️">✈️</button>
      <button class="token-btn" data-token="🎰">🎰</button>
      <button class="token-btn" data-token="⛵">⛵</button>
      <button class="token-btn" data-token="🚗">🚗</button>
      <button class="token-btn" data-token="🎩">🎩</button>
      <button class="token-btn" data-token="🐈">🐈</button>
    </div>
    <button id="createBtn">Créer une partie</button>
    <label>Ou rejoindre</label>
    <input type="text" id="roomCode" placeholder="Code">
    <button id="joinBtn">Rejoindre</button>
    <div class="error" id="error"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <div class="card">
    <h1>En attente...</h1>
    <div class="room-code" id="roomDisplay">MON-XXXX</div>
    <div id="playersList"></div>
    <button id="startBtn">Démarrer la partie</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-container">
    <div class="plateau-wrapper">
      <div class="tokens-layer" id="tokensLayer"></div>
      <div class="plateau" id="plateau"></div>
      <div class="center">
        <div class="dices">
          <div class="dice" id="d1">1</div>
          <div class="dice" id="d2">1</div>
        </div>
        <button id="rollBtn">🎲 LANCER</button>
      </div>
    </div>
    <div class="right-panel">
      <div class="panel-box">
        <div class="panel-title">👥 Joueurs</div>
        <div id="playersList"></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">📊 Dernier coup</div>
        <div class="last-action" id="lastAction">Prêt...</div>
      </div>
    </div>
  </div>
</div>

<script>
const socket = io();
let user = '', token = '✈️', room = '', isRolling = false;
let tokenMap = {};

const GRID_POS = [
  {x: 760, y: 760}, {x: 690, y: 760}, {x: 620, y: 760}, {x: 550, y: 760}, {x: 480, y: 760},
  {x: 410, y: 760}, {x: 340, y: 760}, {x: 270, y: 760}, {x: 200, y: 760}, {x: 130, y: 760},
  {x: 40, y: 760}, {x: 40, y: 690}, {x: 40, y: 620}, {x: 40, y: 550}, {x: 40, y: 480},
  {x: 40, y: 410}, {x: 40, y: 340}, {x: 40, y: 270}, {x: 40, y: 200}, {x: 40, y: 130},
  {x: 40, y: 40}, {x: 110, y: 40}, {x: 180, y: 40}, {x: 250, y: 40}, {x: 320, y: 40},
  {x: 390, y: 40}, {x: 460, y: 40}, {x: 530, y: 40}, {x: 600, y: 40}, {x: 670, y: 40},
  {x: 760, y: 40}, {x: 760, y: 110}, {x: 760, y: 180}, {x: 760, y: 250}, {x: 760, y: 320},
  {x: 760, y: 390}, {x: 760, y: 460}, {x: 760, y: 530}, {x: 760, y: 600}, {x: 760, y: 670},
];

document.querySelectorAll('.token-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.token-btn').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    token = b.dataset.token;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return alert('Pseudo requis');
  tokenMap[user] = token;
  socket.emit('monopoly_create_room', {username: user, token});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return alert('Données requises');
  tokenMap[user] = token;
  socket.emit('monopoly_join_room', {username: user, token, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('monopoly_start_game', {code: room});
});

document.getElementById('rollBtn').addEventListener('click', () => {
  if (isRolling) return;
  isRolling = true;
  
  document.getElementById('d1').classList.add('rolling');
  document.getElementById('d2').classList.add('rolling');
  
  setTimeout(() => {
    socket.emit('monopoly_roll_dice', {code: room, username: user});
  }, 1000);
});

function showScreen(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

function createPlateau() {
  const p = document.getElementById('plateau');
  for (let i = 0; i < 40; i++) {
    const div = document.createElement('div');
    div.className = 'case';
    div.innerHTML = `Case ${i}`;
    p.appendChild(div);
  }
}

function moveToken(username, fromPos, toPos, tokenEmoji) {
  let el = document.querySelector(`[data-user="${username}"]`);
  
  if (!el) {
    el = document.createElement('div');
    el.className = 'player-token';
    el.dataset.user = username;
    el.textContent = tokenEmoji;
    document.getElementById('tokensLayer').appendChild(el);
  }
  
  const totalSteps = (toPos - fromPos + 40) % 40;
  let step = 0;
  
  function animate() {
    const pos = (fromPos + step) % 40;
    const {x, y} = GRID_POS[pos];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    
    step++;
    if (step <= totalSteps) {
      setTimeout(animate, 300);
    }
  }
  
  animate();
}

socket.on('monopoly_room_state', (state) => {
  room = state.code;
  Object.assign(tokenMap, state.players);
  
  if (!state.started) {
    showScreen('lobbyScreen');
    document.getElementById('roomDisplay').textContent = state.code;
    document.getElementById('playersList').innerHTML = Object.keys(state.players)
      .map(u => `<div class="player-info">${state.players[u].token} ${u}</div>`)
      .join('');
  } else {
    showScreen('gameScreen');
    createPlateau();
    document.getElementById('playersList').innerHTML = Object.keys(state.players)
      .map(u => `<div class="player-info">${state.players[u].token} ${u} - ${state.players[u].money}€</div>`)
      .join('');
  }
});

socket.on('monopoly_animate_move', (data) => {
  const {username, from, to, dice1, dice2} = data;
  
  document.getElementById('d1').textContent = dice1;
  document.getElementById('d2').textContent = dice2;
  document.getElementById('d1').classList.remove('rolling');
  document.getElementById('d2').classList.remove('rolling');
  
  const tokenEmoji = tokenMap[username].token || tokenMap[username];
  
  setTimeout(() => {
    moveToken(username, from, to, tokenEmoji);
  }, 500);
  
  document.getElementById('lastAction').textContent = `${username} a lancé ${dice1}+${dice2}=${dice1+dice2}`;
  isRolling = false;
});

socket.on('monopoly_error', (d) => {
  alert(d.msg);
  isRolling = false;
});
</script>

</body>
</html>
