<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metropoly VIP</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #0a0a0a 0%, #1a1512 100%); }
  .screen.active { display: flex; }
  h1 { font-size: 64px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 40px; letter-spacing: 6px; }
  .card { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 50px; max-width: 500px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 20px; margin-bottom: 12px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 16px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 16px; margin-bottom: 5px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .token-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 20px 0; }
  .token-btn { aspect-ratio: 1; padding: 15px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 12px; font-size: 32px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
  .token-btn:hover { background: rgba(60,60,60,0.9); transform: scale(1.05); }
  .token-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.3s; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .error { color: #ff6b6b; text-align: center; margin-top: 15px; font-size: 14px; min-height: 20px; }
  .room-code { font-size: 48px; color: #d4af37; font-weight: bold; margin: 30px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 15px; margin: 20px 0; max-height: 200px; overflow-y: auto; min-height: 100px; }
  .player-item { padding: 10px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; }
  .player-item:last-child { border-bottom: none; }
  #gameScreen { background: #0a0a0a; padding: 30px; overflow-y: auto; }
  .game-container { display: flex; gap: 30px; justify-content: center; align-items: flex-start; width: 100%; max-width: 1400px; margin: 0 auto; }
  .board { position: relative; width: 900px; height: 900px; border: 8px solid #d4af37; border-radius: 25px; background: linear-gradient(135deg, #0a0a0a, #1a1512); box-shadow: 0 0 70px rgba(212,175,55,0.8), inset 0 0 40px rgba(212,175,55,0.15); overflow: hidden; }
  .board-inner { width: 100%; height: 100%; position: relative; background: #000; }
  .board-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 80px; font-weight: bold; color: #d4af37; letter-spacing: 10px; text-shadow: 0 0 40px rgba(212,175,55,0.7); z-index: 5; }
  .dices { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: flex; gap: 120px; perspective: 3000px; z-index: 3; }
  .dice-container { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; }
  .dice-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease-out; }
  .dice-3d.rolling { animation: spin 1.5s cubic-bezier(0.25,0.46,0.45,0.94); }
  @keyframes spin {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg); }
    50% { transform: rotateX(1440deg) rotateY(1440deg) rotateZ(720deg); }
    75% { transform: rotateX(2160deg) rotateY(2160deg) rotateZ(1080deg); }
    100% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  }
  .die-face { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #ffd700 0%, #ffed4e 15%, #ffe680 30%, #daa520 50%, #b8860b 70%, #8b6914 100%); border: 6px solid #8a7550; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: inset -8px -8px 25px rgba(0,0,0,0.5), inset 12px 12px 35px rgba(255,255,255,0.8), 0 20px 50px rgba(0,0,0,0.8), 0 0 60px rgba(212,175,55,1); }
  .die-face::before { content: ''; position: absolute; width: 100%; height: 100%; background: radial-gradient(ellipse 60% 40% at 30% 30%, rgba(255,255,255,0.8), transparent 70%); border-radius: 20px; }
  .pip-dot { position: absolute; width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #2a2a2a, #000); border-radius: 50%; box-shadow: inset 0 3px 6px rgba(0,0,0,1), 0 2px 4px rgba(0,0,0,0.8); z-index: 2; }
  .face-1 { transform: translateZ(70px); }
  .face-2 { transform: rotateY(180deg) translateZ(70px); }
  .face-3 { transform: rotateY(90deg) translateZ(70px); }
  .face-4 { transform: rotateY(-90deg) translateZ(70px); }
  .face-5 { transform: rotateX(90deg) translateZ(70px); }
  .face-6 { transform: rotateX(-90deg) translateZ(70px); }
  .tokens-layer { position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .token { position: absolute; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; filter: drop-shadow(0 0 15px rgba(212,175,55,1)); transition: all 0.35s cubic-bezier(0.25,0.46,0.45,0.94); transform: translate(-50%,-50%); z-index: 10; }
  .panel { width: 320px; background: rgba(26,26,26,0.98); border: 2px solid #d4af37; border-radius: 20px; padding: 20px; box-shadow: 0 0 40px rgba(212,175,55,0.3); max-height: 900px; overflow-y: auto; }
  .panel-box { background: rgba(10,10,10,0.9); border: 1px solid #d4af37; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  .panel-title { color: #d4af37; font-weight: bold; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #d4af37; }
  .roll-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2d7a56, #1f5a42) !important; color: #fff !important; border: 2px solid #3a9d6d; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.3s; letter-spacing: 2px; }
  .roll-btn:hover { box-shadow: 0 0 25px #3a9d6d; transform: scale(1.02); }
  .roll-btn:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.5; }
  .players-info { font-size: 13px; color: #f5e6d3; max-height: 200px; overflow-y: auto; }
  .player-row { padding: 8px 0; border-bottom: 1px solid rgba(212,175,55,0.2); display: flex; justify-content: space-between; }
  .player-row:last-child { border-bottom: none; }
  .action-log { color: #d4af37; font-size: 12px; line-height: 1.8; min-height: 70px; word-wrap: break-word; }
  .bottom-section { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; padding: 30px 20px; width: 900px; margin: 0 auto; }
  .token-item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .token-emoji { font-size: 50px; }
  .token-name { font-size: 11px; color: #d4af37; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
  .eval-btn { padding: 10px 18px; border: 2px solid #d4af37; background: rgba(0,0,0,0.6); color: #d4af37; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; transition: all 0.3s; letter-spacing: 1px; }
  .eval-btn:hover { background: #d4af37; color: #000; transform: scale(1.05); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }
  @media (max-width: 1400px) { .game-container { flex-direction: column; align-items: center; } .panel { width: 400px; } }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <h1>♠️ METROPOLY ♦️</h1>
  <div class="card">
    <label class="label">🎮 Ton Pseudo</label>
    <input type="text" id="username" class="input" placeholder="Entrez votre nom">
    <label class="label">🎯 Choisissez votre jeton</label>
    <div class="token-grid">
      <button class="token-btn" data-token="✈️">✈️</button>
      <button class="token-btn" data-token="🎰">🎰</button>
      <button class="token-btn" data-token="⛵">⛵</button>
      <button class="token-btn" data-token="🚗">🚗</button>
      <button class="token-btn" data-token="🎩">🎩</button>
      <button class="token-btn" data-token="🐈">🐈</button>
    </div>
    <button class="btn" id="createBtn">➕ Créer une salle</button>
    <label class="label">OU REJOIGNEZ</label>
    <input type="text" id="roomCode" class="input" placeholder="Code de la salle">
    <button class="btn" id="joinBtn">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1>METROPOLY</h1>
  <div class="card">
    <div style="text-align: center; color: #d4af37; margin-bottom: 10px; font-weight: bold;">CODE DE LA SALLE</div>
    <div class="room-code" id="roomCodeDisplay">MET-XXXX</div>
    <label class="label">👥 Joueurs</label>
    <div class="players-list" id="lobbyPlayersList"></div>
    <button class="btn" id="startBtn">🚀 Démarrer le jeu</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-container">
    <div class="board">
      <div class="board-inner">
        <div class="board-title">METROPOLY</div>
        <div class="tokens-layer" id="tokensLayer"></div>
        <div class="dices">
          <div class="dice-container">
            <div class="dice-3d" id="dice1">
              <div class="die-face face-1"><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div></div>
              <div class="die-face face-2"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-3"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-4"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-5"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-6"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="top: 50%; left: 20%;"></div><div class="pip-dot" style="top: 50%; right: 20%;"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
            </div>
          </div>
          <div class="dice-container">
            <div class="dice-3d" id="dice2">
              <div class="die-face face-1"><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div></div>
              <div class="die-face face-2"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-3"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-4"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-5"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
              <div class="die-face face-6"><div class="pip-dot" style="top: 20%; left: 20%;"></div><div class="pip-dot" style="top: 20%; right: 20%;"></div><div class="pip-dot" style="top: 50%; left: 20%;"></div><div class="pip-dot" style="top: 50%; right: 20%;"></div><div class="pip-dot" style="bottom: 20%; left: 20%;"></div><div class="pip-dot" style="bottom: 20%; right: 20%;"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-box">
        <div class="panel-title">🎲 Lancer Les Dés</div>
        <button class="roll-btn" id="rollBtn">LANCER</button>
      </div>
      <div class="panel-box">
        <div class="panel-title">👥 Joueurs</div>
        <div class="players-info" id="gamePlayersList"></div>
      </div>
      <div class="panel-box">
        <div class="panel-title">📊 Dernier Coup</div>
        <div class="action-log" id="lastAction">⏳ En attente...</div>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    <div class="token-item"><div class="token-emoji">✈️</div><div class="token-name">Avion</div><button class="eval-btn" style="border-color: #ff9933; color: #ff9933;">EV AL</button></div>
    <div class="token-item"><div class="token-emoji">🎰</div><div class="token-name">Machine À Sous</div><button class="eval-btn" style="border-color: #3366ff; color: #3366ff;">EV AL</button></div>
    <div class="token-item"><div class="token-emoji">⛵</div><div class="token-name">Bateau</div><button class="eval-btn" style="border-color: #ff3333; color: #ff3333;">EV AL</button></div>
    <div class="token-item"><div class="token-emoji">🚗</div><div class="token-name">Voiture</div><button class="eval-btn" style="border-color: #33cc33; color: #33cc33;">EV AL</button></div>
    <div class="token-item"><div class="token-emoji">🎩</div><div class="token-name">Chapeau</div><button class="eval-btn" style="border-color: #cc7733; color: #cc7733;">EV AL</button></div>
    <div class="token-item"><div class="token-emoji">🐈</div><div class="token-name">Chat Noir</div><button class="eval-btn" style="border-color: #9933ff; color: #9933ff;">EV AL</button></div>
  </div>
</div>

<script>
const socket = io();
let user = '', token = '✈️', room = '', isRolling = false, playerTokens = {};
const POS = [{x:450,y:850},{x:380,y:850},{x:310,y:850},{x:240,y:850},{x:170,y:850},{x:100,y:850},{x:50,y:780},{x:50,y:710},{x:50,y:640},{x:50,y:570},{x:50,y:500},{x:50,y:430},{x:50,y:360},{x:50,y:290},{x:50,y:220},{x:50,y:150},{x:120,y:50},{x:190,y:50},{x:260,y:50},{x:330,y:50},{x:400,y:50},{x:470,y:50},{x:540,y:50},{x:610,y:50},{x:680,y:50},{x:750,y:50},{x:800,y:120},{x:800,y:190},{x:800,y:260},{x:800,y:330},{x:800,y:400},{x:800,y:470},{x:800,y:540},{x:800,y:610},{x:800,y:680},{x:800,y:750},{x:730,y:850},{x:660,y:850},{x:590,y:850},{x:520,y:850}];

function setDice(el, val) {
  const rot = {1: 'rotateX(0) rotateY(0)', 2: 'rotateX(0) rotateY(-90deg)', 3: 'rotateX(0) rotateY(90deg)', 4: 'rotateX(0) rotateY(180deg)', 5: 'rotateX(-90deg) rotateY(0)', 6: 'rotateX(90deg) rotateY(0)'};
  el.style.transform = rot[val] || 'rotateX(0) rotateY(0)';
}

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

function placeToken(u, p) {
  let el = document.querySelector(`[data-u="${u}"]`);
  if (!el) {
    el = document.createElement('div');
    el.className = 'token';
    el.dataset.u = u;
    el.textContent = playerTokens[u] || '✈️';
    document.getElementById('tokensLayer').appendChild(el);
  }
  const {x, y} = POS[p % 40];
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function moveToken(u, f, t) {
  const steps = (t - f + 40) % 40 || 1;
  let s = 0;
  const anim = () => { placeToken(u, f + s); s++; if (s <= steps) setTimeout(anim, 350); };
  anim();
}

document.querySelectorAll('.token-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.token-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    token = btn.dataset.token;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = '❌ Pseudo requis';
  playerTokens[user] = token;
  socket.emit('monopoly_create_room', {username: user, token});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = '❌ Données requises';
  playerTokens[user] = token;
  socket.emit('monopoly_join_room', {username: user, token, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('monopoly_start_game', {code: room});
});

document.getElementById('rollBtn').addEventListener('click', () => {
  if (isRolling) return;
  isRolling = true;
  document.getElementById('dice1').classList.add('rolling');
  document.getElementById('dice2').classList.add('rolling');
  document.getElementById('rollBtn').disabled = true;
  setTimeout(() => {
    socket.emit('monopoly_roll_dice', {code: room, username: user});
  }, 1500);
});

socket.on('monopoly_room_state', (state) => {
  room = state.code;
  Object.keys(state.players).forEach(u => playerTokens[u] = state.players[u].token);
  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyPlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-item">${state.players[u].token} ${u}</div>`).join('');
  } else {
    show('gameScreen');
    setDice(document.getElementById('dice1'), 1);
    setDice(document.getElementById('dice2'), 1);
    Object.keys(state.players).forEach(u => placeToken(u, 0));
    document.getElementById('gamePlayersList').innerHTML = Object.keys(state.players).map(u => `<div class="player-row"><span>${state.players[u].token} ${u}</span><span>💰 ${state.players[u].money}€</span></div>`).join('');
  }
});

socket.on('monopoly_animate_move', (data) => {
  const {username, from, to, dice1, dice2} = data;
  setDice(document.getElementById('dice1'), dice1);
  setDice(document.getElementById('dice2'), dice2);
  document.getElementById('dice1').classList.remove('rolling');
  document.getElementById('dice2').classList.remove('rolling');
  document.getElementById('rollBtn').disabled = false;
  setTimeout(() => moveToken(username, from, to), 700);
  document.getElementById('lastAction').textContent = `🎲 ${username}\n${dice1} + ${dice2} = ${dice1+dice2}\n↪ Case ${to}`;
  isRolling = false;
});

socket.on('monopoly_error', (d) => {
  alert('❌ ' + (d.msg || 'Erreur'));
  isRolling = false;
  document.getElementById('rollBtn').disabled = false;
});
</script>

</body>
</html>
