<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #1a1512 0%, #050505 60%, #000 100%); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .screen.active { display: flex; }
  h1 { font-size: 50px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 26px; letter-spacing: 6px; text-align: center; }
  .card-box { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 18px; margin-bottom: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 14px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 15px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .avatar-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 14px 0; }
  .avatar-btn { aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 3px solid #3a2f1a; transition: all .25s; }
  .avatar-btn.selected { border-color: #d4af37; box-shadow: 0 0 18px #d4af37; transform: scale(1.08); }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #2d7a56, #1f5a42); color: #fff; }
  .btn.grey { background: #444; color: #f5e6d3; }
  .error { color: #ff6b6b; text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 44px; color: #d4af37; font-weight: bold; margin: 26px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 18px 0; max-height: 220px; overflow-y: auto; min-height: 60px; }
  .player-item { padding: 9px 4px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; display: flex; justify-content: space-between; }
  .player-item:last-child { border-bottom: none; }

  #gameScreen { padding: 14px; max-width: 960px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: #d4af37; }
  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .players-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .player-chip { display: flex; align-items: center; gap: 6px; background: rgba(10,10,10,.8); border: 2px solid #444; border-radius: 20px; padding: 6px 12px; font-size: 12px; }
  .player-chip.turn { border-color: #d4af37; box-shadow: 0 0 12px rgba(212,175,55,.7); }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .swatch.white { background: radial-gradient(circle at 35% 30%, #fff, #ccc); border: 1px solid #888; }
  .swatch.black { background: radial-gradient(circle at 35% 30%, #555, #111); border: 1px solid #000; }

  .board-wrap { padding: 6px 0 26px; position: relative; }
  .board-wrap::before { content: ''; position: absolute; left: 8%; right: 8%; bottom: 6px; height: 26px; background: radial-gradient(ellipse, rgba(0,0,0,.65), transparent 75%); z-index: -1; }
  .board-wrap::after { content: ''; position: absolute; top: -50px; left: 50%; width: 560px; max-width: 90vw; height: 260px; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(255,225,160,.14), transparent 72%); pointer-events: none; z-index: -1; }
  .board { display: flex; flex-direction: column; gap: 8px; background: linear-gradient(160deg, #4a2f15, #2e1c0b 60%, #3a2410); border: 8px solid #1a1006; border-radius: 10px; padding: 12px; box-shadow: 0 4px 0 #241606, 0 22px 45px rgba(0,0,0,.8), inset 0 2px 4px rgba(255,220,150,.15), inset 0 0 0 3px rgba(212,175,55,.55); }
  .board-row { display: flex; gap: 3px; height: 160px; background: linear-gradient(180deg, #6b4a1e, #4a3013); border-radius: 3px; }
  .point { flex: 1; position: relative; display: flex; align-items: center; }
  .point.top { flex-direction: column; justify-content: flex-start; }
  .point.bottom { flex-direction: column-reverse; justify-content: flex-start; }
  .triangle { position: absolute; inset: 0; z-index: 0; }
  .point.top .triangle { clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .point.bottom .triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .point.light .triangle { background: linear-gradient(180deg, #e0c48a, #c9a869 55%, #ab8a52); }
  .point.dark .triangle { background: linear-gradient(180deg, #90593a, #7a4a25 55%, #5e3618); }
  .point.highlight { cursor: pointer; }
  .point.highlight .triangle { box-shadow: inset 0 0 0 3px #3a9d6d; }
  .bar-gap { width: 24px; background: linear-gradient(180deg, #3a2410, #150d05); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; cursor: default; position: relative; }
  .bar-gap::before { content: ''; position: absolute; top: 4px; bottom: 4px; left: 50%; width: 2px; background: linear-gradient(180deg, rgba(212,175,55,.75), rgba(212,175,55,.1)); transform: translateX(-50%); }
  .bar-gap.highlight { box-shadow: inset 0 0 0 3px #3a9d6d; cursor: pointer; }
  .bar-half { display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 1; }
  .checker { width: 28px; height: 28px; border-radius: 50%; z-index: 1; margin-top: -14px; position: relative; box-shadow: 0 5px 10px rgba(0,0,0,.75), inset 0 -4px 6px rgba(0,0,0,.4), inset 0 4px 5px rgba(255,255,255,.5), 0 0 0 2px #8a6c2a, 0 0 0 3px rgba(0,0,0,.5); }
  .checker:first-child { margin-top: 0; }
  .checker.white { background: radial-gradient(circle at 35% 26%, #fffef6, #e8dcb8 55%, #b89b5e 100%); }
  .checker.black { background: radial-gradient(circle at 35% 26%, #5a5a5a, #262626 55%, #000 100%); }
  .checker .count-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .off-trays { display: flex; justify-content: space-between; margin-top: 8px; width: 100%; max-width: 700px; }
  .off-tray { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #ffe08a; }
  .off-checkers { display: flex; flex-wrap: wrap; gap: 3px; max-width: 100px; min-height: 20px; border: 1px solid rgba(212,175,55,.4); border-radius: 8px; padding: 5px; background: rgba(0,0,0,.3); }
  .off-checkers .checker { margin-top: 0; width: 16px; height: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.7), 0 0 0 1px #8a6c2a; }

  .side-panel { max-width: 960px; margin: 10px auto 0; background: rgba(26,26,26,0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 14px 18px; }
  .turn-indicator { text-align: center; color: #d4af37; font-weight: bold; margin-bottom: 8px; min-height: 20px; }
  .dice-row { display: flex; gap: 18px; justify-content: center; align-items: center; margin-bottom: 10px; min-height: 64px; perspective: 500px; }
  .dice-container { width: 52px; height: 52px; position: relative; transform-style: preserve-3d; cursor: pointer; transition: filter .25s, transform .25s; }
  .dice-container.armed { filter: drop-shadow(0 0 10px rgba(58,157,109,.95)); transform: translateY(-5px); }
  .dice-container.placeholder { cursor: default; opacity: .5; }
  .dice-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease-out; }
  .dice-3d.rolling { animation: tavlaSpin 0.65s cubic-bezier(0.25,0.46,0.45,0.94); }
  @keyframes tavlaSpin {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
  }
  .die-face { position: absolute; width: 100%; height: 100%; background: linear-gradient(160deg,#fffdf5,#f0e6c8 60%,#ddc999); border: 2px solid #8a6c2a; border-radius: 9px; display: flex; align-items: center; justify-content: center; box-shadow: inset -3px -3px 7px rgba(0,0,0,.25), inset 3px 3px 8px rgba(255,255,255,.9); }
  .pip-dot { position: absolute; width: 7px; height: 7px; background: radial-gradient(circle at 35% 35%, #333, #000); border-radius: 50%; box-shadow: inset 0 1px 2px rgba(0,0,0,.9); }
  .face-1 { transform: translateZ(26px); }
  .face-2 { transform: rotateY(180deg) translateZ(26px); }
  .face-3 { transform: rotateY(90deg) translateZ(26px); }
  .face-4 { transform: rotateY(-90deg) translateZ(26px); }
  .face-5 { transform: rotateX(90deg) translateZ(26px); }
  .face-6 { transform: rotateX(-90deg) translateZ(26px); }
  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .action-bar .btn { width: auto; padding: 10px 20px; margin-top: 0; }
  .action-log { color: #d4af37; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; opacity: .9; }
  .winner-box { text-align: center; }
  @media (max-width: 700px) { .board-row { height: 110px; } .checker { width: 20px; height: 20px; margin-top: -9px; } }

    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">

    <div style="text-align:center;color:#d4af37;margin-bottom:8px;font-weight:bold;" data-i18n="label_room_code">CODE DE LA TABLE</div>

  </div>
</div>

<div id="gameScreen" class="screen">

    <button id="leaveTableBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
  <div class="players-row" id="playersRow"></div>
  <div class="board-wrap">
    <div class="board">
      <div class="board-row" id="topRow"></div>
      <div class="board-row" id="bottomRow"></div>
    </div>
  </div>
  <div class="off-trays">
    <div class="off-tray"><span data-i18n="off_white">Sorties blanches</span><div class="off-checkers" id="offWhite"></div></div>
    <div class="off-tray"><span data-i18n="off_black">Sorties noires</span><div class="off-checkers" id="offBlack"></div></div>
  </div>
  <div class="side-panel">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="dice-row" id="diceRow"></div>
    <div class="action-bar" id="actionBar">
      <button class="btn green" id="rollBtn" style="width:auto;" data-i18n="btn_roll">🎲 Lancer</button>
    </div>
    <div class="action-bar" id="roundOverBar" style="display:none;">
      <div class="winner-box">

        <button class="btn green" id="nextGameBtn" data-i18n="btn_next_game">▶️ Nouvelle partie</button>
      </div>
    </div>
    <div class="action-log" id="actionLog"></div>
  </div>
</div>

const LANGS = ['fr','en','es','de','it','nl','ru','ar','pt','pl','tr','ja','zh','ko'];
let lang = LANGS.includes(getSiteLang()) ? getSiteLang() : 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}
buildLangSelector(document.getElementById('langSwitch'), (code) => { lang = code; applyStaticI18n(); if (lastState) render(lastState); }, LANGS);
applyStaticI18n();

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('tavla_create_room', {username: user, token: avatar});
});
document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('tavla_join_room', {username: user, token: avatar, code: room});
});
document.getElementById('startBtn').addEventListener('click', () => socket.emit('tavla_start_game', {code: room}));
document.getElementById('addBotBtn').addEventListener('click', () => socket.emit('tavla_add_bot', {code: room}));
document.getElementById('leaveLobbyBtn').addEventListener('click', leaveTable);
document.getElementById('leaveTableBtn').addEventListener('click', leaveTable);
function leaveTable() {
  socket.emit('tavla_leave_room', {code: room, username: user});
  room = ''; lastState = null; armedDie = null;
  show('loginScreen');
}
document.getElementById('nextGameBtn').addEventListener('click', () => socket.emit('tavla_next_game', {code: room}));
document.getElementById('rollBtn').addEventListener('click', () => {
  const btn = document.getElementById('rollBtn');
  if (btn.disabled) return;
  btn.disabled = true;
  document.querySelectorAll('#diceRow .dice-3d').forEach(el => el.classList.add('rolling'));
  setTimeout(() => socket.emit('tavla_roll_dice', {code: room, username: user}), 550);
});

function renderCheckerStack(idx, count, color) {
  const abs = Math.min(Math.abs(count), 5);
  let html = '';
  for (let i = 0; i < abs; i++) {
    const isLast = i === abs - 1 && Math.abs(count) > 5;
    html += `<div class="checker ${color}">${isLast ? `<span class="count-badge">${Math.abs(count)}</span>` : ''}</div>`;
  }
  return html;
}

function diceForSource(src, legalMoves) {
  return Object.keys(legalMoves || {}).filter(d => (legalMoves[d] || []).includes(src));
}

function pointClickable(idx, myTurn, legalMoves) {
  if (!myTurn) return false;
  if (armedDie !== null) return (legalMoves[armedDie] || []).includes(idx);
  return diceForSource(idx, legalMoves).length > 0;
}

function pickDieFor(src, legalMoves) {
  if (armedDie !== null && (legalMoves[armedDie] || []).includes(src)) return armedDie;
  const opts = diceForSource(src, legalMoves);
  return opts.length ? parseInt(opts[0], 10) : null;
}

function renderPoint(idx, rowClass, myTurn, legalMoves) {
  const val = lastState.points[idx];
  const color = val > 0 ? 'white' : (val < 0 ? 'black' : null);
  const lightDark = idx % 2 === 0 ? 'light' : 'dark';
  const clickable = pointClickable(idx, myTurn, legalMoves);
  const checkersHtml = color ? renderCheckerStack(idx, val, color) : '';
  return `<div class="point ${rowClass} ${lightDark}${clickable ? ' highlight' : ''}" data-point-idx="${idx}">
    <div class="triangle"></div>${checkersHtml}
  </div>`;
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — Oyun #${state.gameNo || 0}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('err_need_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p =>
      `<div class="player-item"><span>${p.token || '⚪'} ${p.name}</span></div>`
    ).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 2) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  const myTurn = state.turn === user && state.stage === 'playing';
  const legalMoves = state.legalMoves || {};

  document.getElementById('playersRow').innerHTML = state.players.map(p => {
    const cls = 'player-chip' + (state.turn === p.name ? ' turn' : '');
    return `<div class="${cls}"><span class="swatch ${p.color || 'white'}"></span>${p.name === user ? t('you_label') : p.name} (${p.color || '?'})</div>`;
  }).join('');

  document.getElementById('topRow').innerHTML = TOP_ORDER.map((idx, i) => {
    const html = renderPoint(idx, 'top', myTurn, legalMoves);
    return i === 6 ? barGapHtml('top') + html : html;
  }).join('');
  document.getElementById('bottomRow').innerHTML = BOTTOM_ORDER.map((idx, i) => {
    const html = renderPoint(idx, 'bottom', myTurn, legalMoves);
    return i === 6 ? barGapHtml('bottom') + html : html;
  }).join('');

  document.querySelectorAll('.point[data-point-idx]').forEach(el => {
    el.addEventListener('click', () => {
      if (!el.classList.contains('highlight')) return;
      const idx = parseInt(el.dataset.pointIdx, 10);
      const die = pickDieFor(idx, legalMoves);
      if (die === null) return;
      socket.emit('tavla_move', {code: room, username: user, from: idx, die});
      armedDie = null;
    });
  });

  const me = state.players.find(p => p.name === user);
  const myColor = me ? me.color : null;
  const barClickable = myTurn && (armedDie !== null ? (legalMoves[armedDie] || []).includes('bar') : diceForSource('bar', legalMoves).length > 0);
  document.querySelectorAll('.bar-gap').forEach(el => {
    el.classList.toggle('highlight', barClickable);
  });
  document.querySelectorAll('.bar-gap').forEach(el => {
    el.onclick = () => {
      if (!barClickable) return;
      const die = pickDieFor('bar', legalMoves);
      if (die === null) return;
      socket.emit('tavla_move', {code: room, username: user, from: 'bar', die});
      armedDie = null;
    };
  });

  document.getElementById('offWhite').innerHTML = Array.from({length: state.off.white}).map(() => '<div class="checker white"></div>').join('');
  document.getElementById('offBlack').innerHTML = Array.from({length: state.off.black}).map(() => '<div class="checker black"></div>').join('');

  document.getElementById('turnIndicator').textContent = state.stage === 'finished' ? '' :
    (myTurn ? (state.dice.length ? t('move_hint') : t('turn_mine')) : (state.turn ? t('turn_other', {name: state.turn}) : ''));
  document.getElementById('actionLog').textContent = state.log || '';

  const diceArr = state.dice || [];
  const freshRoll = diceArr.length > 0 && prevDiceLen === 0;
  prevDiceLen = diceArr.length;
  const showPlaceholder = myTurn && diceArr.length === 0 && state.stage === 'playing';
  if (diceArr.length > 0) {
    document.getElementById('diceRow').innerHTML = diceArr.map((d, i) =>
      `<div class="dice-container${armedDie === d ? ' armed' : ''}" data-die="${d}" data-die-idx="${i}">
        <div class="dice-3d" id="tavlaDie${i}">${DIE_FACES}</div>
      </div>`
    ).join('');
    document.querySelectorAll('#diceRow .dice-3d').forEach((el, i) => setDice(el, diceArr[i]));
    document.querySelectorAll('.dice-container').forEach(el => {
      el.addEventListener('click', () => {
        const d = parseInt(el.dataset.die, 10);
        armedDie = (armedDie === d) ? null : d;
        render(lastState);
      });
    });
  } else if (showPlaceholder) {
    document.getElementById('diceRow').innerHTML = [0, 1].map(i =>
      `<div class="dice-container placeholder"><div class="dice-3d" id="tavlaDie${i}">${DIE_FACES}</div></div>`
    ).join('');
    document.querySelectorAll('#diceRow .dice-3d').forEach(el => setDice(el, 1));
  } else {
    document.getElementById('diceRow').innerHTML = '';
  }
  if (freshRoll) {
    document.getElementById('rollBtn').disabled = false;
  }

  document.getElementById('rollBtn').style.display = (myTurn && diceArr.length === 0 && state.stage === 'playing') ? 'inline-block' : 'none';
  if (showPlaceholder) document.getElementById('rollBtn').disabled = false;

  const over = state.stage === 'finished';
  document.getElementById('roundOverBar').style.display = over ? 'flex' : 'none';
  document.getElementById('actionBar').style.display = over ? 'none' : 'flex';
  if (over) {
    document.getElementById('winnerMsg').textContent = state.winner ? t('win_msg', {name: state.winner}) : '';
  }
}

function barGapHtml(rowClass) {
  return `<div class="bar-gap" data-bar-row="${rowClass}">
    <div class="bar-half">${lastState ? Array.from({length: Math.min(lastState.bar.white,5)}).map(()=>'<div class="checker white" style="margin-top:0;"></div>').join('') : ''}</div>
    <div class="bar-half">${lastState ? Array.from({length: Math.min(lastState.bar.black,5)}).map(()=>'<div class="checker black" style="margin-top:0;"></div>').join('') : ''}</div>
  </div>`;
}

socket.on('tavla_state', render);
socket.on('tavla_error', (d) => {
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  alert(t('alert_prefix') + msg);
});
</script>

</body>
</html>
