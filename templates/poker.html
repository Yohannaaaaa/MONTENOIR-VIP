<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker VIP</title>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

<script src="/static/js/site_sfx.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #1a1512 0%, #050505 60%, #000 100%); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .screen.active { display: flex; }
  h1 { font-size: 54px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 30px; letter-spacing: 6px; text-align: center; }
  .card-box { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 18px; margin-bottom: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 14px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 15px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .avatar-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin: 14px 0; }
  .avatar-btn { aspect-ratio: 1; font-size: 22px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all .25s; }
  .avatar-btn:hover { background: rgba(60,60,60,0.9); transform: scale(1.05); }
  .avatar-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .row2 { display: flex; gap: 12px; }
  .row2 > div { flex: 1; }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #2d7a56, #1f5a42); color: #fff; }
  .btn.red { background: linear-gradient(135deg, #a83232, #6e1f1f); color: #fff; }
  .btn.grey { background: #444; color: #f5e6d3; }
  .error { color: #ff6b6b; text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 44px; color: #d4af37; font-weight: bold; margin: 26px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 18px 0; max-height: 220px; overflow-y: auto; min-height: 60px; }
  .player-item { padding: 9px 4px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; display: flex; justify-content: space-between; }
  .player-item:last-child { border-bottom: none; }

  #gameScreen { padding: 14px; }
  .table-wrap { position: relative; width: min(980px, 96vw); height: min(560px, 78vh); margin: 0 auto; }
  .felt { position: absolute; inset: 0; border-radius: 50% / 42%; background: radial-gradient(ellipse at center, #1c7a45 0%, #0f5c33 55%, #08381f 100%); border: 14px solid #3a2410; box-shadow: 0 0 0 6px #1a1a1a, 0 20px 60px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,0,0,0.5); }
  .table-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 3; }
  .community { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; min-height: 78px; }
  .pot-label { color: #ffe08a; font-weight: bold; font-size: 15px; text-shadow: 0 0 10px rgba(0,0,0,0.8); }
  .stage-label { color: #d4af37; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; opacity: .85; }
  .pcard { width: 46px; height: 66px; border-radius: 6px; background: linear-gradient(160deg,#fff,#f0f0f0); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 17px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); border: 1px solid #ccc; }
  .pcard.back { background: repeating-linear-gradient(45deg,#7a1c1c,#7a1c1c 6px,#5a1414 6px,#5a1414 12px); border: 2px solid #d4af37; color: transparent; }
  .pcard.red { color: #c0272d; }
  .pcard.black { color: #111; }
  .pcard.small { width: 34px; height: 48px; font-size: 12px; border-radius: 5px; }

  .seat { position: absolute; width: 148px; transform: translate(-50%,-50%); text-align: center; z-index: 4; }
  .seat-box { background: rgba(10,10,10,0.88); border: 2px solid #6a5a2a; border-radius: 14px; padding: 8px 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .seat.turn .seat-box { border-color: #d4af37; box-shadow: 0 0 22px rgba(212,175,55,0.9); }
  .seat.folded .seat-box { opacity: .4; }
  .seat.me .seat-box { border-color: #3a9d6d; }
  .seat-avatar { font-size: 22px; }
  .seat-name { font-size: 12px; font-weight: bold; color: #f5e6d3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat-stack { font-size: 12px; color: #d4af37; }
  .seat-cards { display: flex; gap: 4px; justify-content: center; margin: 4px 0; }
  .seat-bet { font-size: 11px; color: #ffe08a; background: rgba(0,0,0,.5); border-radius: 8px; padding: 1px 8px; display: inline-block; margin-top: 3px; }
  .dealer-btn { position: absolute; top: -6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: #f5e6d3; color: #000; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(0,0,0,.6); }

  .side-panel { max-width: 980px; margin: 14px auto 0; background: rgba(26,26,26,0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 14px 18px; }
  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .action-bar .btn { width: auto; padding: 12px 20px; margin-top: 0; }
  .raise-input { width: 110px; padding: 10px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-size: 14px; text-align: center; }
  .turn-indicator { text-align: center; color: #d4af37; font-weight: bold; margin-bottom: 10px; min-height: 20px; }
  .action-log { color: #d4af37; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; opacity: .9; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 980px; margin: 0 auto 8px; font-size: 12px; color: #d4af37; }
  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }

  @media (max-width: 600px) {
    html, body { overflow-x: hidden; }
    h1 { font-size: 32px; letter-spacing: 3px; margin-bottom: 16px; }
    .card-box { padding: 20px 16px; }
    .room-code { font-size: 30px; }
    .table-wrap { height: min(420px, 60vh); }
    .seat { width: 84px; }
    .seat-box { padding: 4px 3px; }
    .seat-avatar { font-size: 14px; }
    .seat-name, .seat-stack { font-size: 9px; }
    .pcard { width: 32px; height: 46px; font-size: 12px; }
    .pcard.small { width: 24px; height: 34px; font-size: 9px; }
    .action-bar { gap: 6px; }
    .action-bar .btn { padding: 10px 12px; font-size: 12px; }
    .raise-input { width: 84px; }
    .side-panel { padding: 10px 12px; }
  }
  @media (max-width: 380px) {
    .seat { width: 64px; }
    .seat-avatar { font-size: 12px; }
    .seat-name, .seat-stack { font-size: 8px; }
  }

<body>

<div id="loginScreen" class="screen active">
  <div class="lang-switch" id="langSwitch"></div>
  <h1>♠️ POKER ♥️</h1>
  <div class="card-box">
    <label class="label" data-i18n="label_username">🎮 Ton Pseudo</label>
    <input type="text" id="username" class="input" data-i18n-placeholder="placeholder_username" placeholder="Entre ton nom">
    <label class="label" data-i18n="label_avatar">🃏 Choisis ton avatar</label>
    <div class="avatar-grid">
      <button class="avatar-btn selected" data-avatar="🎩">🎩</button>
      <button class="avatar-btn" data-avatar="🕶️">🕶️</button>
      <button class="avatar-btn" data-avatar="👑">👑</button>
      <button class="avatar-btn" data-avatar="🃏">🃏</button>
      <button class="avatar-btn" data-avatar="💰">💰</button>
      <button class="avatar-btn" data-avatar="🎲">🎲</button>
    </div>
    <div class="row2">
      <div>
        <label class="label" data-i18n="label_buyin">💵 Buy-in</label>
        <input type="number" id="buyIn" class="input" value="500" min="50" step="50">
      </div>
      <div>
        <label class="label" data-i18n="label_smallblind">🔹 Small Blind</label>
        <input type="number" id="smallBlind" class="input" value="10" min="1" step="5">
      </div>
    </div>
    <button class="btn" id="createBtn" data-i18n="btn_create">➕ Créer une table</button>
    <label class="label" data-i18n="label_or_join">OU REJOIGNEZ</label>
    <input type="text" id="roomCode" class="input" data-i18n-placeholder="placeholder_room_code" placeholder="Code de la table">
    <button class="btn" id="joinBtn" data-i18n="btn_join">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1 data-i18n="title_lobby">POKER</h1>
  <div class="card-box">
    <div style="text-align:center;color:#d4af37;margin-bottom:8px;font-weight:bold;" data-i18n="label_room_code">CODE DE LA TABLE</div>
    <div class="room-code" id="roomCodeDisplay">PK-XXXX</div>
    <div style="text-align:center;font-size:13px;color:#f5e6d3;" id="lobbyInfo"></div>
    <label class="label" data-i18n="label_players">👥 Joueurs</label>
    <div class="players-list" id="lobbyPlayersList"></div>
    <button class="btn green" id="startBtn" data-i18n="btn_start">🚀 Démarrer la partie</button>
    <button class="btn grey" id="addBotBtn" data-i18n="btn_add_bot">🤖 Ajouter un bot IA</button>
    <button class="btn grey" id="leaveLobbyBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="top-bar">
    <span id="tableInfo"></span>
    <button id="leaveTableBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
  <div class="table-wrap">
    <div class="felt"></div>
    <div class="table-center">
      <div class="community" id="communityCards"></div>
      <div class="pot-label" id="potLabel"></div>
      <div class="stage-label" id="stageLabel"></div>
    </div>
    <div id="seatsLayer"></div>
  </div>
  <div class="side-panel">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="action-bar" id="actionBar" style="display:none;">
      <button class="btn red" id="foldBtn" data-i18n="btn_fold">✋ Se coucher</button>
      <button class="btn grey" id="checkCallBtn"></button>
      <input type="number" id="raiseAmount" class="raise-input">
      <button class="btn green" id="raiseBtn" data-i18n="btn_raise">⬆️ Relancer</button>
      <button class="btn" id="allinBtn" data-i18n="btn_allin">🔥 Tapis</button>
    </div>
    <div class="action-bar" id="nextHandBar" style="display:none;">
      <button class="btn green" id="nextHandBtn" data-i18n="btn_next_hand">▶️ Main suivante</button>
    </div>
    <div class="action-log" id="actionLog"></div>
  </div>
</div>

const POKER_LANGS = ['fr','en','es','de','it','nl','ru','ar','pt','pl','tr','ja','zh','ko'];
let lang = POKER_LANGS.includes(getSiteLang()) ? getSiteLang() : 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}

buildLangSelector(document.getElementById('langSwitch'), (code) => { lang = code; applyStaticI18n(); if (lastState) render(lastState); }, POKER_LANGS);
applyStaticI18n();

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  document.getElementById(s).classList.add('active');
}

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_generic');
  const buyIn = parseInt(document.getElementById('buyIn').value, 10) || 500;
  const smallBlind = parseInt(document.getElementById('smallBlind').value, 10) || 10;
  socket.emit('poker_create_room', {username: user, token: avatar, buyIn, smallBlind});
});

document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('poker_join_room', {username: user, token: avatar, code: room});
});

document.getElementById('startBtn').addEventListener('click', () => {
  socket.emit('poker_start_game', {code: room});
});

document.getElementById('addBotBtn').addEventListener('click', () => {
  socket.emit('poker_add_bot', {code: room});
});

document.getElementById('leaveLobbyBtn').addEventListener('click', leaveTable);
document.getElementById('leaveTableBtn').addEventListener('click', leaveTable);
function leaveTable() {
  socket.emit('poker_leave_room', {code: room, username: user});
  room = ''; lastState = null; myHole = [];
  show('loginScreen');
}

document.getElementById('nextHandBtn').addEventListener('click', () => {
  socket.emit('poker_next_hand', {code: room});
});

document.getElementById('foldBtn').addEventListener('click', () => { if (window.SFX) SFX.click(); socket.emit('poker_action', {code: room, username: user, action: 'fold'}); });
document.getElementById('checkCallBtn').addEventListener('click', () => {
  if (!lastState) return;
  if (window.SFX) SFX.chip();
  const me = lastState.players.find(p => p.name === user);
  const action = (me && me.bet === lastState.currentBet) ? 'check' : 'call';
  socket.emit('poker_action', {code: room, username: user, action});
});
document.getElementById('raiseBtn').addEventListener('click', () => {
  if (window.SFX) SFX.chip();
  const amount = parseInt(document.getElementById('raiseAmount').value, 10) || 0;
  socket.emit('poker_action', {code: room, username: user, action: 'raise', amount});
});
document.getElementById('allinBtn').addEventListener('click', () => { if (window.SFX) SFX.chip(); socket.emit('poker_action', {code: room, username: user, action: 'allin'}); });

function suitInfo(card) {
  const suit = card[card.length - 1];
  const map = {S:{sym:'♠',cls:'black'}, C:{sym:'♣',cls:'black'}, H:{sym:'♥',cls:'red'}, D:{sym:'♦',cls:'red'}};
  return map[suit] || {sym:'', cls:'black'};
}
function cardRankLabel(card) { return card[0] === 'T' ? '10' : card[0]; }

function renderCard(card, small) {
  if (card === '??') return `<div class="pcard back${small ? ' small' : ''}"></div>`;
  const {sym, cls} = suitInfo(card);
  return `<div class="pcard ${cls}${small ? ' small' : ''}">${cardRankLabel(card)}<span>${sym}</span></div>`;
}

function seatPositions(n) {
  const cx = 50, cy = 50, rx = 40, ry = 37, pts = [];
  for (let i = 0; i < n; i++) {
    const angle = Math.PI / 2 + (i * 2 * Math.PI / n);
    pts.push({x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle)});
  }
  return pts;
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — 🔹${state.smallBlind}/${state.bigBlind}  💵 buy-in ${state.buyIn}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('waiting_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p => `<div class="player-item"><span>${p.token || '🎩'} ${p.name}</span><span>💰 ${p.stack}</span></div>`).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 8) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  document.getElementById('communityCards').innerHTML = state.community.map(c => renderCard(c, false)).join('') || '&nbsp;';
  document.getElementById('potLabel').textContent = t('pot', {amount: state.pot});
  document.getElementById('stageLabel').textContent = t('stage_' + state.stage);

  const players = state.players.filter(p => true);
  const myIdx = players.findIndex(p => p.name === user);
  const ordered = myIdx >= 0 ? players.slice(myIdx).concat(players.slice(0, myIdx)) : players;
  const positions = seatPositions(ordered.length);
  const layer = document.getElementById('seatsLayer');
  layer.innerHTML = ordered.map((p, i) => {
    const pos = positions[i];
    const isTurn = state.turn === p.name;
    const cards = (p.name === user && myHole.length) ? myHole : p.hole;
    const cardsHtml = (cards || []).map(c => renderCard(c, true)).join('');
    const isDealer = state.dealer === p.name;
    const nameLabel = p.name === user ? t('you_label') : p.name;
    return `<div class="seat${isTurn ? ' turn' : ''}${p.folded ? ' folded' : ''}${p.name === user ? ' me' : ''}" style="left:${pos.x}%;top:${pos.y}%;">
      <div class="seat-box">
        ${isDealer ? '<div class="dealer-btn">D</div>' : ''}
        <div class="seat-avatar">${p.token || '🎩'}</div>
        <div class="seat-name">${nameLabel}</div>
        <div class="seat-stack">💰 ${p.stack}</div>
        <div class="seat-cards">${cardsHtml}</div>
        ${p.bet > 0 ? `<div class="seat-bet">${p.bet}</div>` : ''}
        ${p.allIn ? '<div class="seat-bet">ALL-IN</div>' : ''}
      </div>
    </div>`;
  }).join('');

  const me = players.find(p => p.name === user);
  const myTurn = state.turn === user;
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'showdown' && prevStage !== 'showdown') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;
  document.getElementById('turnIndicator').textContent = myTurn ? t('turn_mine') : (state.turn ? t('turn_other', {name: state.turn}) : '');
  document.getElementById('actionBar').style.display = myTurn ? 'flex' : 'none';
  document.getElementById('nextHandBar').style.display = (state.stage === 'showdown' || state.stage === 'waiting') ? 'flex' : 'none';
  document.getElementById('actionLog').textContent = state.log || '';

  if (myTurn && me) {
    const toCall = state.currentBet - me.bet;
    const checkCallBtn = document.getElementById('checkCallBtn');
    if (toCall <= 0) { checkCallBtn.textContent = t('btn_check'); }
    else { checkCallBtn.textContent = t('btn_call', {amount: Math.min(toCall, me.stack)}); }
    const raiseInput = document.getElementById('raiseAmount');
    const minRaise = state.currentBet + state.minRaise;
    raiseInput.min = minRaise;
    raiseInput.step = state.smallBlind;
    if (!raiseInput.value || parseInt(raiseInput.value, 10) < minRaise) raiseInput.value = minRaise;
    document.getElementById('raiseBtn').disabled = me.stack + me.bet <= state.currentBet;
  }
}

socket.on('poker_state', render);
socket.on('poker_your_hand', (d) => { myHole = d.hole || []; if (lastState) render(lastState); });
socket.on('poker_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  alert(t('alert_prefix') + msg);
});
</script>
