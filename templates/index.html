<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montenoir VIP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;
    background:#000;
    font-family:Georgia,serif;
  }
  .container{
    position:relative;
    width:100%;
    margin:0 auto;
  }
  .container img{
    width:100%;
    display:block;
    background:#1a1200;
  }
  .lang-selector{
    position:absolute;
    top:20px;
    left:20px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    z-index:20;
    max-width:200px;
  }
  .lang-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid #d4af37;
    background:#1a1a1a;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.3s;
  }
  .lang-btn.active{
    background:#d4af37;
    box-shadow:0 0 12px rgba(212,175,55,.9);
  }
  .lang-btn:hover{
    box-shadow:0 0 8px rgba(212,175,55,.8);
  }
  .top-nav{
    position:absolute;
    top:20px;
    right:20px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    z-index:10;
  }
  .top-nav a{
    text-decoration:none;
    color:#1a1200;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:20px;
    background:linear-gradient(145deg,#fff4b0,#d4af37 55%,#8a6a1f);
    border:1px solid #fff2ad;
    box-shadow:0 0 14px rgba(212,175,55,.6);
    white-space:nowrap;
  }
  .connected-pill{
    display:none;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:20px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(212,175,55,.75);
    box-shadow:0 0 14px rgba(0,255,90,.2),0 0 10px rgba(212,175,55,.35);
    color:#fff;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }
  .connected-pill.show{display:flex;}
  .connected-pill .dot{width:8px;height:8px;border-radius:50%;background:#00ff66;box-shadow:0 0 8px #00ff66;flex-shrink:0;}
  .connected-pill .name{color:#d4af37;}
  .connected-pill .logout-link{color:#f5e6d3;opacity:.75;text-decoration:underline;font-weight:400;cursor:pointer;font-size:12px;}
  .connected-pill .logout-link:hover{opacity:1;}
  .top-nav .nav-avatar{width:20px;height:20px;min-width:20px;max-width:20px;border-radius:50%;object-fit:cover;border:1px solid #1a1200;vertical-align:middle;display:none;}
  .top-nav .nav-avatar.show{display:inline-block;}
  .top-nav .connected-pill .pill-avatar{width:22px;height:22px;min-width:22px;max-width:22px;border-radius:50%;object-fit:cover;border:1px solid #d4af37;display:none;flex-shrink:0;}
  .top-nav .connected-pill .pill-avatar.show{display:inline-block;}
  .bottom-nav{
    position:absolute;
    bottom:40px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    z-index:10;
  }
  .bottom-nav a{
    text-decoration:none;
    color:#1a1200;
    font-weight:800;
    font-size:15px;
    letter-spacing:1px;
    padding:14px 30px;
    border-radius:22px;
    background:linear-gradient(145deg,#fff4b0,#d4af37 55%,#8a6a1f);
    border:2px solid #fff2ad;
    box-shadow:0 0 20px rgba(212,175,55,.7);
  }
  @media(max-width:600px){
    .container{display:flex;flex-direction:column;align-items:center;padding-bottom:26px;}
    .container img{position:static;width:100%;order:3;}
    .lang-selector{position:static;max-width:100%;justify-content:center;margin:12px 0 0;order:1;}
    .lang-btn{width:26px;height:26px;font-size:13px;}
    .top-nav{position:static;justify-content:center;margin:12px 0 0;width:100%;padding:0 14px;order:2;}
    .top-nav a{font-size:12px;padding:9px 14px;}
    .bottom-nav{position:static;margin:20px 0 0;order:4;}
    .bottom-nav a{font-size:13px;padding:12px 22px;}
  }
  #montenoirOnlineBox{position:fixed;right:25px;bottom:25px;width:148px;height:92px;z-index:9997;background:rgba(0,0,0,.86);border:1px solid rgba(212,175,55,.75);border-radius:8px;box-shadow:0 0 14px rgba(0,255,90,.22),0 0 18px rgba(212,175,55,.22);overflow:hidden;font-family:Consolas,"Courier New",monospace;color:#00ff66;font-size:10.5px;line-height:17px}
  #montenoirOnlineHeader{height:20px;display:flex;align-items:center;justify-content:center;color:#d4af37;font-size:10px;font-weight:bold;letter-spacing:1px;background:rgba(212,175,55,.08);border-bottom:1px solid rgba(212,175,55,.25);text-shadow:0 0 5px rgba(212,175,55,.8)}
  #montenoirOnlineViewport{height:70px;overflow:hidden;position:relative}
  #montenoirOnlineTrack{position:absolute;left:0;top:0;width:100%;animation:montenoirMatrixScroll 8s linear infinite}
  .montenoirOnlineUser{white-space:nowrap;padding:0 8px;color:#00ff66;text-shadow:0 0 6px #00ff66}
  @keyframes montenoirMatrixScroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
  #montenoirLoginToastWrap{position:fixed;right:12px;bottom:128px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .montenoirLoginToast{min-width:180px;max-width:260px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.88);border:1px solid #d4af37;color:#00ff66;font-family:Consolas,"Courier New",monospace;font-size:13px;box-shadow:0 0 18px rgba(0,255,90,.25),0 0 16px rgba(212,175,55,.25);text-shadow:0 0 5px #00ff66;animation:montenoirToastIn .22s ease-out}
  @keyframes montenoirToastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @media(max-width:600px){ #montenoirOnlineBox{width:118px;height:76px;font-size:9px;line-height:15px;right:14px;bottom:14px} #montenoirOnlineHeader{height:18px;font-size:9px} #montenoirOnlineViewport{height:56px} #montenoirLoginToastWrap{right:10px;bottom:98px} }
</style>
</head>
<body>

      <div class="connected-pill" id="connectedPill">

        <span class="logout-link" id="connectedLogout">Logout</span>
      </div>
      <a href="/profil" class="text-profile"><img class="nav-avatar" id="navProfileAvatar" alt="">🖼️ <span>Profile</span></a>
      <a href="/kasa" class="text-chips">🪙 <span>Buy Chips</span></a>
      <a href="/premium" class="text-premium">💎 <span>Premium</span></a>

    function applyPageTranslations(lang) {
      const t = translations[lang] || translations.en;
      document.querySelector('.text-register span').textContent = t.register;
      document.querySelector('.text-login span').textContent = t.login;
      document.querySelector('.text-profile span').textContent = t.profile;
      document.querySelector('.text-chips span').textContent = t.chips;
      document.querySelector('.text-premium span').textContent = t.premium;
      document.querySelector('.text-games span').textContent = t.games;
      document.querySelector('.text-tarot span').textContent = t.tarot;
      document.getElementById('connectedLogout').textContent = t.logout;
    }

    const selector = document.getElementById('langSelector');
    buildLangSelector(selector, applyPageTranslations, Object.keys(translations));
    applyPageTranslations(getSiteLang());

    // Show who's connected instead of Register/Login once a profile is saved locally,
    // so returning users can immediately see their account is signed in.
    function montenoirSavedUser() {
      return localStorage.getItem("montenoirUser") || localStorage.getItem("codenamesAccount") || localStorage.getItem("loggedUser") || "";
    }
    function setNavAvatar(url) {
      [document.getElementById('navProfileAvatar'), document.getElementById('pillAvatar')].forEach(img => {
        if (url) { img.src = url; img.classList.add('show'); }
        else { img.classList.remove('show'); img.removeAttribute('src'); }
      });
    }
    function refreshConnectedState() {
      const user = montenoirSavedUser();
      const pill = document.getElementById('connectedPill');
      document.getElementById('navRegisterLink').style.display = user ? 'none' : '';
      document.getElementById('navLoginLink').style.display = user ? 'none' : '';
      if (user) {
        document.getElementById('connectedName').textContent = user;
        pill.classList.add('show');
        fetch('/api/auth/profile?username=' + encodeURIComponent(user)).then(r => r.json()).then(d => {
          if (d.ok && d.profile) setNavAvatar(d.profile.avatarData || '');
        }).catch(() => {});
      } else {
        pill.classList.remove('show');
        setNavAvatar('');
      }
    }
    document.getElementById('connectedLogout').addEventListener('click', () => {
      ["montenoirUser", "montenoirProfile", "codenamesAccount", "loggedUser", "loggedIn", "codenamesProfile", "codenamesSessionToken", "montenoirGender", "gender"].forEach(k => localStorage.removeItem(k));
      refreshConnectedState();
    });
    refreshConnectedState();
  </script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
  (function(){
    var onlineSocket = null;
    try { onlineSocket = (typeof io !== "undefined") ? io() : null; } catch(e) { onlineSocket = null; }
    function savedUser(){ return localStorage.getItem("montenoirUser") || localStorage.getItem("codenamesAccount") || localStorage.getItem("loggedUser") || ""; }
    function savedGender(){ return localStorage.getItem("montenoirGender") || localStorage.getItem("gender") || ""; }
    function symbolFor(gender){
      gender = (gender || "").toLowerCase();
      if (["female","femme","kadin","kadın","woman","girl"].indexOf(gender) >= 0) return "♠️";
      if (["male","homme","erkek","man","boy"].indexOf(gender) >= 0) return "♣️";
      return "♣️";
    }
    function renderOnline(users){
      var track = document.getElementById("montenoirOnlineTrack");
      if (!track) return;
      users = users || [];
      if (!users.length) { track.innerHTML = '<div class="montenoirOnlineUser">— en attente —</div>'; return; }
      var html = users.map(function(u){
        var sym = u.symbol || symbolFor(u.gender);
        var name = (u.username || "").replace(/[<>&]/g, "");
        return '<div class="montenoirOnlineUser">' + sym + ' ' + name + '</div>';
      }).join("");
      track.innerHTML = html + html;
    }
    function showToast(user){
      if (!user || !user.username) return;
      var current = savedUser().toLowerCase();
      var uname = (user.username || "").toLowerCase();
      if (current && uname === current) return;
      window.__montenoirToastSeen = window.__montenoirToastSeen || {};
      var now = Date.now();
      if (window.__montenoirToastSeen[uname] && now - window.__montenoirToastSeen[uname] < 6000) return;
      window.__montenoirToastSeen[uname] = now;
      var wrap = document.getElementById("montenoirLoginToastWrap");
      if (!wrap) return;
      var toast = document.createElement("div");
      toast.className = "montenoirLoginToast";
      toast.textContent = (user.symbol || symbolFor(user.gender)) + " " + user.username + " en ligne";
      wrap.appendChild(toast);
      setTimeout(function(){ toast.remove(); }, 5000);
    }
    function announceOnline(){
      if (!onlineSocket) return;
      var u = savedUser();
      if (u) onlineSocket.emit("montenoir_user_online", {username: u, gender: savedGender()});
      else onlineSocket.emit("montenoir_get_online");
    }
    if (onlineSocket) {
      onlineSocket.on("connect", announceOnline);
      onlineSocket.on("montenoir_online_update", function(data){
        renderOnline((data && data.users) || []);
        if (data && data.joined) showToast(data.joined);
      });
    }
    announceOnline();
    setTimeout(announceOnline, 500);
    setInterval(announceOnline, 30000);
  })();
  </script>
