<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #1a1512 0%, #050505 60%, #000 100%); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .screen.active { display: flex; }
  h1 { font-size: 50px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 26px; letter-spacing: 6px; text-align: center; }
  .card-box { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }

  .input { width: 100%; padding: 14px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 15px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .avatar-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 14px 0; }
  .avatar-btn { aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 3px solid #3a2f1a; transition: all .25s; }
  .avatar-btn.selected { border-color: #d4af37; box-shadow: 0 0 18px #d4af37; transform: scale(1.08); }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #2d7a56, #1f5a42); color: #fff; }
  .btn.grey { background: #444; color: #f5e6d3; }
  .error { color: #ff6b6b; text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 44px; color: #d4af37; font-weight: bold; margin: 26px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 18px 0; max-height: 220px; overflow-y: auto; min-height: 60px; }
  .player-item { padding: 9px 4px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; display: flex; justify-content: space-between; }
  .player-item:last-child { border-bottom: none; }

  #gameScreen { padding: 14px; max-width: 1000px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: #d4af37; }
  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .players-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .player-chip { display: flex; align-items: center; gap: 6px; background: rgba(10,10,10,.8); border: 2px solid #444; border-radius: 20px; padding: 6px 12px; font-size: 12px; }
  .player-chip.turn { border-color: #d4af37; box-shadow: 0 0 12px rgba(212,175,55,.7); }

  .lane-wrap { width: 100%; margin-bottom: 12px; position: relative; }
  .lane-3d-scene { position: relative; width: 100%; max-width: 640px; height: 72vh; min-height: 460px; max-height: 720px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #04060c;
    box-shadow: 0 25px 55px rgba(0,0,0,.85), 0 0 0 1px rgba(255,236,180,.35), inset 0 0 0 3px rgba(212,175,55,.5), inset 0 0 0 5px rgba(0,0,0,.4); }
  #laneCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #laneCanvas:active { cursor: grabbing; }
  .pins-up-label { position: absolute; top: 8px; right: 16px; color: #ffe08a; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 2; }
  .swipe-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); color: #ffe08a; font-size: 12px; font-weight: bold; letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; opacity: .95; animation: swipeHintPulse 1.6s ease-in-out infinite; z-index: 2; }
  @keyframes swipeHintPulse { 0%,100%{transform:translateX(-50%) translateY(0); opacity:.7;} 50%{transform:translateX(-50%) translateY(-5px); opacity:1;} }
  @media (max-width: 500px) { .lane-3d-scene { height: 58vh; min-height: 380px; } }

  .scoreboard { width: 100%; max-width: 960px; margin: 0 auto 12px; overflow-x: auto; }
  .score-table { width: 100%; border-collapse: collapse; background: rgba(10,10,10,.85); border: 2px solid #d4af37; border-radius: 10px; overflow: hidden; font-size: 12px; }
  .score-table th, .score-table td { border: 1px solid rgba(212,175,55,.3); padding: 6px 4px; text-align: center; min-width: 34px; }
  .score-table th { color: #d4af37; background: rgba(212,175,55,.1); font-size: 11px; }
  .score-table td.name-cell { text-align: left; padding-left: 10px; font-weight: bold; color: #f5e6d3; white-space: nowrap; }
  .score-table tr.turn td.name-cell { color: #d4af37; }
  .frame-rolls { display: flex; justify-content: center; gap: 2px; font-weight: bold; color: #f5e6d3; min-height: 14px; }
  .frame-rolls span { min-width: 10px; }
  .frame-cum { font-size: 13px; font-weight: 900; color: #d4af37; margin-top: 2px; }
  .total-cell { font-size: 16px; font-weight: 900; color: #d4af37; }

  .side-panel { max-width: 960px; margin: 10px auto 0; background: rgba(26,26,26,0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 14px 18px; text-align: center; }

  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .action-bar .btn { width: auto; padding: 12px 30px; margin-top: 0; }

    .card-box { padding: 20px 16px; }

    <label class="label" data-i18n="label_or_join">OU REJOIGNEZ</label>

    <button class="btn" id="joinBtn" data-i18n="btn_join">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">

  </div>
</div>

<div id="gameScreen" class="screen">

      <div class="swipe-hint" id="swipeHint" style="display:none;" data-i18n="swipe_hint">👆 Glisse la boule vers le haut</div>
    </div>
  </div>

  <div class="side-panel">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="action-bar" id="roundOverBar" style="display:none;">

      </div>
    </div>
    <div class="action-log" id="actionLog"></div>
  </div>
</div>

}

// ==================== 3D lane scene (Three.js) ====================
const LANE_HALF_WIDTH = 1.05;               // gutter-to-gutter half width (world units)
const PIN_DECK_Z = 4.6;                     // headpin distance from the foul line
const PIN_SPACING = 0.42;                   // center-to-center pin spacing — tight triangle
const PIN_ROW_DEPTH = PIN_SPACING * Math.sqrt(3) / 2;
const PIN_HEIGHT = 0.68;                    // target rendered pin height
const LANE_LENGTH = PIN_DECK_Z + 3 * PIN_ROW_DEPTH + 0.6; // extend floor past the back pin row
const BALL_RADIUS = 0.32;

const laneCanvas = document.getElementById('laneCanvas');
const renderer = new THREE.WebGLRenderer({ canvas: laneCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2420);
scene.fog = new THREE.Fog(0x2a2420, 13, 24);

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);
camera.position.set(0, 3.3, -1.3);
camera.lookAt(0, 0.45, PIN_DECK_Z * 0.65);

function resizeLaneRenderer() {
  const rect = laneCanvas.parentElement.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeLaneRenderer).observe(laneCanvas.parentElement);

scene.add(new THREE.AmbientLight(0x70758a, 0.55));
const overheadLight = new THREE.SpotLight(0xfff4d6, 180, 30, Math.PI / 5, 0.5, 1.4);
overheadLight.position.set(0, 7, PIN_DECK_Z - 1);
overheadLight.target.position.set(0, 0, PIN_DECK_Z);
overheadLight.castShadow = true;
overheadLight.shadow.mapSize.set(1024, 1024);
overheadLight.shadow.camera.near = 1;
overheadLight.shadow.camera.far = 15;
overheadLight.shadow.bias = -0.0015;
overheadLight.shadow.normalBias = 0.03;
scene.add(overheadLight, overheadLight.target);
const rimBlue = new THREE.PointLight(0x4aa8ff, 55, 16);
rimBlue.position.set(0, 3, LANE_LENGTH + 1);
scene.add(rimBlue);
// A directional (parallel-ray) light from near the camera, shining down the lane.
// Distance-independent on purpose: the pins are ~9 units out and the ball ~1 unit
// away, and a point light bright enough to reach the pins would blow out the ball.
// This is also what actually lights the *front* of the pins (their only modeled
// surface — the source scan has no backside) since the overhead spotlight only
// hits their unmodeled tops/backs.
const frontFill = new THREE.DirectionalLight(0xfff4d6, 3.4);
frontFill.position.set(0, 3, -2);
frontFill.target.position.set(0, 0.5, PIN_DECK_Z);
scene.add(frontFill, frontFill.target);

// Dedicated close-range light aimed only at the pin deck, so the pins read as
// bright/white and clearly separated from the dark background regardless of
// how the other lane-wide lights are balanced. Kept close + short range so it
// doesn't spill back and blow out the ball near the camera.
const pinSpot = new THREE.PointLight(0xfffaf0, 30, 5, 1.1);
pinSpot.position.set(0, 1.6, PIN_DECK_Z - 0.4);
scene.add(pinSpot);

function makeLaneTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1024;
  const ctx = c.getContext('2d');
  const boardCount = 16;
  const boardW = c.width / boardCount;
  // Long boards running the length of the lane, each a slightly different oak
  // tone, with a subtle grain and a dark seam between boards.
  for (let i = 0; i < boardCount; i++) {
    const x = i * boardW;
    const tones = ['#41290f', '#33200a', '#4a2f14', '#2a1a08', '#3c2610'];
    ctx.fillStyle = tones[i % tones.length];
    ctx.fillRect(x, 0, boardW, c.height);
    // subtle vertical grain streaks within the board
    for (let g = 0; g < 22; g++) {
      const gx = x + Math.random() * boardW;
      ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(60,35,10,0.15)' : 'rgba(255,235,190,0.12)';
      ctx.lineWidth = 0.6 + Math.random() * 0.8;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      let cx2 = gx;
      for (let y = 0; y <= c.height; y += 40) {
        cx2 += (Math.random() - 0.5) * 6;
        ctx.lineTo(cx2, y);
      }
      ctx.stroke();
    }
    // seam between boards
    ctx.fillStyle = 'rgba(35,20,8,0.55)';
    ctx.fillRect(x, 0, Math.max(1, boardW * 0.05), c.height);
  }
  // faint horizontal lane-lacquer sheen bands
  ctx.fillStyle = 'rgba(255,250,235,0.06)';
  for (let y = 0; y < c.height; y += 6) ctx.fillRect(0, y, c.width, 2);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(LANE_HALF_WIDTH * 2, LANE_LENGTH),
  new THREE.MeshStandardMaterial({ map: makeLaneTexture(), color: 0x8a7a68, roughness: 0.38, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, LANE_LENGTH / 2);
floor.receiveShadow = true;
scene.add(floor);

const gutterMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.6 });
[-1, 1].forEach(side => {
  const g = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, LANE_LENGTH), gutterMat);
  g.position.set(side * (LANE_HALF_WIDTH + 0.25), -0.06, LANE_LENGTH / 2);
  g.receiveShadow = true;
  scene.add(g);
});

// ---- Fun bowling-alley room: retro carpet, back/side walls, ceiling, arcade glow lights ----
// Without these the lane just floated in a black void -- this closes it into a real room
// so nothing but colored walls/ceiling shows behind or around the lane.
const ROOM_W = LANE_HALF_WIDTH * 7;   // room half-width well beyond the gutters
const ROOM_H = 3.6;                   // wall/ceiling height
const ROOM_BACK_Z = LANE_LENGTH + 1.6;
const ROOM_FRONT_Z = -3.2;

// Classic bowling-alley carpet: dark charcoal with the small retro confetti pattern
// (diamonds/rings) real alley carpets are known for, in muted burgundy/teal/mustard --
// not neon, just enough color to not read as bare concrete.
function makeCarpetTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#241f1a'; ctx.fillRect(0, 0, c.width, c.height);
  const accents = ['#7a2f3d', '#2f6b63', '#8a6a2a'];
  for (let i = 0; i < 14; i++) {
    const x = Math.random() * c.width, y = Math.random() * c.height, r = 9 + Math.random() * 16;
    ctx.strokeStyle = accents[i % accents.length];
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (i % 2 === 0) { ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); }
    else { ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 8);
  return tex;
}
const carpet = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W * 2, ROOM_BACK_Z - ROOM_FRONT_Z),
  new THREE.MeshStandardMaterial({ map: makeCarpetTexture(), roughness: 0.95 })
);
carpet.rotation.x = -Math.PI / 2;
carpet.position.set(0, -0.08, (ROOM_BACK_Z + ROOM_FRONT_Z) / 2);
carpet.receiveShadow = true;
scene.add(carpet);

// Plain acoustic-tile ceiling, warm off-white like real alley lighting rigs.
const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W * 2, ROOM_BACK_Z - ROOM_FRONT_Z),
  new THREE.MeshStandardMaterial({ color: 0x8a8175, roughness: 0.95 })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(0, ROOM_H, (ROOM_BACK_Z + ROOM_FRONT_Z) / 2);
scene.add(ceiling);

// Real-alley wall: wood wainscoting on the lower half, a painted band above it with
// a thin trim line at the seam -- no glow, just a normal indoor wall.
function makeAlleyWallTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 512;
  const ctx = c.getContext('2d');
  const seam = c.height * 0.42;
  ctx.fillStyle = '#2f4a4a'; ctx.fillRect(0, 0, c.width, seam);
  const plankTones = ['#5a3c22', '#4e331d', '#63431f'];
  const plankH = 26;
  for (let y = seam; y < c.height; y += plankH) {
    ctx.fillStyle = plankTones[Math.floor(y / plankH) % plankTones.length];
    ctx.fillRect(0, y, c.width, plankH - 2);
  }
  ctx.fillStyle = '#c9a24a';
  ctx.fillRect(0, seam - 4, c.width, 4);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, Math.max(1, Math.round((ROOM_BACK_Z - ROOM_FRONT_Z) / 3)));
  return tex;
}
[-1, 1].forEach(side => {
  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_BACK_Z - ROOM_FRONT_Z, ROOM_H),
    new THREE.MeshStandardMaterial({ map: makeAlleyWallTexture(), roughness: 0.8 })
  );
  wall.rotation.y = -side * Math.PI / 2;
  wall.position.set(side * ROOM_W, ROOM_H / 2, (ROOM_BACK_Z + ROOM_FRONT_Z) / 2);
  scene.add(wall);
});
const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W * 2, ROOM_H),
  new THREE.MeshStandardMaterial({ color: 0x2f4a4a, roughness: 0.75 })
);
backWall.position.set(0, ROOM_H / 2, ROOM_BACK_Z);
scene.add(backWall);
const frontWall = new THREE.Mesh(
  new THREE.PlaneGeometry(ROOM_W * 2, ROOM_H),
  new THREE.MeshStandardMaterial({ color: 0x2f4a4a, roughness: 0.8 })
);
frontWall.rotation.y = Math.PI;
frontWall.position.set(0, ROOM_H / 2, ROOM_FRONT_Z);
scene.add(frontWall);

// Warm overhead fill lights down each side, like a real alley's ceiling fixtures --
// plain warm white, not colored, just enough to keep the room from going flat/dark.
for (let i = 0; i < 4; i++) {
  const z = 1 + i * (LANE_LENGTH / 3.2);
  [-1, 1].forEach((side) => {
    const glow = new THREE.PointLight(0xfff2d8, 3, 4.5);
    glow.position.set(side * (LANE_HALF_WIDTH + 1.3), 2.6, z);
    scene.add(glow);
  });
}

const gltfLoader = new GLTFLoader();

// ---- Ball ----
const ballGroup = new THREE.Object3D();
ballGroup.position.set(0, BALL_RADIUS, 0);
scene.add(ballGroup);
const ballGlow = new THREE.PointLight(0xd4af37, 0, 2.5);
ballGroup.add(ballGlow);
function setBallHighlight(active) { ballGlow.intensity = active ? 6 : 0; }

gltfLoader.load('/static/models/ball_columbia300.glb', (gltf) => {
  const ballModel = gltf.scene;
  const material = new THREE.MeshPhysicalMaterial({
    color: 0x241a52, metalness: 0.4, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.12,
    sheen: 0.4, sheenColor: new THREE.Color(0xd4af37),
  });
  const box = new THREE.Box3();
  ballModel.traverse(o => { if (o.isMesh) { o.material = material; o.geometry.computeVertexNormals(); o.castShadow = true; } });
  box.setFromObject(ballModel);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  ballModel.position.sub(center);
  const scale = (BALL_RADIUS * 2) / Math.max(size.x, size.y, size.z);
  ballModel.scale.setScalar(scale);
  ballGroup.add(ballModel);
});

// ---- Pins ----
const PIN_LAYOUT = []; // index 0..9 => {x,z} for pin numbers 1..10
(function buildPinLayout() {
  const rows = [[0], [-0.5, 0.5], [-1, 0, 1], [-1.5, -0.5, 0.5, 1.5]];
  let num = 1;
  rows.forEach((xs, rowIdx) => {
    xs.forEach(xOff => {
      PIN_LAYOUT[num - 1] = { x: xOff * PIN_SPACING, z: PIN_DECK_Z + rowIdx * PIN_ROW_DEPTH };
      num++;
    });
  });
})();

const pinObjects = [];
let pinDownState = Array(10).fill(false);

// Procedural pin: the scanned "pins in formation" model was reconstructed from a
// single photo, so its backside is missing (holes/torn edges) — fine as a small
// distant prop, but glaring once pins are this big and close. A clean lathe
// profile gives a crisp, watertight silhouette at any distance.
function createPinMesh() {
  const profile = [
    [0.000, 0.000], [0.135, 0.000], [0.135, 0.030], [0.110, 0.100], [0.100, 0.200],
    [0.120, 0.320], [0.158, 0.440], [0.150, 0.540], [0.110, 0.640], [0.075, 0.710],
    [0.050, 0.775], [0.060, 0.840], [0.085, 0.900], [0.095, 0.940], [0.070, 0.980],
    [0.000, 1.015],
  ].map(([r, y]) => new THREE.Vector2(r, y));
  const geometry = new THREE.LatheGeometry(profile, 24);

  const positions = geometry.attributes.position;
  const colors = new Float32Array(positions.count * 3);
  const IVORY = [0.93, 0.90, 0.82], RED = [0.68, 0.10, 0.10];
  for (let i = 0; i < positions.count; i++) {
    const yFrac = positions.getY(i); // profile Y already spans ~0..1
    const inNeckBand = yFrac > 0.73 && yFrac < 0.87;
    const col = inNeckBand ? RED : IVORY;
    colors[i * 3] = col[0]; colors[i * 3 + 1] = col[1]; colors[i * 3 + 2] = col[2];
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.32, metalness: 0.05 });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.scale.setScalar(PIN_HEIGHT); // profile is unit-height (y in [0,1.015])
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

for (let i = 0; i < 10; i++) {
  const wrapper = new THREE.Object3D();
  wrapper.position.set(PIN_LAYOUT[i].x, 0, PIN_LAYOUT[i].z);
  wrapper.add(createPinMesh());
  scene.add(wrapper);
  pinObjects[i] = wrapper;
}

function setPinStanding(i, standing, animate, delay = 0) {
  const wrapper = pinObjects[i];
  if (!wrapper) return;
  const targetRotX = standing ? 0 : (i % 2 === 0 ? 1.35 : -1.35);
  const targetY = standing ? 0 : -0.05;
  if (!animate) {
    wrapper.rotation.x = targetRotX;
    wrapper.position.y = targetY;
    return;
  }
  tweenObject(wrapper, { 'rotation.x': targetRotX, 'position.y': targetY }, 480, delay);
}

function updatePinRack(pinsUp, forceFresh) {
  // forceFresh: the server just re-racked (new frame, or a fresh rack after a
  // strike/spare bonus ball) before this roll — snap every pin back up first,
  // instantly, then animate down only the pins *this* roll actually knocked.
  if (forceFresh) {
    for (let i = 0; i < 10; i++) { setPinStanding(i, true, false); pinDownState[i] = false; }
  }
  let staggerIdx = 0;
  for (let i = 0; i < 10; i++) {
    const num = i + 1;
    const isDown = num > pinsUp;
    if (isDown && !pinDownState[i]) {
      setPinStanding(i, false, true, staggerIdx * 70);
      staggerIdx++;
    } else if (!isDown && pinDownState[i]) {
      setPinStanding(i, true, false);
    }
    pinDownState[i] = isDown;
  }
}

// ---- lightweight tween helper (3D object properties have no CSS transitions) ----
const activeTweens = [];
function tweenObject(obj, targets, duration, delay = 0) {
  const start = {};
  for (const k in targets) start[k] = getPath(obj, k);
  activeTweens.push({ obj, start, targets, t0: performance.now() + delay, duration });
}
function getPath(obj, path) { const parts = path.split('.'); let v = obj; for (const p of parts) v = v[p]; return v; }
function setPath(obj, path, val) { const parts = path.split('.'); let v = obj; for (let i = 0; i < parts.length - 1; i++) v = v[parts[i]]; v[parts[parts.length - 1]] = val; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function stepTweens(now) {
  for (let i = activeTweens.length - 1; i >= 0; i--) {
    const tw = activeTweens[i];
    if (now < tw.t0) continue;
    const p = Math.min(1, (now - tw.t0) / tw.duration);
    const e = easeOutCubic(p);
    for (const k in tw.targets) setPath(tw.obj, k, tw.start[k] + (tw.targets[k] - tw.start[k]) * e);
    if (p >= 1) activeTweens.splice(i, 1);
  }
}

function animateLane(now) {
  requestAnimationFrame(animateLane);
  stepTweens(now || performance.now());
  renderer.render(scene, camera);
}
resizeLaneRenderer();
requestAnimationFrame(animateLane);
// ==================== end 3D lane scene ====================

document.querySelectorAll('.avatar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    avatar = btn.dataset.avatar;
  });
});

document.getElementById('createBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  if (!user) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('bowling_create_room', {username: user, token: avatar});
});
document.getElementById('joinBtn').addEventListener('click', () => {
  user = document.getElementById('username').value.trim();
  room = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!user || !room) return document.getElementById('errorMsg').textContent = t('err_generic');
  socket.emit('bowling_join_room', {username: user, token: avatar, code: room});
});
document.getElementById('startBtn').addEventListener('click', () => socket.emit('bowling_start_game', {code: room}));
document.getElementById('addBotBtn').addEventListener('click', () => socket.emit('bowling_add_bot', {code: room}));
document.getElementById('leaveLobbyBtn').addEventListener('click', leaveTable);
document.getElementById('leaveTableBtn').addEventListener('click', leaveTable);
function leaveTable() {
  socket.emit('bowling_leave_room', {code: room, username: user});
  room = ''; lastState = null;
  show('loginScreen');
}
document.getElementById('nextGameBtn').addEventListener('click', () => socket.emit('bowling_next_game', {code: room}));

function canThrow() {
  return canRollNow && !isRolling;
}

const BALL_TRAVEL_MS = 1650; // real bowling: the ball rolls the length of the lane before hitting pins

function throwBall() {
  if (!canThrow()) return;
  canRollNow = false;
  isRolling = true;
  if (window.SFX) SFX.bowl();

  const targetZ = PIN_DECK_Z - 0.4;
  const start = performance.now();
  function step(now) {
    const p = Math.min(1, (now - start) / BALL_TRAVEL_MS);
    const eased = 1 - Math.pow(1 - p, 2); // gentle acceleration down the lane
    ballGroup.position.z = eased * targetZ;
    ballGroup.position.y = BALL_RADIUS;
    ballGroup.scale.setScalar(1);
    ballGroup.rotation.x -= 0.35; // rolling spin
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      ballGroup.position.z = 0;
      ballGroup.rotation.x = 0;
      socket.emit('bowling_roll', {code: room, username: user});
    }
  }
  requestAnimationFrame(step);
}

// Swipe/drag the ball upward (toward the pins) to throw it — touch or mouse.
(function setupBallSwipe() {
  const THROW_THRESHOLD = 28; // px dragged upward to count as a throw
  const FLICK_VELOCITY = 0.45; // px/ms — a fast short flick also counts
  let dragging = false, startY = 0, curDY = 0;
  let lastY = 0, lastT = 0, velocity = 0;

  laneCanvas.addEventListener('pointerdown', (e) => {
    if (!canThrow()) return;
    const rect = laneCanvas.getBoundingClientRect();
    if ((e.clientY - rect.top) / rect.height < 0.55) return; // only start a throw from near the ball
    dragging = true; startY = e.clientY; curDY = 0;
    lastY = e.clientY; lastT = performance.now(); velocity = 0;
    laneCanvas.setPointerCapture(e.pointerId);
  });
  laneCanvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    curDY = Math.min(0, e.clientY - startY); // only allow dragging upward
    const now = performance.now();
    const dt = now - lastT;
    if (dt > 0) velocity = (lastY - e.clientY) / dt; // px/ms, positive = moving up
    lastY = e.clientY; lastT = now;
    const pull = Math.min(1, -curDY / 220);
    ballGroup.position.z = pull * 0.55;
    ballGroup.position.y = BALL_RADIUS * (1 - pull * 0.15);
    ballGroup.scale.setScalar(1 - pull * 0.12);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if (-curDY >= THROW_THRESHOLD || velocity >= FLICK_VELOCITY) {
      throwBall();
    } else {
      tweenObject(ballGroup, { 'position.z': 0, 'position.y': BALL_RADIUS, 'scale.x': 1, 'scale.y': 1, 'scale.z': 1 }, 250);
    }
  }
  laneCanvas.addEventListener('pointerup', endDrag);
  laneCanvas.addEventListener('pointercancel', endDrag);
})();

function frameCellHtml(frameRolls, frameIdx) {
  if (!frameRolls || !frameRolls.length) return '<div class="frame-rolls"></div>';
  const is10th = frameIdx === 9;
  let marks;
  if (!is10th) {
    if (frameRolls[0] === 10) {
      marks = ['X'];
    } else if (frameRolls.length === 2) {
      const r0 = frameRolls[0], r1 = frameRolls[1];
      marks = [r0 === 0 ? '-' : String(r0), (r0 + r1 === 10) ? '/' : (r1 === 0 ? '-' : String(r1))];
    } else {
      marks = [frameRolls[0] === 0 ? '-' : String(frameRolls[0])];
    }
  } else {
    marks = frameRolls.map(v => v === 10 ? 'X' : (v === 0 ? '-' : String(v)));
    if (frameRolls.length >= 2 && frameRolls[0] !== 10 && frameRolls[0] + frameRolls[1] === 10) marks[1] = '/';
    if (frameRolls.length === 3 && frameRolls[0] === 10 && frameRolls[1] !== 10 && frameRolls[1] + frameRolls[2] === 10) marks[2] = '/';
  }
  return `<div class="frame-rolls">${marks.map(m => `<span>${m}</span>`).join('')}</div>`;
}

function renderScoreTable(state) {
  const rows = state.players.map(p => {
    const cells = Array.from({length: 10}).map((_, i) => {
      const cum = p.cumScores[i];
      return `<td>${frameCellHtml(p.frames[i], i)}${cum !== null && cum !== undefined ? `<div class="frame-cum">${cum}</div>` : ''}</td>`;
    }).join('');
    const cls = state.turn === p.name ? 'turn' : '';
    return `<tr class="${cls}"><td class="name-cell">${p.token || '🎳'} ${p.name === user ? t('you_label') : p.name}</td>${cells}<td class="total-cell">${p.total}</td></tr>`;
  }).join('');
  const headers = Array.from({length: 10}).map((_, i) => `<th>${i + 1}</th>`).join('');
  document.getElementById('scoreTable').innerHTML = `<thead><tr><th></th>${headers}<th>∑</th></tr></thead><tbody>${rows}</tbody>`;
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — Oyun #${state.gameNo || 0}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('err_need_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p =>
      `<div class="player-item"><span>${p.token || '🎳'} ${p.name}</span></div>`
    ).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 4) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  const myTurn = state.turn === user && state.stage === 'playing';
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'finished' && prevStage !== 'finished') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;
  isRolling = false;

  document.getElementById('playersRow').innerHTML = state.players.map(p => {
    const cls = 'player-chip' + (state.turn === p.name ? ' turn' : '');
    return `<div class="${cls}">${p.token || '🎳'} ${p.name === user ? t('you_label') : p.name}</div>`;
  }).join('');

  renderScoreTable(state);

  const activePlayer = state.players.find(x => x.name === state.turn) || {pinsUp: 10};
  // The 3D rack should reflect what the last throw actually did on the lane —
  // not state.turn's pinsUp, which by broadcast time may already belong to the
  // *next* player's fresh, untouched rack (turn advances as soon as a frame
  // completes, i.e. on most rolls: strikes, spares, and every 2nd ball).
  const lastRoll = state.lastRoll;
  const pinsUp = lastRoll ? lastRoll.pinsUp : activePlayer.pinsUp;
  const forceFresh = lastRoll ? lastRoll.fresh : pinsUp === 10;
  document.getElementById('pinsUpLabel').textContent = state.stage === 'finished' ? '' : `${pinsUp} 🎯`;
  setBallHighlight(myTurn);
  document.getElementById('swipeHint').style.display = myTurn ? 'block' : 'none';
  updatePinRack(pinsUp, forceFresh);

  document.getElementById('turnIndicator').textContent = state.stage === 'finished' ? '' :
    (myTurn ? t('turn_mine') : (state.turn ? t('turn_other', {name: state.turn}) : ''));
  document.getElementById('actionLog').textContent = state.log || '';
  canRollNow = myTurn && state.stage !== 'finished';

  const over = state.stage === 'finished';
  document.getElementById('roundOverBar').style.display = over ? 'flex' : 'none';
  if (over) {
    const winner = state.players.find(p => p.name === state.winner);
    document.getElementById('winnerMsg').textContent = state.winner ? t('win_msg', {name: state.winner, score: winner ? winner.total : ''}) : '';
  }
}

socket.on('bowling_state', render);
socket.on('bowling_error', (d) => {
  if (window.SFX) SFX.error();
  isRolling = false;
  if (lastState) render(lastState);
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  if (d.code === 'not_enough_chips') { if (confirm(t('alert_prefix') + msg)) window.location.href = '/kasa'; return; }
  alert(t('alert_prefix') + msg);
});
</script>
