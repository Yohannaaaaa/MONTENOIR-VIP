<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎴 AI Tarot Okuyucu</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: #d4af37;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            padding: 12px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            background: rgba(10, 14, 39, 0.8);
            color: #e0e0e0;
            font-size: 1em;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        @media (max-width: 768px) {
            .buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        button {
            padding: 15px 10px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            color: #d4af37;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            line-height: 1.4;
        }

        button small {
            display: block;
            font-size: 0.85em;
            color: #ec4899;
            margin-top: 5px;
        }

        button:hover {
            background: linear-gradient(135deg, #d4af37, #a67c1e);
            color: #0a0e27;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .result-container {
            display: none;
            background: rgba(26, 26, 62, 0.8);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .result-container.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question {
            text-align: center;
            color: #d4af37;
            font-size: 1.2em;
            margin-bottom: 20px;
            font-style: italic;
        }

        .spread-type {
            text-align: center;
            color: #8b5cf6;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .cards-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(26, 26, 62, 0.9);
            border: 2px solid #8b5cf6;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid #8b5cf6;
            padding-bottom: 10px;
        }

        .card-image {
            width: 80px;
            height: 120px;
            border-radius: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            object-fit: cover;
        }

        .card-title {
            flex: 1;
        }

        .card-title h3 {
            margin: 0;
            color: #d4af37;
            font-size: 1.2em;
        }

        .card-position {
            color: #8b5cf6;
            font-size: 0.9em;
        }

        .card-number {
            color: #ec4899;
            font-size: 0.9em;
        }

        .card-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .card-content {
                grid-template-columns: 1fr;
            }
        }

        .section {
            margin: 10px 0;
        }

        .section-title {
            color: #8b5cf6;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .section-content {
            color: #b0b0b0;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .yes-no-result {
            text-align: center;
            padding: 40px;
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid #8b5cf6;
        }

        .interpretation {
            background: rgba(212, 175, 55, 0.05);
            border-left: 4px solid #d4af37;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            color: #d4af37;
        }

        .loading {
            text-align: center;
            color: #8b5cf6;
            font-size: 1.2em;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #d4af37;
            text-decoration: none;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link" id="backLink">← Ana Sayfa</a>

        <header>
            <h1 id="pageTitle">🎴 AI Tarot Okuyucu</h1>
            <p id="pageSubtitle">Kartlar sana ne söylemek istiyor?</p>
        </header>

        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Kullanıcı adı (jeton düşüşü için)" />
            <input type="text" id="questionInput" placeholder="Sorunuzu yazın... (opsiyonel)" />
        </div>

        <div class="controls">
            <div class="buttons">
                <button onclick="getReading('3-card')">🎴 3 Kart<br><small>200 💰</small></button>
                <button onclick="getReading('7-card')">🎴 7 Kart<br><small>200 💰</small></button>
                <button onclick="getReading('yes-no')">✨ Evet/Hayır<br><small>200 💰</small></button>
                <button onclick="getReading('love')">💕 Aşk<br><small>200 💰</small></button>
                <button onclick="getReading('work')">💼 İş<br><small>200 💰</small></button>
                <button onclick="getReading('general')">🌟 Genel<br><small>200 💰</small></button>
            </div>
        </div>

        <div id="resultContainer" class="result-container">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // UI Text translations for different languages
        const UI_TEXTS = {
            'tr': {
                'backLink': '← Ana Sayfa',
                'pageTitle': '🎴 AI Tarot Okuyucu',
                'pageSubtitle': 'Kartlar sana ne söylemek istiyor?',
                'usernamePlaceholder': 'Kullanıcı adı (jeton düşüşü için)',
                'questionPlaceholder': 'Sorunuzu yazın... (opsiyonel)',
                '3-card': { emoji: '🎴', text: '3 Kart' },
                '7-card': { emoji: '🎴', text: '7 Kart' },
                'yes-no': { emoji: '✨', text: 'Evet/Hayır' },
                'love': { emoji: '💕', text: 'Aşk' },
                'work': { emoji: '💼', text: 'İş' },
                'general': { emoji: '🌟', text: 'Genel' },
            },
            'fr': {
                'backLink': '← Accueil',
                'pageTitle': '🎴 Lecteur de Tarot IA',
                'pageSubtitle': 'Que veulent te dire les cartes ?',
                'usernamePlaceholder': 'Nom d\'utilisateur (pour la baisse de jeton)',
                'questionPlaceholder': 'Écrivez votre question... (optionnel)',
                '3-card': { emoji: '🎴', text: '3 Cartes' },
                '7-card': { emoji: '🎴', text: '7 Cartes' },
                'yes-no': { emoji: '✨', text: 'Oui/Non' },
                'love': { emoji: '💕', text: 'Amour' },
                'work': { emoji: '💼', text: 'Carrière' },
                'general': { emoji: '🌟', text: 'Général' },
            },
            'en': {
                'backLink': '← Home',
                'pageTitle': '🎴 AI Tarot Reader',
                'pageSubtitle': 'What do the cards want to tell you?',
                'usernamePlaceholder': 'Username (for token drops)',
                'questionPlaceholder': 'Write your question... (optional)',
                '3-card': { emoji: '🎴', text: '3 Cards' },
                '7-card': { emoji: '🎴', text: '7 Cards' },
                'yes-no': { emoji: '✨', text: 'Yes/No' },
                'love': { emoji: '💕', text: 'Love' },
                'work': { emoji: '💼', text: 'Career' },
                'general': { emoji: '🌟', text: 'General' },
            },
        };

        function updateUITexts() {
            const lang = getSiteLang();
            const texts = UI_TEXTS[lang] || UI_TEXTS['tr'];

            // Update header and navigation
            const backLink = document.getElementById('backLink');
            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');
            const usernameInput = document.getElementById('usernameInput');
            const questionInput = document.getElementById('questionInput');

            if (backLink) backLink.textContent = texts['backLink'];
            if (pageTitle) pageTitle.textContent = texts['pageTitle'];
            if (pageSubtitle) pageSubtitle.textContent = texts['pageSubtitle'];
            if (usernameInput) usernameInput.placeholder = texts['usernamePlaceholder'];
            if (questionInput) questionInput.placeholder = texts['questionPlaceholder'];

            // Update buttons
            const buttons = document.querySelectorAll('.buttons button');
            const buttonTypes = ['3-card', '7-card', 'yes-no', 'love', 'work', 'general'];

            buttons.forEach((button, index) => {
                if (index < buttonTypes.length) {
                    const type = buttonTypes[index];
                    const { emoji, text } = texts[type];
                    button.innerHTML = `${emoji} ${text}<br><small>200 💰</small>`;
                }
            });
        }

        // Update UI when page loads
        document.addEventListener('DOMContentLoaded', updateUITexts);

        // Update UI when language changes (if there's a language switcher)
        const originalSetSiteLang = window.setSiteLang;
        if (originalSetSiteLang) {
            window.setSiteLang = function(lang) {
                originalSetSiteLang(lang);
                updateUITexts();
            };
        }

        const TAROT_IMAGES = {
            '00_joker': '/static/tarot_cards/00_joker.webp',
            '01_sihirbaz': '/static/tarot_cards/01_sihirbaz.webp',
            '02_bakireyiz': '/static/tarot_cards/02_bakireyiz.webp',
            '03_imparatorice': '/static/tarot_cards/03_imparatorice.webp',
            '04_imparator': '/static/tarot_cards/04_imparator.webp',
            '05_basrahip': '/static/tarot_cards/05_basrahip.webp',
            '06_asiklar': '/static/tarot_cards/06_asiklar.webp',
            '07_savas_arabasi': '/static/tarot_cards/07_savas_arabasi.webp',
            '08_guc': '/static/tarot_cards/08_guc.webp',
            '09_munzevi': '/static/tarot_cards/09_munzevi.webp',
            '10_kader_carki': '/static/tarot_cards/10_kader_carki.webp',
            '11_adalet': '/static/tarot_cards/11_adalet.webp',
            '12_asili_adam': '/static/tarot_cards/12_asili_adam.webp',
            '13_olum': '/static/tarot_cards/13_olum.webp',
            '14_itidal': '/static/tarot_cards/14_itidal.webp',
            '15_iblis': '/static/tarot_cards/15_iblis.webp',
            '16_kule': '/static/tarot_cards/16_kule.webp',
            '17_yildiz': '/static/tarot_cards/17_yildiz.webp',
            '18_ay': '/static/tarot_cards/18_ay.webp',
            '19_gunes': '/static/tarot_cards/19_gunes.webp',
            '20_yargi': '/static/tarot_cards/20_yargi.webp',
            '21_dunya': '/static/tarot_cards/21_dunya.webp'
        };

        async function getReading(type) {
            const question = document.getElementById('questionInput').value;
            const username = document.getElementById('usernameInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');
            const lang = typeof getSiteLang === 'function' ? getSiteLang() : 'tr';

            resultContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Kartlar şuffle ediliyor...</p></div>';
            resultContainer.classList.add('show');

            try {
                const endpoint = `/api/tarot/reading/${type}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, username, lang })
                });

                if (response.status === 402) {
                    const data = await response.json();
                    resultContent.innerHTML = `<div class="error">💰 ${data.msg}</div>`;
                    return;
                }

                if (!response.ok) throw new Error('Okuma başarısız');
                const data = await response.json();

                if (type === 'yes-no') {
                    displayYesNoReading(data);
                } else if (type === '3-card') {
                    display3CardReading(data);
                } else if (type === '7-card') {
                    display7CardReading(data);
                } else if (type === 'love' || type === 'work' || type === 'general') {
                    displayMultiCardReading(data);
                }
            } catch (error) {
                resultContent.innerHTML = `<div class="error">❌ Hata: ${error.message}</div>`;
            }
        }

        function displayMultiCardReading(data) {
            const resultContent = document.getElementById('resultContent');
            let html = `
                <div class="question">"${data.question || 'Sorunuz'}"</div>
                <div class="spread-type">${data.name}</div>
            `;

            if (data.remaining_chips !== undefined) {
                html += `<div style="text-align: center; color: #d4af37; margin-bottom: 15px;">💰 Kalan Jeton: ${data.remaining_chips}</div>`;
            }

            html += '<div class="cards-grid">';

            data.spread.forEach((item, idx) => {
                const card = item.card;
                const imageSrc = TAROT_IMAGES[card.image?.replace('.webp', '')] || '/static/tarot_cards/00_joker.webp';
                html += `
                    <div class="card">
                        <div class="card-header">
                            <img src="${imageSrc}" alt="${card.name}" class="card-image">
                            <div class="card-title">
                                <div style="font-size: 0.8em; color: #8b5cf6;">📍 ${item.position}</div>
                                <h3>${card.name}</h3>
                                <div class="card-position">${card.position}</div>
                                <div class="card-number">#${card.number}</div>
                            </div>
                        </div>
                        <div class="card-content">
                            <div class="section">
                                <div class="section-title">📝 Anlam</div>
                                <div class="section-content">${card.intro}</div>
                            </div>
                            <div class="section">
                                <div class="section-title">💡 Bilgelik</div>
                                <div class="section-content">${card.hidden || card.weekly}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultContent.innerHTML = html;
        }

        function displayYesNoReading(data) {
            const resultContent = document.getElementById('resultContent');
            const card = data.card;
            const imageSrc = TAROT_IMAGES[card.image?.replace('.webp', '')] || '/static/tarot_cards/00_joker.webp';

            let html = `
                <div class="question">"${data.question || 'Sorunuz'}"</div>
                <div class="spread-type">${data.name}</div>
            `;

            if (data.remaining_chips !== undefined) {
                html += `<div style="text-align: center; color: #d4af37; margin-bottom: 15px;">💰 Kalan Jeton: ${data.remaining_chips}</div>`;
            }

            html += `
                <div class="yes-no-result">${data.answer}</div>

                <div class="card">
                    <div class="card-header">
                        <img src="${imageSrc}" alt="${card.name}" class="card-image">
                        <div class="card-title">
                            <h3>${card.name}</h3>
                            <div class="card-position">${card.position}</div>
                            <div class="card-number">#${card.number}</div>
                        </div>
                    </div>
                    <div class="interpretation">
                        <strong>Açıklama:</strong><br>${card.intro}
                    </div>
                </div>
            `;

            resultContent.innerHTML = html;
        }

        function display3CardReading(data) {
            const resultContent = document.getElementById('resultContent');
            let html = `
                <div class="question">"${data.question || 'Sorunuz'}"</div>
                <div class="spread-type">${data.name}</div>
            `;

            if (data.remaining_chips !== undefined) {
                html += `<div style="text-align: center; color: #d4af37; margin-bottom: 15px;">💰 Kalan Jeton: ${data.remaining_chips}</div>`;
            }

            html += '<div class="cards-grid">';

            data.spread.forEach((item, idx) => {
                const card = item.card;
                const imageSrc = TAROT_IMAGES[card.image?.replace('.webp', '')] || '/static/tarot_cards/00_joker.webp';
                html += `
                    <div class="card">
                        <div class="card-header">
                            <img src="${imageSrc}" alt="${card.name}" class="card-image">
                            <div class="card-title">
                                <div style="font-size: 0.8em; color: #8b5cf6;">📍 ${item.position}</div>
                                <h3>${card.name}</h3>
                                <div class="card-position">${card.position}</div>
                                <div class="card-number">#${card.number}</div>
                            </div>
                        </div>
                        <div class="card-content">
                            <div class="section">
                                <div class="section-title">📝 Anlam</div>
                                <div class="section-content">${card.intro}</div>
                            </div>
                            <div class="section">
                                <div class="section-title">✨ Gizli Mesaj</div>
                                <div class="section-content">${card.hidden}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultContent.innerHTML = html;
        }

        function display7CardReading(data) {
            const resultContent = document.getElementById('resultContent');
            let html = `
                <div class="question">"${data.question || 'Sorunuz'}"</div>
                <div class="spread-type">${data.name}</div>
            `;

            if (data.remaining_chips !== undefined) {
                html += `<div style="text-align: center; color: #d4af37; margin-bottom: 15px;">💰 Kalan Jeton: ${data.remaining_chips}</div>`;
            }

            html += '<div class="cards-grid">';

            data.spread.forEach((item, idx) => {
                const card = item.card;
                const imageSrc = TAROT_IMAGES[card.image?.replace('.webp', '')] || '/static/tarot_cards/00_joker.webp';
                html += `
                    <div class="card">
                        <div class="card-header">
                            <img src="${imageSrc}" alt="${card.name}" class="card-image">
                            <div class="card-title">
                                <div style="font-size: 0.8em; color: #8b5cf6;">📍 ${item.position}</div>
                                <h3>${card.name}</h3>
                                <div class="card-position">${card.position}</div>
                                <div class="card-number">#${card.number}</div>
                            </div>
                        </div>
                        <div class="card-content">
                            <div class="section">
                                <div class="section-title">📝 Anlam</div>
                                <div class="section-content">${card.intro}</div>
                            </div>
                            <div class="section">
                                <div class="section-title">💡 Tavsiye</div>
                                <div class="section-content">${card.weekly}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            resultContent.innerHTML = html;
        }

        // Enter tuşunda okuma başlat
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getReading('3-card');
        });
    </script>
</body>
</html>
