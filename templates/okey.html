<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okey VIP</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at top, #1a1512 0%, #050505 60%, #000 100%); color: #f5e6d3; font-family: Arial; min-height: 100vh; }
  .screen { display: none; width: 100%; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .screen.active { display: flex; }
  h1 { font-size: 54px; font-weight: bold; color: #d4af37; text-shadow: 0 0 30px rgba(212,175,55,0.8); margin-bottom: 30px; letter-spacing: 6px; text-align: center; }
  .card-box { background: rgba(26,26,26,0.98); border: 3px solid #d4af37; border-radius: 20px; padding: 40px; max-width: 460px; width: 100%; box-shadow: 0 0 50px rgba(212,175,55,0.4); }
  .label { display: block; color: #d4af37; font-weight: bold; margin-top: 18px; margin-bottom: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .input { width: 100%; padding: 14px; background: #0a0a0a; border: 2px solid #d4af37; color: #f5e6d3; border-radius: 10px; font-size: 15px; }
  .input:focus { outline: none; box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .avatar-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin: 14px 0; }
  .avatar-btn { aspect-ratio: 1; font-size: 22px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all .25s; }
  .avatar-btn:hover { background: rgba(60,60,60,0.9); transform: scale(1.05); }
  .avatar-btn.selected { background: #d4af37; box-shadow: 0 0 20px #d4af37; transform: scale(1.1); }
  .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d4af37, #a0860d); color: #1a1a1a; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; transition: all .25s; margin-top: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { transform: scale(1.02); box-shadow: 0 0 25px rgba(212,175,55,0.6); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.green { background: linear-gradient(135deg, #2d7a56, #1f5a42); color: #fff; }
  .btn.grey { background: #444; color: #f5e6d3; }
  .error { color: #ff6b6b; text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .lang-switch { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; max-width: 480px; }
  .lang-btn { padding: 7px 12px; background: rgba(40,40,40,0.8); border: 2px solid #d4af37; color: #f5e6d3; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .lang-btn.selected { background: #d4af37; color: #1a1a1a; box-shadow: 0 0 15px #d4af37; }
  .room-code { font-size: 44px; color: #d4af37; font-weight: bold; margin: 26px 0; letter-spacing: 3px; text-shadow: 0 0 20px rgba(212,175,55,0.6); text-align: center; }
  .players-list { background: rgba(10,10,10,0.8); border: 1px solid #d4af37; border-radius: 10px; padding: 14px; margin: 18px 0; max-height: 220px; overflow-y: auto; min-height: 60px; }
  .player-item { padding: 9px 4px; color: #f5e6d3; border-bottom: 1px solid rgba(212,175,55,0.3); font-size: 14px; display: flex; justify-content: space-between; }
  .player-item:last-child { border-bottom: none; }

  #gameScreen { padding: 14px; }
  .table-wrap { position: relative; width: min(980px, 96vw); height: min(500px, 62vh); margin: 0 auto; }
  .felt { position: absolute; inset: 0; border-radius: 50% / 42%; background: radial-gradient(ellipse at center, #1c7a45 0%, #0f5c33 55%, #08381f 100%); border: 14px solid #3a2410; box-shadow: 0 0 0 6px #1a1a1a, 0 20px 60px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,0,0,0.5); }
  .table-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; z-index: 3; display: flex; gap: 26px; align-items: center; }
  .center-pile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pile-label { font-size: 11px; color: #ffe08a; letter-spacing: 1px; text-transform: uppercase; }
  .pile-count { font-size: 12px; color: #d4af37; }
  .stack-btn { border: none; background: none; cursor: pointer; padding: 0; }
  .stack-btn:disabled { cursor: not-allowed; opacity: .5; }
  .indicator-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  .okey-tile { width: 42px; height: 58px; border-radius: 6px; background: linear-gradient(160deg,#fdf6e3,#f0e6c8); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); border: 1px solid #b8a97a; }
  .okey-tile.back { background: repeating-linear-gradient(45deg,#7a1c1c,#7a1c1c 6px,#5a1414 6px,#5a1414 12px); border: 2px solid #d4af37; }
  .okey-tile.small { width: 28px; height: 40px; font-size: 13px; border-radius: 4px; }
  .okey-tile.joker { font-size: 11px; color: #a0860d; letter-spacing: -0.5px; }
  .okey-tile.wild { box-shadow: 0 0 10px 2px rgba(212,175,55,0.9), 0 4px 10px rgba(0,0,0,0.6); }
  .okey-tile.hand-tile { cursor: pointer; transition: transform .15s; }
  .okey-tile.hand-tile:hover { transform: translateY(-8px); }
  .rack .okey-tile { touch-action: none; user-select: none; cursor: grab; }
  .rack .okey-tile.dragging { opacity: .65; transform: scale(1.1); z-index: 50; box-shadow: 0 0 16px rgba(212,175,55,0.9); }
  .rack .okey-tile.drop-target { box-shadow: 0 0 0 3px #3a9d6d; }

  .seat { position: absolute; width: 140px; transform: translate(-50%,-50%); text-align: center; z-index: 4; }
  .seat-box { background: rgba(10,10,10,0.88); border: 2px solid #6a5a2a; border-radius: 14px; padding: 8px 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .seat.turn .seat-box { border-color: #d4af37; box-shadow: 0 0 22px rgba(212,175,55,0.9); }
  .seat-avatar { font-size: 22px; }
  .seat-name { font-size: 12px; font-weight: bold; color: #f5e6d3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat-count { font-size: 11px; color: #d4af37; }
  .seat-tiles { display: flex; gap: 2px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }

  .side-panel { max-width: 980px; margin: 14px auto 0; background: rgba(26,26,26,0.9); border: 2px solid #d4af37; border-radius: 16px; padding: 14px 18px; }
  .turn-indicator { text-align: center; color: #d4af37; font-weight: bold; margin-bottom: 10px; min-height: 20px; }
  .rack { background: linear-gradient(180deg,#9a6a35,#6b4322 60%,#4a2d16); border: 3px solid #3d2612; border-radius: 12px; padding: 12px 16px 8px; margin-bottom: 10px; box-shadow: 0 10px 25px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.2), inset 0 -6px 10px rgba(0,0,0,.4); }
  .rack-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; min-height: 62px; padding: 4px 0; }
  .rack-row:first-child { border-bottom: 2px solid rgba(0,0,0,.35); padding-bottom: 8px; }
  .action-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
  .action-bar .btn { width: auto; padding: 12px 20px; margin-top: 0; }
  .action-log { color: #d4af37; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; opacity: .9; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 980px; margin: 0 auto 8px; font-size: 12px; color: #d4af37; }
  .top-bar button { background: none; border: 1px solid #d4af37; color: #d4af37; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .winner-box { text-align: center; }
  .winner-hand { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="lang-switch" id="langSwitch"></div>
  <h1>🀄 OKEY 🀄</h1>
  <div class="card-box">
    <label class="label" data-i18n="label_username">🎮 Ton Pseudo</label>
    <input type="text" id="username" class="input" data-i18n-placeholder="placeholder_username" placeholder="Entre ton nom">
    <label class="label" data-i18n="label_avatar">🀄 Choisis ton avatar</label>
    <div class="avatar-grid">
      <button class="avatar-btn selected" data-avatar="🀄">🀄</button>
      <button class="avatar-btn" data-avatar="🎩">🎩</button>
      <button class="avatar-btn" data-avatar="👑">👑</button>
      <button class="avatar-btn" data-avatar="🕶️">🕶️</button>
      <button class="avatar-btn" data-avatar="🐉">🐉</button>
      <button class="avatar-btn" data-avatar="🎲">🎲</button>
    </div>
    <button class="btn" id="createBtn" data-i18n="btn_create">➕ Créer une table</button>
    <label class="label" data-i18n="label_or_join">OU REJOIGNEZ</label>
    <input type="text" id="roomCode" class="input" data-i18n-placeholder="placeholder_room_code" placeholder="Code de la table">
    <button class="btn" id="joinBtn" data-i18n="btn_join">🔗 Rejoindre</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1 data-i18n="title_lobby">OKEY</h1>
  <div class="card-box">
    <div style="text-align:center;color:#d4af37;margin-bottom:8px;font-weight:bold;" data-i18n="label_room_code">CODE DE LA TABLE</div>
    <div class="room-code" id="roomCodeDisplay">OKY-XXXX</div>
    <div style="text-align:center;font-size:13px;color:#f5e6d3;" id="lobbyInfo"></div>
    <label class="label" data-i18n="label_players">👥 Joueurs</label>
    <div class="players-list" id="lobbyPlayersList"></div>
    <button class="btn green" id="startBtn" data-i18n="btn_start">🚀 Démarrer la partie</button>
    <button class="btn grey" id="addBotBtn" data-i18n="btn_add_bot">🤖 Ajouter un bot IA</button>
    <button class="btn grey" id="leaveLobbyBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="top-bar">
    <span id="tableInfo"></span>
    <button id="leaveTableBtn" data-i18n="btn_leave">🚪 Quitter</button>
  </div>
  <div class="table-wrap">
    <div class="felt"></div>
    <div class="table-center">
      <div class="indicator-box">
        <div class="pile-label" data-i18n="indicator_label">GÖSTERGE</div>
        <div id="indicatorTile"></div>
      </div>
      <div class="center-pile">
        <div class="pile-label" data-i18n="deck_label">PIOCHE</div>
        <button class="stack-btn" id="deckPileBtn"><div class="okey-tile back"></div></button>
        <div class="pile-count" id="deckCount"></div>
      </div>
      <div class="center-pile">
        <div class="pile-label" data-i18n="discard_label">DÉFAUSSE</div>
        <button class="stack-btn" id="discardPileBtn"><div id="discardTileWrap"><div class="okey-tile back"></div></div></button>
      </div>
    </div>
    <div id="seatsLayer"></div>
  </div>
  <div class="side-panel">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="rack">
      <div class="rack-row" id="handRowTop"></div>
      <div class="rack-row" id="handRowBottom"></div>
    </div>
    <div class="action-bar" id="rackToolbar" style="margin-bottom:8px;">
      <button class="btn grey" id="sortHandBtn" data-i18n="btn_sort_hand" style="width:auto;padding:8px 16px;margin-top:0;font-size:12px;">🔀 Trier</button>
    </div>
    <div class="action-bar" id="actionBar" style="display:none;">
      <button class="btn green" id="finishBtn" data-i18n="btn_finish">🎉 Bitti !</button>
    </div>
    <div class="action-bar" id="roundOverBar" style="display:none;">
      <div class="winner-box">
        <div id="winnerMsg" style="color:#d4af37;font-weight:bold;margin-bottom:8px;"></div>
        <div class="winner-hand" id="winnerHand"></div>
        <button class="btn green" id="nextHandBtn" data-i18n="btn_next_hand">▶️ Main suivante</button>
      </div>
    </div>
    <div class="action-log" id="actionLog"></div>
  </div>
</div>

const OKEY_LANGS = ['fr','en','es','de','it','nl','ru','ar','pt','pl','tr','ja','zh','ko'];
let lang = OKEY_LANGS.includes(getSiteLang()) ? getSiteLang() : 'fr';

function t(key, params) {
  const dict = I18N[lang] || I18N.fr;
  let str = dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
  if (params) Object.keys(params).forEach(k => { str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]); });
  return str;
}

function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
}

buildLangSelector(document.getElementById('langSwitch'), (code) => { lang = code; applyStaticI18n(); if (lastState) render(lastState); }, OKEY_LANGS);
applyStaticI18n();

const COLOR_MAP = {red:'#c0272d', yellow:'#c99a10', black:'#111', blue:'#1f5fbf'};
const COLOR_ORDER = {black:0, blue:1, red:2, yellow:3, joker:4};

function sortHand(tiles) {
  return [...tiles].sort((a, b) => {
    const ca = COLOR_ORDER[a.color], cb = COLOR_ORDER[b.color];
    if (ca !== cb) return ca - cb;
    return a.number - b.number;
  });
}

function tileHtml(tile, opts) {
  opts = opts || {};
  const cls = ['okey-tile'];
  if (opts.small) cls.push('small');
  if (opts.clickable) cls.push('hand-tile');
  const isWild = lastState && tile.color !== 'joker' && tile.color === lastState.okeyColor && tile.number === lastState.okeyNumber;
  if (isWild || tile.color === 'joker') cls.push('wild');
  if (tile.color === 'joker') {
    cls.push('joker');
    return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}">OKEY</div>`;
  }
  return `<div class="${cls.join(' ')}" data-tile-id="${tile.id}" style="color:${COLOR_MAP[tile.color]}">${tile.number}</div>`;
}

function attachTileDrag(el, tileId, discardable) {
  let startX = 0, startY = 0, moved = false, active = false, hoverTile = null, hoverBefore = true;
  el.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; moved = false; active = true; hoverTile = null;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', (e) => {
    if (!active) return;
    if (!moved && (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6)) moved = true;
    if (!moved) return;
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const targetTile = target && target.closest('.rack .okey-tile[data-tile-id]');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (targetTile && targetTile !== el) {
      hoverTile = targetTile;
      const rect = targetTile.getBoundingClientRect();
      hoverBefore = e.clientX < rect.left + rect.width / 2;
      targetTile.classList.add('drop-target');
    } else {
      hoverTile = null;
    }
  });
  el.addEventListener('pointerup', (e) => {
    if (!active) return;
    active = false;
    el.classList.remove('dragging');
    document.querySelectorAll('.rack .okey-tile.drop-target').forEach(x => x.classList.remove('drop-target'));
    if (moved && hoverTile) {
      const targetId = parseInt(hoverTile.dataset.tileId, 10);
      const fromIdx = myOrder.indexOf(tileId);
      if (fromIdx !== -1) {
        myOrder.splice(fromIdx, 1);
        let toIdx = myOrder.indexOf(targetId);
        if (toIdx !== -1) {
          myOrder.splice(hoverBefore ? toIdx : toIdx + 1, 0, tileId);
          if (lastState) render(lastState);
        } else {
          myOrder.splice(fromIdx, 0, tileId);
        }
      }
    } else if (!moved && discardable) {
      if (window.SFX) SFX.move();
      socket.emit('okey_discard', {code: room, username: user, tileId});
    }
  });
}

document.getElementById('sortHandBtn').addEventListener('click', () => {
  myOrder = sortHand(myHand).map(t => t.id);
  if (lastState) render(lastState);
});

function seatPositions(n) {
  const cx = 490, cy = 250, rx = 420, ry = 195, pts = [];
  for (let i = 0; i < n; i++) {
    const angle = Math.PI / 2 + (i * 2 * Math.PI / n);
    pts.push({x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle)});
  }
  return pts;
}

function render(state) {
  lastState = state;
  room = state.code;
  isOwner = state.owner === user;
  document.getElementById('tableInfo').textContent = `${state.code} — El #${state.handNo}`;

  if (!state.started) {
    show('lobbyScreen');
    document.getElementById('roomCodeDisplay').textContent = state.code;
    document.getElementById('lobbyInfo').textContent = t('waiting_players');
    document.getElementById('lobbyPlayersList').innerHTML = state.players.map(p => `<div class="player-item"><span>${p.token || '🀄'} ${p.name}</span><span>🏆 ${p.roundsWon}</span></div>`).join('');
    document.getElementById('startBtn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('addBotBtn').style.display = (isOwner && state.players.length < 4) ? 'block' : 'none';
    return;
  }
  show('gameScreen');

  document.getElementById('indicatorTile').innerHTML = state.indicator ? tileHtml(state.indicator, {small: true}) : '';
  document.getElementById('deckCount').textContent = state.deckCount;
  document.getElementById('discardTileWrap').innerHTML = state.discardTop ? tileHtml(state.discardTop, {small: false}) : '<div class="okey-tile back"></div>';

  const players = state.players;
  const myIdx = players.findIndex(p => p.name === user);
  const ordered = myIdx >= 0 ? players.slice(myIdx + 1).concat(players.slice(0, myIdx)) : players.filter(p => p.name !== user);
  const positions = seatPositions(Math.max(ordered.length, 1));
  const layer = document.getElementById('seatsLayer');
  layer.innerHTML = ordered.map((p, i) => {
    const pos = positions[i];
    const isTurn = state.turn === p.name;
    const backs = Array.from({length: Math.min(p.handCount, 8)}).map(() => '<div class="okey-tile back small"></div>').join('');
    return `<div class="seat${isTurn ? ' turn' : ''}" style="left:${pos.x}px;top:${pos.y}px;">
      <div class="seat-box">
        <div class="seat-avatar">${p.token || '🀄'}</div>
        <div class="seat-name">${p.name}</div>
        <div class="seat-count">${p.handCount} 🀄 · 🏆 ${p.roundsWon}</div>
        <div class="seat-tiles">${backs}</div>
      </div>
    </div>`;
  }).join('');

  const me = players.find(p => p.name === user);
  const myTurn = state.turn === user && state.stage === 'playing';
  if (window.SFX) {
    if (myTurn && !prevMyTurn) SFX.turn();
    if (state.stage === 'round_over' && prevStage !== 'round_over') SFX.win();
  }
  prevMyTurn = myTurn;
  prevStage = state.stage;
  document.getElementById('turnIndicator').textContent = myTurn
    ? (state.mustDiscard ? t('must_discard_hint') : t('must_draw_hint'))
    : (state.turn ? t('turn_other', {name: state.turn}) : '');
  document.getElementById('actionLog').textContent = state.log || '';

  const byId = Object.fromEntries(myHand.map(t => [t.id, t]));
  const orderedHand = myOrder.map(id => byId[id]).filter(Boolean);
  const mid = Math.ceil(orderedHand.length / 2);
  const clickable = myTurn && state.mustDiscard;
  document.getElementById('handRowTop').innerHTML = orderedHand.slice(0, mid).map(tile => tileHtml(tile, {clickable})).join('');
  document.getElementById('handRowBottom').innerHTML = orderedHand.slice(mid).map(tile => tileHtml(tile, {clickable})).join('');
  document.querySelectorAll('.rack .okey-tile[data-tile-id]').forEach(el => {
    attachTileDrag(el, parseInt(el.dataset.tileId, 10), clickable);
  });

  document.getElementById('deckPileBtn').disabled = !(myTurn && !state.mustDiscard);
  document.getElementById('discardPileBtn').disabled = !(myTurn && !state.mustDiscard) || !state.discardTop;
  document.getElementById('actionBar').style.display = (myTurn && state.mustDiscard) ? 'flex' : 'none';

  const over = state.stage === 'round_over';
  document.getElementById('roundOverBar').style.display = over ? 'flex' : 'none';
  if (over) {
    if (state.winningHand) {
      document.getElementById('winnerMsg').textContent = t('win_msg', {name: state.winningHand.name});
      document.getElementById('winnerHand').innerHTML = state.winningHand.hand.map(tile => tileHtml(tile, {small: true})).join('');
    } else {
      document.getElementById('winnerMsg').textContent = t('draw_msg');
      document.getElementById('winnerHand').innerHTML = '';
    }
  }
}

socket.on('okey_state', render);
socket.on('okey_your_hand', (d) => {
  myHand = d.hand || [];
  const newIds = new Set(myHand.map(t => t.id));
  myOrder = myOrder.filter(id => newIds.has(id));
  const known = new Set(myOrder);
  sortHand(myHand).forEach(t => { if (!known.has(t.id)) myOrder.push(t.id); });
  if (lastState) render(lastState);
});
socket.on('okey_error', (d) => {
  if (window.SFX) SFX.error();
  const msg = d.code ? t('err_' + d.code) : t('err_generic');
  document.getElementById('errorMsg').textContent = msg;
  alert(t('alert_prefix') + msg);
});
</script>

</body>
</html>
